         Put back a few cards ahead, not at the very end, so a word you could
         not produce comes round while you still remember being stuck. */
      if (misses[w.id] < 3) session.splice(Math.min(3, session.length), 0, w);
      else done++;
    }
    flipped = false;
    noteOpen = false;
    trOpen = false;
    fullOpen = false;
    counts();
    renderDue();
  }

  /* ------------------------------------------------------------------
     All words
     ------------------------------------------------------------------ */
  function renderAll() {
    var deck = $("fDeck").value, sort = $("fSort").value;
    var rows = here().filter(function (w) { return !deck || (w.deck || "Inbox") === deck; });

    /* Newest first, and always as the tiebreak: a comparator that never
       returns 0 leaves equal rows in whatever order the engine happens to
       produce, which looks like a shuffle. localeCompare so that naive and
       naïve sit together rather than ï sorting after z. */
    function newest(a, b) {
      var x = a.added || "", y = b.added || "";
      return x < y ? 1 : x > y ? -1 : 0;
    }
    rows.sort(function (a, b) {
      var r = 0;
      if (sort === "term") r = a.term.localeCompare(b.term, undefined, { sensitivity: "base" });
      else if (sort === "due") {
        var p = a.due || "", q = b.due || "";
        r = p < q ? -1 : p > q ? 1 : 0;
      } else if (sort === "box") r = (a.box || 1) - (b.box || 1);
      return r || newest(a, b);
    });

    $("allNote").textContent = rows.length + (rows.length === 1 ? " word" : " words");

    if (!rows.length) {
      $("tbl").innerHTML = '<p class="empty">Nothing here yet.</p>';
      return;
    }

    var deckNames = decks().map(function (d) { return d.name; });
    if (deckNames.indexOf("Inbox") < 0) deckNames.push("Inbox");

    var h = '<div class="tblwrap"><table><thead><tr><th>Word</th><th>Deck</th>'
          + '<th class="col-box">Box</th><th class="col-due">Due</th>'
          + '<th></th></tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++) {
      var w = rows[i];
      var first = w.senses && w.senses.length ? w.senses[0].text : "";
      h += '<tr>'
         + '<td><span class="w-term">' + esc(w.term) + '</span>'
         + ' <button class="speak sm" data-say="' + esc(w.id) + '" '
         + 'aria-label="Hear ' + esc(w.term) + '" title="Hear it">'
         + '<span aria-hidden="true">\u25b6</span></button>'
         + (w.say && w.say.ipa ? '<span class="ipa sm">' + esc(w.say.ipa) + '</span>' : '')
         + (otherForms(w).length
             ? '<span class="w-form">' + esc(otherForms(w).join(", ")) + '</span>' : '')
         /* slice before escaping, or a 110th character lands mid-entity */
         + (first ? '<span class="w-def">' + esc(String(first).slice(0, 110)) + '</span>' : '')
         + (w.note ? '<span class="w-note">' + esc(String(w.note).slice(0, 110)) + '</span>' : '')
         + '</td>'
         + '<td>' + deckSelect(w, deckNames) + '</td>'
         + '<td class="box-n col-box">' + (w.box || 1) + '/6</td>'
         + '<td class="w-when col-due">' + esc(w.due || "") + '</td>'
         + '<td style="text-align:right;white-space:nowrap">'
         + '<button class="btn-q" data-note="' + esc(w.id) + '" title="Write a note">'
         + (w.note ? 'Note \u00b7' : 'Note') + '</button> '
         + '<button class="btn-q" data-del="' + esc(w.id)
         + '" title="Remove this word" aria-label="Remove this word">'
         + '<span class="lbl-full">Remove</span>'
         + '<span class="lbl-tiny" aria-hidden="true">\u2715</span></button></td>'
         + '</tr>';

      if (editingNote === w.id) {
        h += '<tr class="noterow"><td colspan="5">'
           + '<textarea id="rowNote" placeholder="What it means in your own '
           + 'words, a way to remember it, the Turkish for it\u2026">'
           + esc(w.note || "") + '</textarea>'
           + '<div class="noteacts">'
           + '<button class="btn-q" data-note-save="' + esc(w.id) + '">Save</button>'
           + '<button class="btn-q" data-note-cancel="1">Cancel</button></div></td></tr>';
      }
    }
    $("tbl").innerHTML = h + '</tbody></table></div>';
  }

  /* The deck list is passed in, not recomputed: decks() walks every word, and
     calling it once per row made this quadratic — a second and a quarter of
     frozen page at a few hundred words. */
  function deckSelect(w, names) {
    var cur = w.deck || "Inbox", o = "", i;
    if (names.indexOf(cur) < 0) names = names.concat([cur]);
    for (i = 0; i < names.length; i++) {
      o += '<option value="' + esc(names[i]) + '"'
         + (names[i] === cur ? ' selected' : '') + '>' + esc(names[i]) + '</option>';
    }
    o += '<option value="__new">New deck…</option>';
    return '<select class="f" data-deck="' + esc(w.id) + '">' + o + '</select>';
  }

  /* ------------------------------------------------------------------
     Decks
     ------------------------------------------------------------------ */
  function renderSpaces() {
    var el = $("spaces"), h = "", i, L, n;
    for (i = 0; i < LANGS.length; i++) {
      L = LANGS[i];
      n = db.words.filter(function (w) { return (w.lang || "en") === L.code; }).length;
      h += '<button class="space' + (L.code === SPACE ? ' on' : '') + '" '
         + 'role="tab" aria-selected="' + (L.code === SPACE) + '" '
         + 'data-space="' + L.code + '">' + esc(L.label)
         + (n ? '<span class="space-n">' + n + '</span>' : '') + '</button>';
    }
    el.innerHTML = h;
  }

  $("spaces").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-space]") : null;
    if (b) setSpace(b.getAttribute("data-space"));
  });

  function renderAccount() {
    var el = $("account");
    if (!el || DEMO) return;
    if (!me) { el.innerHTML = ""; return; }
    if (!me.signedIn) {
      el.innerHTML = '<a class="btn-q" href="/auth/start">Sign in to sync</a>';
      return;
    }
    var when = syncing ? "syncing\u2026"
             : lastSync ? "synced" : "not synced yet";
    el.innerHTML = '<span class="who" title="' + esc(me.email || "") + '">'
                 + esc(me.email || "signed in") + ' \u00b7 ' + when + '</span>'
                 + ' <a class="btn-q" href="/auth/signout">Sign out</a>';
  }

  function renderDecks() {
    var list = decks();
    if (!list.length) {
      $("p-decks").innerHTML = '<div class="card"><p class="empty">'
        + 'Decks appear once you have words. Every word starts in <b style="display:inline">Inbox</b>.</p></div>';
      return;
    }
    var h = '<div class="card"><table><thead><tr><th>Deck</th><th>Words</th>'
          + '<th>Due today</th><th></th></tr></thead><tbody>';
    var t = today();
    for (var i = 0; i < list.length; i++) {
      var d = list[i];
      var due = db.words.filter(function (w) {
        return (w.deck || "Inbox") === d.name && (w.due || t) <= t;
      }).length;
      var editing = renaming === d.name;
      h += '<tr><td class="w-term">'
         + (editing
             ? '<input class="deckname" id="deckName" type="text" value="'
               + esc(d.name) + '" aria-label="Deck name" maxlength="40">'
             : esc(d.name))
         + '</td>'
         + '<td>' + d.n + '</td>'
         + '<td class="box-n">' + (due || "—") + '</td>'
         + '<td style="text-align:right;white-space:nowrap">'
         + (editing
             ? '<button class="btn-q" data-rensave="' + esc(d.name) + '">Save</button> '
               + '<button class="btn-q" data-rencancel="1">Cancel</button>'
             : '<button class="btn-q" data-rename="' + esc(d.name) + '">Rename</button>')
         + '</td></tr>';
    }
    $("p-decks").innerHTML = h + '</tbody></table></div>';
  }

  /* ------------------------------------------------------------------
     Add — by hand, by paste, and the bookmarklet
     ------------------------------------------------------------------ */
  /* The bookmarklet. Kept readable here and joined into one javascript: URL.

     Sentence boundaries are not just "a full stop": the decimal point in
     "$1.25 trillion" was being read as one, and the captured sentence began
     halfway through a number. A boundary is a stop followed by a space and
     not preceded by a digit or a lone capital. */
  var MARKLET = [
    "javascript:(function(){",
    "var s=window.getSelection(),t=(s?s.toString():'').trim();",
    "if(!t){alert('Select a word first, then click this.');return;}",
    "var sent='';try{",
    "var n=s.anchorNode,e=n&&(n.nodeType===1?n:n.parentElement);",
    "while(e&&e.textContent.length<40&&e.parentElement)e=e.parentElement;",
    "var x=(e?e.textContent:'').replace(/\\s+/g,' '),i=x.indexOf(t);",
    "var stop=function(k){var c=x.charAt(k);",
    "if(c!=='.'&&c!=='!'&&c!=='?')return false;",
    "if(!/\\s|$/.test(x.charAt(k+1)||' '))return false;",
    "var p=x.charAt(k-1);return !/[0-9]/.test(p)&&!/^[A-Z]$/.test(p);};",
    "if(i>-1){var a=0,k;",
    "for(k=i-1;k>0;k--){if(stop(k)){a=k+1;break;}}",
    "var b=x.length;",
    "for(k=i+t.length;k<x.length;k++){if(stop(k)){b=k+1;break;}}",
    "sent=x.slice(a,b).trim();}",
    "}catch(err){}",
    "window.open('", "ORIGIN", "/vocab/add#w='+encodeURIComponent(t)",
    "+'&s='+encodeURIComponent(sent.slice(0,400))",
    "+'&u='+encodeURIComponent(location.href)",
    "+'&t='+encodeURIComponent(document.title),'vocab','width=430,height=250');",
    "})()"
  ].join("");

  function marklet() {
    return MARKLET.replace("ORIGIN", location.origin);
  }

  function renderAdd() {
    $("p-add").innerHTML =
      '<div class="card">'
      + '<h2 style="margin:0 0 4px;font:500 19px/1.2 var(--f-display)">Save a word from anywhere</h2>'
      + '<p class="step" style="font-size:14px;color:var(--muted)">'
      + 'Drag this to your bookmarks bar. Then on any page: select a word and click it. '
      + 'Works in Chrome and Safari.</p>'
      + '<p style="margin:12px 0 4px"><a class="mark" id="mark" href="#">+ Save to Vocabulary</a></p>'
      + '<p class="step" style="font-size:13px;color:var(--faint);margin-top:10px">'
      + 'Safari hides the bookmarks bar by default &mdash; View › Show Favourites Bar.</p>'
      + '</div>'

      + '<div class="card" style="margin-top:14px">'
      + '<h2 style="margin:0 0 4px;font:500 19px/1.2 var(--f-display)">Or type them in</h2>'
      + '<p class="step" style="font-size:14px;color:var(--muted)">'
      + 'One word or phrase per line. Paste a list from anywhere.</p>'
      + '<textarea id="paste" placeholder="salient&#10;due diligence&#10;ubiquitous"></textarea>'
      + '<div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
      + '<select class="f" id="pasteDeck"></select>'
      + '<button class="btn" id="pasteGo">Add them</button>'
      + '</div></div>'

      + '<div class="card" style="margin-top:14px">'
      + '<h2 style="margin:0 0 4px;font:500 19px/1.2 var(--f-display)">Where your words live</h2>'
      + '<p class="step" style="font-size:14px;color:var(--muted);margin:0">'
      + 'In this browser, on this device. There is no account and no server holding them. '
      + 'The one thing that leaves is a single word at a time, sent to Wiktionary to ask '
      + 'what it means &mdash; your list, your sentences and the pages you took them from '
      + 'are never sent anywhere.</p>'
      + '</div>';

    var a = $("mark");
    a.setAttribute("href", marklet());
    a.addEventListener("click", function (e) {
      e.preventDefault();
      toast("Drag it to your bookmarks bar — clicking it here does nothing.");
    });

    fillDeckSelect($("pasteDeck"), "Inbox", true);
    $("pasteGo").addEventListener("click", addPasted);
  }

  function addPasted() {
    var lines = $("paste").value.split("\n");
    var deck = $("pasteDeck").value || "Inbox";
    if (deck === "__new") {
      deck = (prompt("Name the new deck") || "").trim() || "Inbox";
    }
    var added = 0, dup = 0, long = 0, junk = 0, i;
    for (i = 0; i < lines.length; i++) {
      var term = lines[i].trim().replace(/\s+/g, " ");
      if (!term) continue;
      /* A whole sentence is not a vocabulary word. Say so rather than
         dropping the line without a word about it. */
      if (term.length > 80) { long++; continue; }
      var r = addWord(term, deck, {});
      if (r === "added") added++;
      else if (r === "junk") junk++;
      else dup++;
    }
    if (!added && !dup && !long && !junk) { toast("Nothing to add."); return; }
    save();
    $("paste").value = "";
    counts(); renderAll(); renderDecks(); renderDue();
    toast(added + " added" + (dup ? ", " + dup + " already there" : "")
        + (long ? ", " + long + " too long to be a word" : "")
        + (junk ? ", " + junk + " with no letters in" : "") + ".");
  }

  /* Returns "added", "dup" or "junk" — the caller counts them separately, so
     a rejected line is not reported as one she already had. */
  function addWord(term, deck, src) {
    /* "???" is not a word, and Wiktionary will cheerfully define it. */
    if (!/[A-Za-z\u00C0-\u024F]/.test(term)) return "junk";
    /* Scoped to the language: "die" is an English verb and a German article,
       and saving one must not be refused because the other is already here.
       The id carries the language for the same reason. */
    var id = SPACE + ":" + idOf(term), i, mine = here();
    for (i = 0; i < mine.length; i++) {
      if (mine[i].id === id || hasForm(mine[i], term)) return "dup";
    }
    db.words.unshift({
      id: id, term: term, lang: SPACE, added: new Date().toISOString(),
      deck: deck || "Inbox", box: 1, due: today(),
      src: src || {}, senses: [], looked: false, note: "", forms: [term]
    });
    return "added";
  }

  function fillDeckSelect(sel, current, withNew) {
    var list = decks(), names = list.map(function (d) { return d.name; });
    if (names.indexOf("Inbox") < 0) names.unshift("Inbox");
    var o = "", i;
    for (i = 0; i < names.length; i++) {
      o += '<option value="' + esc(names[i]) + '"'
         + (names[i] === current ? ' selected' : '') + '>' + esc(names[i]) + '</option>';
    }
    if (withNew) o += '<option value="__new">New deck…</option>';
    sel.innerHTML = o;
  }

  /* ------------------------------------------------------------------
     Chrome
     ------------------------------------------------------------------ */
  function counts() {
    /* While a sitting is live the honest answer to "is there anything to do"
       is what is left in it — not the day's total, which over-promises at the
       start and reads as "finished" while a card is still on screen. */
    $("nDue").textContent = session.length || dueNow().length;
    $("nAll").textContent = here().length;
    $("nDecks").textContent = decks().length;
  }

  function fillFilter() {
    var cur = $("fDeck").value;
    var list = decks(), o = '<option value="">All decks</option>', i;
    for (i = 0; i < list.length; i++) {
      /* The value must be the deck name, not the label: the label carries a
         count, and a select with no value attribute reports its own text —
         so filtering compared "Inbox (8)" against "Inbox" and found nothing. */
      o += '<option value="' + esc(list[i].name) + '"'
         + (list[i].name === cur ? ' selected' : '') + '>'
         + esc(list[i].name) + ' (' + list[i].n + ')</option>';
    }
    $("fDeck").innerHTML = o;
  }

  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".tab") : null;
    if (!b) return;
    var k = b.getAttribute("data-tab"), keys = ["due", "all", "decks", "add"], i;
    for (i = 0; i < keys.length; i++) {
      var on = keys[i] === k;
      document.querySelector('.tab[data-tab="' + keys[i] + '"]').setAttribute("aria-selected", on ? "true" : "false");
      $("p-" + keys[i]).hidden = !on;
    }
    if (k === "all") { fillFilter(); renderAll(); }
    if (k === "decks") renderDecks();
    if (k === "add") renderAdd();
    if (k === "due") renderDue();
  });

  $("fDeck").addEventListener("change", renderAll);
  $("fSort").addEventListener("change", renderAll);

  document.addEventListener("click", function (e) {
    /* closest, not the target itself: a button with a span inside it would
       otherwise swallow the click, because the span carries no attribute. */
    var get = function (k) {
      var el = e.target.closest ? e.target.closest("[" + k + "]") : null;
      return el ? el.getAttribute(k) : null;
    };

    var sayId = get("data-say");
    if (sayId) {
      for (var si = 0; si < db.words.length; si++) {
        if (db.words[si].id === sayId) {
          var sw = db.words[si];
          /* Nothing fetched yet — get it, then play it, so the first press
             works rather than teaching her the button is broken. */
          if (!sw.say) ensureSay(sw, function () { speak(sw); renderAll(); renderDue(); });
          else speak(sw);
          break;
        }
      }
      return;
    }

    var noteId = get("data-note");
    if (noteId) {
      editingNote = (editingNote === noteId) ? null : noteId;
      renderAll();
      if (editingNote && $("rowNote")) $("rowNote").focus();
      return;
    }
    var saveId = get("data-note-save");
    if (saveId) {
      var box = $("rowNote"), k;
      for (k = 0; k < db.words.length; k++) {
        if (db.words[k].id === saveId) {
          db.words[k].note = box ? box.value.trim().slice(0, 2000) : "";
          toast(db.words[k].note ? "Note saved." : "Note cleared.");
        }
      }
      save(); editingNote = null; renderAll(); renderDue();
      return;
    }
    if (get("data-note-cancel")) { editingNote = null; renderAll(); return; }

    var del = get("data-del");
    if (del) {
      /* A tombstone, not a disappearance: a row that simply vanishes here is
         handed straight back by whichever device has not synced yet. */
      for (var dz = 0; dz < db.words.length; dz++) {
        if (db.words[dz].id === del) {
          db.gone = db.gone || [];
          db.gone.push({ id: del, deleted: true, updated: Date.now() });
          break;
        }
      }
      db.words = db.words.filter(function (w) { return w.id !== del; });
      session = session.filter(function (w) { return w.id !== del; });
      if (editingNote === del) editingNote = null;
      /* Turn the study card back over. Leaving it flipped showed the next
         word's back, and the lookup only fires from the front, so that
         card sat on "Looking it up..." for good. */
      flipped = false;
      save(); counts(); fillFilter(); renderAll(); renderDecks(); renderDue();
      toast("Removed.");
      return;
    }
    /* An inline field rather than prompt(). Chrome suppresses page dialogs
       outright once "prevent this page from creating additional dialogs" has
       been ticked, and then Rename silently did nothing at all. */
    var ren = get("data-rename");
    if (ren) {
      renaming = ren;
      renderDecks();
      var box = $("deckName");
      if (box) { box.focus(); box.select(); }
      return;
    }
    if (get("data-rencancel")) { renaming = null; renderDecks(); return; }
    var rs = get("data-rensave");
    if (rs) { saveDeckName(rs); return; }
  });

  function saveDeckName(was) {
    var box = $("deckName");
    var name = box ? box.value.trim().replace(/\s+/g, " ").slice(0, 40) : "";
    if (!name || name === was) { renaming = null; renderDecks(); return; }

    /* Renaming onto a name that exists merges the two decks, and there is no
       undo, so it is said out loud first. */
    var taken = false, dl = decks(), di;
    for (di = 0; di < dl.length; di++) if (dl[di].name === name) taken = true;
    var moving = 0;
    here().forEach(function (w) { if ((w.deck || "Inbox") === was) moving++; });
    if (taken && !confirm('“' + name + '” already exists. Merge '
          + moving + ' word' + (moving === 1 ? '' : 's') + ' into it?')) return;

    here().forEach(function (w) { if ((w.deck || "Inbox") === was) w.deck = name; });
    renaming = null;
    save(); renderDecks(); fillFilter(); renderAll(); counts();
    toast(taken ? "Merged." : "Renamed.");
  }

  /* Enter saves, Escape gives up — a text field should behave like one. */
  document.addEventListener("keydown", function (e) {
    if (!e.target || e.target.id !== "deckName") return;
    if (e.key === "Enter") { e.preventDefault(); saveDeckName(renaming); }
    else if (e.key === "Escape") { renaming = null; renderDecks(); }
  });

  document.addEventListener("change", function (e) {
    var id = e.target.getAttribute && e.target.getAttribute("data-deck");
    if (!id) return;
    var v = e.target.value;
    if (v === "__new") {
      v = (prompt("Name the new deck") || "").trim();
      if (!v) { renderAll(); return; }
    }
    db.words.forEach(function (w) { if (w.id === id) w.deck = v; });
    save(); fillFilter(); renderAll(); renderDecks(); counts();
    toast("Moved to " + v + ".");
  });

  $("theme").addEventListener("click", function () {
    var r = document.documentElement;
    var now = r.getAttribute("data-theme");
    var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = now ? (now === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
    r.setAttribute("data-theme", next);
    try { localStorage.setItem("vocab.theme", next); } catch (e) {}
  });

  $("export").addEventListener("click", function () {
    if (!db.words.length) { toast("Nothing to export yet."); return; }
    /* Deliberately every language: a backup of one space is not a backup. */
    var blob = new Blob([JSON.stringify(db, null, 1)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "vocabulary-" + today() + ".json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  });

  /* The other half of Export. Everything lives in one browser, so without
     this the export file is a dead end and a cleared browser loses the lot.
     Nothing already here is overwritten: an import can only add. */
  $("import").addEventListener("click", function () {
    if (DEMO) { toast("This is the demo \u2014 import is off here."); return; }
    $("file").click();
  });

  $("file").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = "";                 /* so the same file can be picked twice */
    if (!f) return;
    if (f.size > 8 * 1024 * 1024) { toast("That file is too big to be a word list."); return; }

    var r = new FileReader();
    r.onerror = function () { toast("Could not read that file."); };
    r.onload = function () {
      var parsed;
      try { parsed = JSON.parse(String(r.result)); }
      catch (err) { toast("That is not a vocabulary export \u2014 it is not JSON."); return; }

      var list = normalize(parsed && parsed.words);
      if (!list.length) { toast("No words in that file."); return; }

      var have = {}, i, ff, k;
      for (i = 0; i < db.words.length; i++) {
        have[db.words[i].id] = 1;
        /* an imported "plunged" is already here as a form of "plunge" */
        ff = formsOf(db.words[i]);
        for (k = 0; k < ff.length; k++) have[idOf(ff[k])] = 1;
      }

      var added = 0, skipped = 0;
      for (i = 0; i < list.length; i++) {
        if (have[list[i].id]) { skipped++; continue; }
        have[list[i].id] = 1;
        db.words.unshift(list[i]);
        added++;
      }

      if (!added) {
        toast("Nothing new \u2014 all " + skipped + " of those are already here.");
        return;
      }
      save();
      counts(); fillFilter(); renderAll(); renderDecks(); renderDue();
      toast(added + " word" + (added === 1 ? "" : "s") + " imported"
          + (skipped ? ", " + skipped + " already here and left alone" : "") + ".");
    };
    r.readAsText(f);
  });

  $("wipe").addEventListener("click", function () {
    /* The demo is embedded on the homepage. It writes nothing, so it has no
       business deleting anything either — and what it would delete is the
       visitor's own list, which cannot be got back. */
    if (DEMO) { toast("This is the demo \u2014 nothing here to clear."); return; }
    if (!confirm("Delete every word stored in this browser?")) return;
    db = { v: 1, words: [] };
    try { localStorage.removeItem(KEY); } catch (e) {}
    session = []; flipped = false;
    counts(); fillFilter(); renderAll(); renderDecks(); renderDue();
    toast("Cleared.");
  });

  /* ------------------------------------------------------------------
     Demo: invented words so the homepage card shows the real thing
     working. Writes nothing.
     ------------------------------------------------------------------ */
  function demoData() {
    var w = [
      ["salient", "Reading", "The report is not exhaustive, but it covers the salient points.",
       "https://example.com", "A note on strategy"],
      ["due diligence", "Finance", "The buyer walked away after due diligence turned up the lawsuit.",
       "https://example.com", "Deal memo"],
      ["ubiquitous", "Reading", "Screens are now ubiquitous in classrooms.",
       "https://example.com", "An essay on attention"],
      ["hedge", "Finance", "The fund used options to hedge against a fall in the lira.",
       "https://example.com", "Markets weekly"]
    ];
    var out = { v: 1, words: [] };
    for (var i = 0; i < w.length; i++) {
      out.words.push({
        id: idOf(w[i][0]), term: w[i][0],
        added: new Date(Date.now() - i * 86400000).toISOString(),
        deck: w[i][1], box: 1, due: today(),
        src: { sentence: w[i][2], url: w[i][3], title: w[i][4] },
        senses: [], looked: false, note: ""
      });
    }
    return out;
  }

  /* ------------------------------------------------------------------
     Boot
     ------------------------------------------------------------------ */
  try {
    var saved = localStorage.getItem("vocab.theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) {}

  load();
  counts();
  fillFilter();
  /* One way in: the Start screen, which says how many are waiting and how
     many this sitting will hold. Starting automatically here meant a reload
     dropped you straight onto a card while adding a word showed Start —
     the same situation with two different screens. The demo still opens on
     a card, because that is what the homepage is showing off. */
  renderSpaces();
  if (DEMO) startSession(); else renderDue();

  /* Offline. Registered last and failing silently: a browser without service
     workers, or one that refuses, simply has a page that needs the network. */
  if (!DEMO && "serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/vocab/sw.js", { scope: "/vocab/" })
        .catch(function () {});
    });
  }

  /* Last, and without blocking anything above it: the page is fully usable
     before this answers, and stays usable if it never does. */
  if (!DEMO) {
    fetch("/auth/me", { headers: { accept: "application/json" } })
      .then(function (r) { return r.json(); })
      .then(function (who) {
        me = who;
        renderAccount();
        if (me.signedIn) syncNow();
      })
      .catch(function () { me = { signedIn: false }; renderAccount(); });
  }
})();
</script>
</body>
</html>
