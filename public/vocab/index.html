<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlashCards has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="/flashcards/">
<!-- ============================================================
  FlashCards lives at /flashcards/ now. This page stays behind for the
  home-screen app, the bookmarklet, and any link already in the wild.

  Three things before it sends you on:

  - the query and the hash are carried across. The bookmarklet puts the
    captured word and the sentence it came from in the hash, and dropping
    them would lose the word she just saved.
  - the service worker that owned /vocab/ is unregistered, and its caches
    are deleted by name. Only its own: cache storage belongs to the origin,
    so a blanket delete would take the new app's offline copy with it.
  - it leaves anyway. Every step above is wrapped, and a timer runs behind
    all of it, because a redirect that waits on storage is a redirect that
    hangs when storage is blocked.
============================================================ -->
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100svh;display:flex;align-items:center;
       justify-content:center;padding:24px;
       background:#d9cfbe;color:#1f1c18;
       font:400 17px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme:dark){body{background:#1f1a15;color:#f6f1e9}}
  p{margin:0;text-align:center;max-width:30rem}
  a{color:#c05a2a}
  @media (prefers-color-scheme:dark){a{color:#e08b52}}
</style>
</head>
<body>
<p>FlashCards has moved to <a id="go" href="/flashcards/">simaydemiral.com/flashcards</a>.</p>
<script>
(function () {
  var to = "/flashcards/" + location.search + location.hash;
  var link = document.getElementById("go");
  if (link) link.href = to;
  var left = false;
  function leave() { if (!left) { left = true; location.replace(to); } }
  var jobs = [];
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) {
          return r.scope.indexOf("/vocab/") > -1 ? r.unregister() : null;
        }));
      }));
    }
    if (window.caches && caches.keys) {
      jobs.push(caches.keys().then(function (ks) {
        return Promise.all(ks.filter(function (k) {
          return /^vocab-/.test(k);
        }).map(function (k) { return caches.delete(k); }));
      }));
    }
  } catch (e) {}
  Promise.all(jobs).catch(function () {}).then(leave);
  setTimeout(leave, 1200);
})();
</script>
</body>
</html>
