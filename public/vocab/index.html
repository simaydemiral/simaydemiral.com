<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f%5B%5D=switzer@400,500,600&display=swap" rel="stylesheet">
<title>Vocabulary</title>
<meta name="description" content="Save a word from any page you are reading, and study it later.">
<meta name="theme-color" content="#d9cfbe">
<!-- Installable: Add to Home Screen gives it its own icon and opens it
     without Safari's chrome. The scope is /vocab/ so the app is the tool,
     not the whole site. -->
<link rel="manifest" href="/vocab/manifest.webmanifest">
<link rel="apple-touch-icon" href="/vocab/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vocab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171210'/%3E%3Crect x='14' y='16' width='36' height='26' rx='4' fill='none' stroke='%23e8935a' stroke-width='3'/%3E%3Cpath d='M22 50h20' stroke='%23e8935a' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M32 42v8' stroke='%23e8935a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- ============================================================
  VOCABULARY

  Two halves. A bookmarklet captures a word from whatever page she is
  reading, along with the sentence it sat in. This page studies them.

  Her list lives in this browser and goes nowhere. The one thing that
  does leave is a single word, sent to Wiktionary to ask what it means
  — said plainly on the page rather than glossed over, because the
  Ledger's "nothing leaves your computer" is not true here and should
  not be implied.
============================================================ -->
<style>
  :root{
    /* lifted from simaydemiral.com, same as the Ledger, so they read as
       one person's work */
    --ground:#d9cfbe; --surface:#f2ede2; --sunken:#e7e0d1;
    --ink:#1f1c18; --ink-2:#4b443c; --muted:#6a6157; --faint:#938a7d;
    --line:#d6cbb8; --line-soft:#e2dacb;
    --brand:#c05a2a; --brand-wash:#f7e9e0;
    --go:#4f7a52; --go-wash:#e6efe4;
    --warn:#b07a28; --warn-wash:#f8eeda;
    --f-body:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    /* Headings, matching the homepage. The serif above stays, for the word
       on the card itself. */
    --f-display:"Switzer","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
    --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(31,28,24,.05),0 8px 24px rgba(31,28,24,.07);
    --radius:12px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#1f1a15; --surface:#2b241d; --sunken:#352d24;
      --ink:#f6f1e9; --ink-2:#e2d9cc; --muted:#d4cabc; --faint:#9b9183;
      --line:#423830; --line-soft:#372f27;
      --brand:#e08b52; --brand-wash:#33230f;
      --go:#7fb384; --go-wash:#15251a;
      --warn:#dba85a; --warn-wash:#33260f;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --ground:#1f1a15; --surface:#2b241d; --sunken:#352d24;
    --ink:#f6f1e9; --ink-2:#e2d9cc; --muted:#d4cabc; --faint:#9b9183;
    --line:#423830; --line-soft:#372f27;
    --brand:#e08b52; --brand-wash:#33230f;
    --go:#7fb384; --go-wash:#15251a;
    --warn:#dba85a; --warn-wash:#33260f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
       font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
  .shell{max-width:860px;margin:0 auto;padding:24px 20px 72px;
         display:flex;flex-direction:column;gap:16px}

  .head{display:flex;justify-content:space-between;align-items:flex-start;
        gap:16px;flex-wrap:wrap}
  h1{font:500 30px/1.1 var(--f-display);margin:0;letter-spacing:-.03em}
  .sub{margin:4px 0 0;font-size:14px;color:var(--muted);max-width:46ch}
  .head-actions{display:flex;gap:8px;flex-wrap:wrap}

  .btn,.btn-q{font:inherit;font-size:13px;border-radius:8px;cursor:pointer;
    padding:7px 13px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);transition:border-color .15s,background .15s,color .15s}
  .btn{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
  .btn:hover{opacity:.9}
  .btn-q:hover{border-color:var(--brand);color:var(--brand)}
  .btn:disabled,.btn-q:disabled{opacity:.42;cursor:default}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);
        margin-bottom:10px;flex-wrap:wrap}
  .tab{border:0;background:transparent;color:var(--muted);font-size:13.5px;
       font-weight:600;padding:9px 13px;border-bottom:2px solid transparent;
       margin-bottom:-1px;cursor:pointer;font-family:inherit}
  .tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
  .tab-n{font:500 11px/1 var(--f-mono);color:var(--faint);margin-left:5px}

  .card{background:var(--surface);border:1px solid var(--line);
        border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
  .empty{color:var(--muted);text-align:center;padding:34px 10px;margin:0}
  .empty b{color:var(--ink);display:block;font-size:17px;margin-bottom:6px}

  /* ---------- the flashcard ---------- */
  .study{display:flex;flex-direction:column;align-items:center;gap:14px}
  .face{width:100%;min-height:230px;background:var(--surface);
        border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
        padding:28px 24px;display:flex;flex-direction:column;
        align-items:center;justify-content:center;text-align:center;
        cursor:pointer;user-select:none}
  .face:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .term{font:500 34px/1.15 var(--f-display);letter-spacing:-.03em;
        word-break:break-word}
  .tap{margin-top:14px;font-size:12px;color:var(--faint);
       text-transform:uppercase;letter-spacing:.14em;font-family:var(--f-mono)}
  .back{text-align:left;align-items:stretch;justify-content:flex-start;
        cursor:default}
  .back .term{font-size:25px;text-align:left;margin-bottom:2px}
  .via{margin-top:9px;font:500 11px/1 var(--f-mono);letter-spacing:.08em;
       color:var(--faint)}
  .seenas{margin-top:10px;font:500 11px/1 var(--f-mono);letter-spacing:.08em;
          color:var(--faint)}
  .w-form{margin-left:7px;font:500 11px/1 var(--f-mono);letter-spacing:.06em;
          color:var(--faint)}
  .sense{margin:10px 0 0;padding-left:0}
  .pos{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
       color:var(--brand);margin-bottom:3px}
  .def{margin:0 0 2px;color:var(--ink-2)}
  .eg{margin:3px 0 0;font-style:italic;color:var(--muted);font-size:14px}
  .ctx{margin-top:14px;padding:10px 12px;background:var(--brand-wash);
       border-left:2px solid var(--brand);border-radius:0 6px 6px 0;
       font-size:14px;line-height:1.55;color:var(--ink-2)}
  .ctx b{display:block;font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;
         text-transform:uppercase;color:var(--brand);margin-bottom:5px}
  .ctx a{color:inherit}
  .grade{display:flex;gap:10px;width:100%}
  .grade button{flex:1;padding:12px;font-size:14px;font-weight:600;
                border-radius:10px;cursor:pointer;font-family:inherit;border:1px solid}
  .no{background:var(--surface);border-color:var(--line);color:var(--ink)}
  .no:hover{border-color:var(--warn);color:var(--warn)}
  .mid{background:var(--surface);border-color:var(--line);color:var(--ink)}
  .mid:hover{border-color:var(--brand);color:var(--brand)}
  .yes{background:var(--go-wash);border-color:var(--go);color:var(--go)}
  .yes:hover{opacity:.85}
  .progress{font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}

  /* ---------- lists ---------- */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;
     text-transform:uppercase;color:var(--faint);padding:8px 8px;
     border-bottom:1px solid var(--line)}
  td{padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  tr:last-child td{border-bottom:0}
  .w-term{font-weight:600}
  .w-def{color:var(--muted);font-size:13px;display:block;margin-top:2px}
  .w-when{font-family:var(--f-mono);font-size:12px;color:var(--faint);white-space:nowrap}
  select.f{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);
           border-radius:8px;background:var(--surface);color:var(--ink)}
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .pill{display:inline-block;font:500 11px/1 var(--f-mono);letter-spacing:.1em;
        text-transform:uppercase;padding:4px 8px;border-radius:999px;
        background:var(--sunken);color:var(--muted)}
  .box-n{font-family:var(--f-mono);font-size:12px;color:var(--faint)}

  textarea{width:100%;min-height:120px;font:inherit;font-size:14px;padding:11px;
           border:1px solid var(--line);border-radius:8px;resize:vertical;
           background:var(--surface);color:var(--ink)}
  .mark{display:inline-block;padding:9px 15px;border:1px dashed var(--brand);
        border-radius:8px;color:var(--brand);font-weight:600;text-decoration:none;
        background:var(--brand-wash);cursor:grab}
  .step{margin:0 0 6px;color:var(--ink-2)}
  code{font-family:var(--f-mono);font-size:12.5px;background:var(--sunken);
       padding:1px 5px;border-radius:4px}

  #toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);
         background:var(--ink);color:var(--ground);padding:10px 16px;
         border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;
         transition:opacity .18s,transform .18s;z-index:50}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .keys{text-align:center;font:500 11px/1 var(--f-mono);letter-spacing:.1em;
        text-transform:uppercase;color:var(--faint);padding:2px 0 14px}
  .lbl-tiny{display:none}
  .termrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .say{display:flex;align-items:center;gap:8px}
  .speak{display:inline-flex;align-items:center;justify-content:center;
         width:30px;height:30px;padding:0;border:1px solid var(--line);
         border-radius:999px;background:var(--surface);color:var(--brand);
         font-size:11px;cursor:pointer;flex:0 0 auto;line-height:1}
  .speak:hover{border-color:var(--brand);background:var(--brand-wash)}
  .speak.sm{width:21px;height:21px;font-size:8px;vertical-align:middle;
            margin-left:5px}
  .ipa{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
  .ipa.sm{font-size:11.5px;margin-left:7px}
  .egbox{margin-top:13px;padding:10px 13px;background:var(--sunken);border-radius:9px}
  .egbox b{display:block;font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;
           text-transform:uppercase;color:var(--faint);margin-bottom:5px}
  .egtext{display:block;font-size:14.5px;line-height:1.5}
  .egfrom{display:block;margin-top:6px;font:500 10.5px/1 var(--f-mono);
          letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .spaces{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
  .space{font:inherit;font-size:13px;font-weight:600;padding:6px 13px;
         border:1px solid var(--line);border-radius:999px;cursor:pointer;
         background:var(--surface);color:var(--muted);font-family:inherit}
  .space:hover{color:var(--ink)}
  .space.on{background:var(--brand-wash);border-color:var(--brand);color:var(--brand)}
  .space-n{font:500 11px/1 var(--f-mono);margin-left:7px;opacity:.75}
  #account{display:inline-flex;align-items:center;gap:8px;margin-left:4px}
  #account a{text-decoration:none}
  .who{font-size:12.5px;color:var(--muted);max-width:230px;overflow:hidden;
       text-overflow:ellipsis;white-space:nowrap}
  .deckname{font:inherit;font-weight:600;padding:5px 8px;border-radius:7px;
            border:1px solid var(--brand);background:var(--surface);
            color:var(--ink);width:100%;max-width:230px}
  .yournote.tr b{color:var(--brand)}
  .trline{padding:4px 0}
  .trline + .trline{border-top:1px solid var(--line-soft);margin-top:2px}
  .trwords{display:block;font-size:15.5px;font-weight:600}
  .trsense{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
  .trfrom{margin-top:7px;font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;
          text-transform:uppercase;color:var(--faint)}
  .w-note{display:block;margin-top:3px;font-size:12.5px;color:var(--muted);
          border-left:2px solid var(--brand);padding-left:7px}
  .yournote{margin-top:14px;padding:11px 13px;background:var(--sunken);
            border-radius:9px;font-size:14px}
  .yournote b{display:block;font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;
              text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .yournote .notetext{white-space:pre-wrap}
  .yournote textarea,tr.noterow textarea{width:100%;min-height:70px;font:inherit;
            font-size:14px;padding:9px;border:1px solid var(--line);border-radius:8px;
            background:var(--surface);color:var(--ink);resize:vertical}
  .noteacts{display:flex;gap:6px;margin-top:8px}
  tr.noterow td{background:var(--sunken)}

  @media (max-width:560px){
    .shell{padding:18px 14px 60px}
    h1{font-size:26px}
    .term{font-size:28px}
    .face{min-height:190px;padding:22px 18px}
    /* On a phone the five columns overflowed the viewport and took Remove
       off-screen with them. Drop Box — it is on the card anyway — and let
       what is left scroll within its own box rather than moving the page. */
    .col-box{display:none}
    .tab{padding:9px 10px;font-size:13px}
    .tab-n{margin-left:4px}
    table{font-size:13px}
    td,th{padding:8px 6px}
    select.f{font-size:12.5px;padding:4px 6px;max-width:96px}
    /* so the whole row — word, deck, Note, Remove — fits 375px */
    #tbl .btn-q{padding:6px 9px;font-size:12.5px}
    .lbl-full{display:none}
    .lbl-tiny{display:inline}
    /* The note row sits inside a table wider than the screen. Pin it to the
       left edge and size the box to the viewport, so writing a note on a
       phone does not mean scrolling the table sideways to find the box. */
    tr.noterow td{position:sticky;left:0}
    tr.noterow textarea{max-width:calc(100vw - 56px)}
    /* Three columns' worth of room on a phone: the word, where it lives, and
       what you can do to it. The definition preview and the due date are both
       on the card itself, and keeping them here squeezed the word to a stub. */
    .col-due{display:none}
    .w-def{display:none}
    #tbl td:first-child{min-width:118px}
  }
</style>
</head>
<body>
<div class="shell">

  <div class="head">
    <div>
      <h1>Vocabulary</h1>
      <p class="sub">Save a word from whatever you are reading. Study it later,
        with the sentence you found it in.</p>
    </div>
    <div class="head-actions">
      <button class="btn-q" id="theme">Theme</button>
      <button class="btn-q" id="export">Export</button>
      <button class="btn-q" id="import">Import</button>
      <input type="file" id="file" accept="application/json,.json" hidden>
      <button class="btn-q" id="wipe">Clear all</button>
      <span id="account"></span>
    </div>
  </div>

  <div class="spaces" id="spaces" role="tablist" aria-label="Language"></div>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" aria-selected="true" data-tab="due">Study <span class="tab-n" id="nDue">0</span></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="all">All words <span class="tab-n" id="nAll">0</span></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="decks">Decks <span class="tab-n" id="nDecks">0</span></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="add">Add</button>
  </div>

  <section id="p-due"></section>

  <section id="p-all" hidden>
    <div class="filters">
      <select class="f" id="fDeck"></select>
      <select class="f" id="fSort">
        <option value="added">Newest first</option>
        <option value="term">A to Z</option>
        <option value="due">Due soonest</option>
        <option value="box">Least known</option>
      </select>
      <span class="box-n" id="allNote"></span>
    </div>
    <div class="card" style="padding:4px 10px"><div id="tbl"></div></div>
  </section>

  <section id="p-decks" hidden></section>

  <section id="p-add" hidden></section>

</div>
<div id="toast"></div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var KEY = "vocab.v1";
  var DEMO = /[?&]demo=1\b/.test(location.search);

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function toast(m) {
    var t = $("toast");
    t.textContent = m;
    t.className = "on";
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = ""; }, 2600);
  }

  /* ------------------------------------------------------------------
     Store. Same habits as the Ledger: never let a shape written by an
     older version stop the page booting, and never let blocked storage
     throw.
     ------------------------------------------------------------------ */
  var db = { v: 1, words: [] };

  /* Everything that comes from outside this session goes through here —
     storage written by an older build, and an imported file, which is just
     a text file someone could have edited. Drop what is not a word record,
     fill in what is missing, and distrust the source URL. */
  function normalize(list) {
    if (!Array.isArray(list)) return [];
    var out = [], i, w, src;
    for (i = 0; i < list.length; i++) {
      w = list[i];
      if (!w || typeof w !== "object") continue;
      if (typeof w.term !== "string" || !w.term.trim()) continue;
      w.term = w.term.trim().replace(/\s+/g, " ").slice(0, 80);
      /* Recompute rather than trust: the id is a hash of the term, and a
         hand-edited file whose id does not match would defeat deduping. */
      w.id = idOf(w.term);
      w.senses = Array.isArray(w.senses) ? w.senses : [];
      /* Forms arrive in a file someone could have hand-edited: strings only,
         and not an unbounded number of them. */
      w.plain = Array.isArray(w.plain) ? w.plain : null;
      w.forms = formsOf(w)
        .filter(function (x) { return typeof x === "string" && x.trim(); })
        .map(function (x) { return x.trim().replace(/\s+/g, " ").slice(0, 80); })
        .slice(0, 12);
      w.deck = (typeof w.deck === "string" && w.deck.trim()) ? w.deck.trim() : "Inbox";
      w.box = Math.min(BOXES, Math.max(1, Number(w.box) || 1));
      /* A due date is compared as a string, so a malformed one is never
         less than today and the word would wait forever. */
      w.due = /^\d{4}-\d{2}-\d{2}$/.test(w.due) ? w.due : today();
      w.note = typeof w.note === "string" ? w.note.slice(0, 2000) : "";
      /* Everything saved before there were spaces was English. */
      w.lang = (w.lang === "es" || w.lang === "de") ? w.lang : "en";
      /* An audio URL from a file is a URL like any other: http(s) only. */
      if (w.say && typeof w.say === "object") {
        w.say = { audio: safeUrl(w.say.audio).slice(0, 400),
                  ipa: typeof w.say.ipa === "string" ? w.say.ipa.slice(0, 80) : "",
                  us: !!w.say.us };
      } else { delete w.say; }
      if (w.tr && typeof w.tr === "object") {
        var tb = Array.isArray(w.tr.blocks) ? w.tr.blocks : [];
        w.tr = {
          blocks: tb.filter(function (b) {
            return b && typeof b === "object" && Array.isArray(b.words) && b.words.length;
          }).slice(0, 4).map(function (b) {
            return { sense: String(b.sense || "").slice(0, 160),
                     words: b.words.filter(function (x) { return typeof x === "string"; })
                                   .slice(0, 6).map(function (x) { return x.slice(0, 60); }) };
          }),
          one: typeof w.tr.one === "string" ? w.tr.one.slice(0, 120) : "",
          from: typeof w.tr.from === "string" ? w.tr.from.slice(0, 20) : ""
        };
      } else { delete w.tr; }
      if (w.eg && typeof w.eg === "object") {
        w.eg = { text: typeof w.eg.text === "string" ? w.eg.text.slice(0, 300) : "",
                 from: typeof w.eg.from === "string" ? w.eg.from.slice(0, 20) : "" };
      } else { delete w.eg; }
      src = (w.src && typeof w.src === "object") ? w.src : {};
      w.src = {
        url: safeUrl(src.url).slice(0, 400),
        title: typeof src.title === "string" ? src.title.slice(0, 200) : "",
        sentence: typeof src.sentence === "string" ? src.sentence.slice(0, 400) : ""
      };
      delete w._miss;   /* session state an earlier build saved; not data */
      out.push(w);
    }
    return out;
  }

  function load() {
    if (DEMO) { db = demoData(); return; }
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      /* An array, specifically. A truthy non-array ("words":"oops") used to
         pass this gate and then render neither cards nor an empty state. */
      if (d && Array.isArray(d.words)) {
        db = d;
        db.words = normalize(db.words);
        /* Written back, or storage keeps the pair and every load folds them
           again -- harmless, but it leaves the file disagreeing with what is
           on screen. */
        if (foldDuplicates()) save();
      }
    } catch (e) {
      /* corrupt or blocked storage — start empty rather than break */
    }
  }

  /* Words touched since the last save. Stamping only these, rather than the
     whole list, is what lets two devices merge: a word the phone did not
     touch keeps its old stamp and loses to the laptop's newer edit. */
  /* ------------------------------------------------------------------
     Sync.

     Local first, always. The list in this browser is the one the page reads
     and writes; the account is a copy that is reconciled with it. Signed out,
     or offline, or if the server is down, nothing here changes behaviour.

     The merge is a union, never a replacement. That matters most at the very
     first sign-in, when the account is empty and this browser holds years of
     words: pulling first would show an empty list and then save it over the
     top. So the local list goes up before anything comes down, and a word
     present in both is settled by whichever copy was edited later.
     ------------------------------------------------------------------ */
  var me = null;            /* { signedIn, email } once /auth/me has answered */
  var syncing = false, syncTimer = null, lastSync = 0;

  function syncSoon() {
    if (DEMO || !me || !me.signedIn) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncNow, 1200);   /* settle after a burst of edits */
  }

  function syncNow() {
    if (DEMO || syncing || !me || !me.signedIn) return;
    syncing = true;
    var payload = db.words.concat(db.gone || []);
    fetch("/api/sync", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ words: payload })
    })
      .then(function (r) {
        if (r.status === 401) { me = { signedIn: false }; throw new Error("signed out"); }
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(function (out) {
        syncing = false;
        if (!out || !Array.isArray(out.words)) return;
        absorb(out.words);
        lastSync = Date.now();
        renderAccount();
      })
      .catch(function () { syncing = false; renderAccount(); });
  }

  /* What came back replaces what is here only where it is newer. */
  function absorb(remote) {
    var byId = {}, i, w, changed = false;
    for (i = 0; i < db.words.length; i++) byId[db.words[i].id] = db.words[i];
    var gone = {};
    for (i = 0; i < (db.gone || []).length; i++) gone[db.gone[i].id] = db.gone[i].updated || 0;

    var keep = [];
    for (i = 0; i < remote.length; i++) {
      w = remote[i];
      if (!w || !w.id) continue;
      if (w.deleted) {
        /* Deleted elsewhere. Drop it here too, unless this device has since
           brought it back. */
        var local = byId[w.id];
        if (local && (local.updated || 0) > (w.updated || 0)) { keep.push(local); continue; }
        if (local) changed = true;
        delete byId[w.id];
        gone[w.id] = Math.max(gone[w.id] || 0, w.updated || 0);
        continue;
      }
      if (gone[w.id] && gone[w.id] >= (w.updated || 0)) continue;   /* deleted here, later */
      var here = byId[w.id];
      if (!here || (w.updated || 0) > (here.updated || 0)) { byId[w.id] = w; changed = true; }
    }
    for (var k in byId) keep.push(byId[k]);
    keep.sort(function (a, b) {
      var x = a.added || "", y = b.added || "";
      return x < y ? 1 : x > y ? -1 : 0;
    });
    db.words = normalize(keep);
    db.gone = [];
    for (var g in gone) db.gone.push({ id: g, deleted: true, updated: gone[g] });

    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
    if (changed) { counts(); fillFilter(); renderAll(); renderDecks(); renderDue(); }
  }

  var touched = {};

  function mark(id) { if (id) touched[id] = 1; }

  function save() {
    if (DEMO) return;
    var now = Date.now(), i, w;
    for (i = 0; i < db.words.length; i++) {
      w = db.words[i];
      if (touched[w.id] || !w.updated) w.updated = now;
    }
    touched = {};
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch (e) { toast("Could not save — browser storage is full or blocked."); }
    syncSoon();
  }

  /* Dates are local, not UTC. toISOString() would roll over at 5pm in
     California, so a card promoted by one day in the morning came back due
     the same evening. */
  function ymd(d) {
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m
                           + "-" + (day < 10 ? "0" : "") + day;
  }

  function today() { return ymd(new Date()); }

  function plus(days) {
    var d = new Date();
    d.setDate(d.getDate() + days);
    return ymd(d);
  }

  /* Only http(s) becomes a link. A captured "u=javascript:..." would
     otherwise run script in this origin, with the attacker choosing the
     link text too. esc() escapes the characters, not the scheme. */
  function safeUrl(u) {
    var t = String(u == null ? "" : u).trim();
    return /^https?:\/\//i.test(t) ? t : "";
  }

  function idOf(term) {
    var s = term.toLowerCase(), h = 5381, i;
    for (i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  /* ------------------------------------------------------------------
     Word forms. She meets "plunged" in a case and highlights that, but the
     word worth learning is "plunge". So the headword on a card is the lemma,
     and every form she has actually met is kept beside it: either spelling
     finds the card, and neither one makes a second card asking the same
     question.
     ------------------------------------------------------------------ */
  function formsOf(w) {
    return Array.isArray(w.forms) ? w.forms : [];
  }

  function hasForm(w, term) {
    var t = String(term || "").trim().toLowerCase(), f = formsOf(w), i;
    if (!t) return false;
    for (i = 0; i < f.length; i++) if (f[i].toLowerCase() === t) return true;
    return false;
  }

  function addForm(w, form) {
    var f = String(form || "").trim().replace(/\s+/g, " ").slice(0, 80);
    if (!f || hasForm(w, f)) return;
    w.forms = formsOf(w);
    if (w.forms.length < 12) w.forms.push(f);
  }

  /* Everything except the headword, which is what "met as" shows. */
  function otherForms(w) {
    var t = String(w.term || "").toLowerCase(), f = formsOf(w), out = [], i;
    for (i = 0; i < f.length; i++) if (f[i].toLowerCase() !== t) out.push(f[i]);
    return out;
  }

  function seenAsLine(w) {
    var f = otherForms(w);
    return f.length ? '<div class="seenas">met as ' + esc(f.join(", ")) + '</div>' : "";
  }

  /* Wiktionary files "plunged" as nothing but "past tense of plunge", so the
     card should ask "plunge" and remember she met it as "plunged". A form
     that earns its own definition is left alone: "whopping" is an adjective
     in its own right, so pointsTo() refuses to follow it and the trail comes
     back empty. This renames only -- folding two cards into one waits for a
     moment when no card is on screen. Returns true if the headword changed. */
  function relemma(w) {
    if (!w.via) return false;
    var hops = String(w.via).split("\u2192");
    var lemma = (hops[hops.length - 1] || "").trim();
    var was = String(w.term || "").trim();
    if (!lemma || lemma.toLowerCase() === was.toLowerCase()) return false;
    addForm(w, was);
    addForm(w, lemma);
    w.term = lemma;
    w.id = idOf(lemma);
    /* The recording and the IPA were fetched for the form she met, so a card
       that now reads "deem" would have shown /di:md/ and said "deemed".
       Dropping them has the pair fetched again for the headword. */
    w.say = null;
    /* Looked up under the old form, so it answered the wrong headword. */
    w.plain = null;
    return true;
  }

  /* Two cards asking the same word, which happens when "plunged" was added
     before "plunge" had been looked up. The card added first wins: it keeps
     its box and due date, so no progress is thrown away, and it inherits the
     other's forms, source, note and -- if it has none of its own -- senses. */
  function foldDuplicates() {
    var seen = {}, keep = [], i, k, o, w, f;
    for (i = db.words.length - 1; i >= 0; i--) {   /* oldest first */
      w = db.words[i];
      o = seen[w.id];
      if (!o) { seen[w.id] = w; keep.unshift(w); continue; }
      f = formsOf(w);
      for (k = 0; k < f.length; k++) addForm(o, f[k]);
      addForm(o, w.term);
      if (w.src && w.src.sentence && !(o.src && o.src.sentence)) o.src = w.src;
      if (w.note && !o.note) o.note = w.note;
      if (!o.senses.length && w.senses.length) {
        o.senses = w.senses; o.via = w.via || ""; o.looked = true;
      }
    }
    if (keep.length === db.words.length) return false;
    db.words = keep;
    session = session.filter(function (x) { return db.words.indexOf(x) >= 0; });
    return true;
  }

  /* ------------------------------------------------------------------
     Looking a word up. Wiktionary first: it knows phrases, which the
     other one does not — "due diligence" and "hedge fund" both fail
     there — and it ranks senses better. The second is asked only for
     an example sentence when Wiktionary has none.
     ------------------------------------------------------------------ */
  var WIKT = "https://en.wiktionary.org/api/rest_v1/page/definition/";
  var DICT = "https://api.dictionaryapi.dev/api/v2/entries/en/";
  var WIKI = "https://en.wikipedia.org/api/rest_v1/page/summary/";

  /* Wiktionary files words the way a dictionary does, not the way you meet
     them. "Evals" is capitalised and plural, so it 404s; "evals" answers
     "plural of eval", and "eval" answers "Abbreviation of evaluation" — two
     pointers and still no meaning. These are the pointers worth following. */
  var POINTER = new RegExp(
    "^(plural|abbreviation|initialism|acronym|clipping|alternative form|" +
    "alternative spelling|present participle|gerund|past tense|past participle|" +
    "third-person singular|simple past|comparative|superlative|synonym|" +
    "misspelling|inflection|form)\\b[^.]*?\\bof\\s+([A-Za-z][A-Za-z'\\u2019-]*)", "i");

  /* Wiktionary's own placeholder, and empty senses it sometimes emits. */
  function usable(text) {
    if (!text || text.length < 3) return false;
    if (/^this term needs a definition/i.test(text)) return false;
    return true;
  }

  function stripTags(s) {
    /* Whole elements first. Dropping only the tags leaves what was between
       them, which is how a stylesheet ended up inside a definition:
       "to speak .mw-parser-output .object-usage-tag{font-style:italic}". */
    return String(s || "")
      .replace(/<(style|script)\b[\s\S]*?<\/\1>/gi, "")
      .replace(/<[^>]+>/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  /* Wiktionary sometimes runs a citation straight onto the end of a
     definition — "Depicted in a leaping posture. Gules, a reindeer salient
     or (arms of Vagaa)." The first sentence is the meaning; the rest is
     provenance. Keep a second sentence only when the first is too short to
     stand alone. */
  function firstSentence(text) {
    /* No lookbehind: an older Safari cannot parse it, and a regex it cannot
       parse takes the whole script down, not just this line. */
    var m = /^([\s\S]*?[.!?])\s+[A-Z("\u2018\u201c]/.exec(text);
    if (!m) return text;
    var out = m[1];
    if (out.length < 28) {
      var rest = text.slice(m[1].length).trim();
      var m2 = /^([\s\S]*?[.!?])\s+[A-Z("\u2018\u201c]/.exec(rest);
      out += " " + (m2 ? m2[1] : rest);
    }
    return out.trim();
  }

  function fromWiktionary(json) {
    /* The endpoint groups a page by language, which is how one URL serves all
       three spaces: "casa" is listed under twenty of them, and only the one
       being studied is wanted. */
    var out = [], langs = json && json[SPACE], i, j;
    if (!langs) return out;
    for (i = 0; i < langs.length && out.length < 3; i++) {
      var defs = langs[i].definitions || [];
      for (j = 0; j < defs.length && out.length < 3; j++) {
        var text = firstSentence(stripTags(defs[j].definition));
        if (!usable(text)) continue;
        var eg = "";
        if (defs[j].parsedExamples && defs[j].parsedExamples.length) {
          eg = stripTags(defs[j].parsedExamples[0].example);
        } else if (defs[j].examples && defs[j].examples.length) {
          eg = stripTags(defs[j].examples[0]);
        }
        out.push({ pos: stripTags(langs[i].partOfSpeech) || "", text: text, example: eg });
      }
    }
    return out;
  }

  function fromDictionaryApi(json) {
    var out = [], i, j;
    if (!json || !json.length) return out;
    var ms = json[0].meanings || [];
    for (i = 0; i < ms.length && out.length < 3; i++) {
      var defs = ms[i].definitions || [];
      for (j = 0; j < defs.length && out.length < 3; j++) {
        if (!defs[j].definition) continue;
        out.push({
          pos: ms[i].partOfSpeech || "",
          text: defs[j].definition,
          example: defs[j].example || ""
        });
      }
    }
    return out;
  }

  /* ------------------------------------------------------------------
     How it sounds.

     The same dictionary that supplies an example also carries recordings and
     an IPA spelling. The recordings are named by accent — salient-us.mp3,
     salient-uk.mp3 — so the American one is picked by its suffix and the
     others are only a fallback. A word with no recording at all is still
     spoken, by the browser's own voice, which every machine has.
     ------------------------------------------------------------------ */
  function fromPhonetics(json) {
    if (!json || !json.length) return null;
    var us = "", any = "", ipa = "", i, j, ps;
    for (i = 0; i < json.length; i++) {
      if (!ipa && json[i].phonetic) ipa = json[i].phonetic;
      ps = json[i].phonetics || [];
      for (j = 0; j < ps.length; j++) {
        if (!ipa && ps[j].text) ipa = ps[j].text;
        var a = ps[j].audio || "";
        if (!a) continue;
        if (/-us\.mp3$/i.test(a)) { if (!us) us = a; }
        else if (!any) any = a;
      }
    }
    var src = us || any;
    if (!src && !ipa) return null;
    return { audio: src, ipa: ipa, us: !!us };
  }

  /* ------------------------------------------------------------------
     Turkish.

     Wiktionary keeps translation tables written by people, one per sense, so
     "prudent" gives ihtiyatlı for the careful sense and tutumlu for the
     thrifty one — the pairing is the useful part and it is free. Where there
     is no table, Wikipedia's language links name the Turkish article for the
     same thing, which is how a term like "hedge fund" gets an answer.

     Machine translation was tried and rejected: it returned çekirdek for
     quorum and ubikuitöz for ubiquitous. A wrong answer in a vocabulary tool
     is worse than no answer, so where neither source knows, it says so.
     ------------------------------------------------------------------ */
  var WIKT_RAW = "https://en.wiktionary.org/w/api.php?action=parse&prop=wikitext"
               + "&format=json&origin=*&redirects=1&page=";
  var WIKI_LL  = "https://en.wikipedia.org/w/api.php?action=query&prop=langlinks"
               + "&lllang=tr&format=json&origin=*&redirects=1&titles=";

  function trBlocks(wikitext) {
    var out = [], re = /\{\{trans-top\|([^}]*)\}\}([\s\S]*?)\{\{trans-bottom\}\}/g, m;
    while ((m = re.exec(wikitext))) {
      var sense = m[1].replace(/^id=[^|]*\|/, "").trim();
      var inner = m[2], t = /\{\{t\+?\|tr\|([^}|]+)/g, hit, seen = {}, words = [];
      while ((hit = t.exec(inner))) {
        var word = hit[1].trim();
        if (word && !seen[word]) { seen[word] = 1; words.push(word); }
      }
      if (words.length) out.push({ sense: sense, words: words.slice(0, 6) });
      if (out.length >= 4) break;
    }
    return out;
  }

  /* Two different outcomes that used to look identical. "Neither source has a
     Turkish entry" is an answer and is worth keeping. "I could not reach
     them" is not an answer at all, and saving it as one froze the word on
     that message for good — one blocked request and the word never asked
     again. Only a real answer is ever cached. */
  function viaTurkish(term) {
    var reached = false;
    return getJSON(WIKT_RAW + encodeURIComponent(term))
      .then(function (j) {
        reached = true;
        var wt = j && j.parse && j.parse.wikitext ? j.parse.wikitext["*"] : "";
        return trBlocks(wt || "");
      })
      .catch(function (e) {
        /* a 404 is Wiktionary saying it has no such page: asked and answered */
        if (e && e.status === 404) { reached = true; return []; }
        return [];
      })
      .then(function (blocks) {
        if (blocks.length) return { blocks: blocks, one: "", from: "Wiktionary" };
        return getJSON(WIKI_LL + encodeURIComponent(term))
          .then(function (j) {
            var pages = (j && j.query && j.query.pages) || {}, k, p;
            for (k in pages) { p = pages[k]; break; }
            var ll = p && p.langlinks && p.langlinks[0] && p.langlinks[0]["*"];
            if (ll) return { blocks: [], one: ll, from: "Wikipedia" };
            return { blocks: [], one: "", from: "none" };
          })
          .catch(function (e) {
            if ((e && e.status === 404) || reached) {
              return { blocks: [], one: "", from: "none" };
            }
            return { blocks: [], one: "", from: "", unreachable: true };
          });
      });
  }

  /* ------------------------------------------------------------------
     An example for every word.

     A word she caught with the bookmarklet arrives with the sentence she met
     it in, which is the best example there is. A word typed into the Add tab
     has nothing, and the dictionaries only sometimes carry one. Wiktionary's
     own usage examples fill the gap: {{ux|en|...}} is a short modern sentence
     written for the entry, and where there is none, a quoted passage from the
     citations will do. Same page the translations already read, so the
     browser usually has it cached.
     ------------------------------------------------------------------ */
  /* A page covers every language that spells the word this way — "casa" runs
     to twenty sections. Reading the whole page hands back a German example
     for a Spanish card, so everything below works on one section only. */
  function section(wikitext, wiktName) {
    var re = new RegExp("\\n==\\s*" + wiktName + "\\s*==\\n([\\s\\S]*?)(?=\\n==[^=]|$)");
    var m = re.exec("\n" + wikitext);
    return m ? m[1] : "";
  }

  function cleanWiki(t) {
    return String(t || "")
      .replace(/\[\[[^\]|]*\|([^\]]*)\]\]/g, "$1")   /* [[target|text]] */
      .replace(/\[\[([^\]]*)\]\]/g, "$1")              /* [[text]]        */
      .replace(/\{\{[^{}]*\}\}/g, "")                   /* leftover bits   */
      .replace(/<[^>]*>/g, "")
      .replace(/'''?/g, "")                             /* bold and italic */
      .replace(/\s+/g, " ")
      .trim();
  }

  function exampleFrom(wikitext, code) {
    code = code || SPACE;
    var sec = section(wikitext, lang(code).wikt);
    if (!sec) return null;
    wikitext = sec;
    var m, out;
    /* "uxa" is the Spanish and German habit and carries an English rendering
       after the sentence, which is more use than the sentence alone. */
    var ux = new RegExp("\\{\\{(?:ux|uxa|usex|uxi)\\|" + code + "\\|([\\s\\S]*?)\\}\\}", "g");
    while ((m = ux.exec(wikitext))) {
      out = cleanWiki(String(m[1]).split("|")[0]);
      if (out.length > 12 && out.length < 220) return { text: out, from: "Wiktionary" };
    }
    /* otherwise something somebody actually wrote */
    var q = /\|(?:passage|text)=([^|}]{25,240})/g;
    while ((m = q.exec(wikitext))) {
      out = cleanWiki(m[1]);
      if (out.length > 25 && out.length < 240) return { text: out, from: "Wiktionary" };
    }
    return null;
  }

  var exampling = {};

  /* Only asked for when the word has none of its own. */
  function hasExample(w) {
    if (w.src && w.src.sentence) return true;
    for (var i = 0; i < (w.senses || []).length; i++) {
      if (w.senses[i].example) return true;
    }
    return false;
  }

  function ensureExample(w, after) {
    if ((w.eg && w.eg.from) || exampling[w.id] || hasExample(w)) return;
    exampling[w.id] = 1;
    var term = w.term;
    if (w.via) {
      var hops = w.via.split("\u2192");
      term = hops[hops.length - 1].trim() || w.term;
    }
    getJSON(WIKT_RAW + encodeURIComponent(term.toLowerCase()))
      .then(function (j) {
        var wt = j && j.parse && j.parse.wikitext ? j.parse.wikitext["*"] : "";
        return exampleFrom(wt || "", SPACE);
      })
      .then(function (eg) {
        delete exampling[w.id];
        /* "none" is an answer and is kept; a failed request is not, so it is
           not written down and the next flip tries again. */
        w.eg = eg || { text: "", from: "none" };
        save();
        if (after) after();
      })
      .catch(function () { delete exampling[w.id]; });
  }

  var translating = {};

  function ensureTurkish(w, after) {
    /* `from` is what makes it an answer: Wiktionary, Wikipedia, or none.
       A record saved by the older build has from:"" — that was a failure
       wearing an answer's clothes, so it is retried rather than believed. */
    if ((w.tr && w.tr.from) || translating[w.id]) return;
    translating[w.id] = 1;
    /* The word the dictionary actually settled on: "Evals" resolves through
       eval to evaluation, and that is the one with a translation table. */
    var term = w.term;
    if (w.via) {
      var hops = w.via.split("\u2192");
      term = hops[hops.length - 1].trim() || w.term;
    }
    viaTurkish(term.toLowerCase()).then(function (tr) {
      delete translating[w.id];
      if (tr.unreachable) {
        /* Not written down: the next press asks again. */
        trFailed = true;
      } else {
        trFailed = false;
        w.tr = tr;
        save();
      }
      if (after) after();
    });
  }

  var saying = {};

  /* Kept apart from the definition lookup on purpose: words saved before this
     existed are already marked looked-up, so asking there would have left all
     of them silent for good. */
  function ensureSay(w, after) {
    /* Settled already, or still in flight: nothing changed, so do not call
       back. The callback redraws, the redraw asks again, and an answer that
       arrives instantly turns that into a loop with no end. */
    if (w.say || saying[w.id]) return;
    /* The recordings and IPA come from an English-only dictionary. For the
       other two the browser says the word itself, in that language's voice,
       which every machine can do. */
    if ((w.lang || "en") !== "en") {
      w.say = { audio: "", ipa: "", us: false };
      save();
      if (after) after();
      return;
    }
    /* The dictionary has no entry for a phrase, so there is no recording to
       fetch — but it still gets a settled answer, or the guard above never
       becomes true and every redraw asks again. The browser can still say it. */
    if (/\s/.test(w.term)) {
      w.say = { audio: "", ipa: "", us: false };
      save();
      if (after) after();
      return;
    }
    saying[w.id] = 1;
    getJSON(DICT + encodeURIComponent(w.term.trim().toLowerCase()))
      .then(fromPhonetics)
      .catch(function () { return null; })
      .then(function (say) {
        delete saying[w.id];
        w.say = say || { audio: "", ipa: "", us: false };
        save();
        if (after) after();
      });
  }

  var player = null;

  function speak(w) {
    var src = w.say && w.say.audio;
    if (src) {
      try {
        if (player) player.pause();
        player = new Audio(src);
        player.play().catch(function () { voice(w.term, w.lang); });
        return;
      } catch (e) { /* fall through to the browser's voice */ }
    }
    voice(w.term, w.lang);
  }

  /* No recording: say it with the browser. Prefer an American voice, since
     that is the one she is listening for. */
  function voice(term, code) {
    try {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      var want = lang(code).voice;
      var u = new SpeechSynthesisUtterance(term);
      u.lang = want;
      var vs = window.speechSynthesis.getVoices() || [], i;
      /* An exact match first, then any voice for the same language: a Mac may
         have es-MX and no es-ES, and Mexican Spanish is a great deal better
         than reading Spanish aloud in an American accent. */
      for (i = 0; i < vs.length; i++) if (vs[i].lang === want) { u.voice = vs[i]; break; }
      if (!u.voice) {
        for (i = 0; i < vs.length; i++) {
          if (vs[i].lang && vs[i].lang.slice(0, 2) === want.slice(0, 2)) { u.voice = vs[i]; break; }
        }
      }
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function getJSON(url, tries) {
    tries = tries || 1;
    return fetch(url, { mode: "cors" }).then(function (r) {
      if (!r.ok) {
        var err = new Error(r.status);
        err.status = r.status;           /* 404 means "no such page", which is
                                            an answer; 5xx means try again */
        throw err;
      }
      return r.json();
    }).catch(function (e) {
      var worth = !e.status || e.status === 429 || e.status >= 500;
      if (tries >= 3 || !worth) throw e;
      return new Promise(function (go) { setTimeout(go, 600 * tries); })
        .then(function () { return getJSON(url, tries + 1); });
    });
  }

  function wiktionary(term) {
    var slug = encodeURIComponent(String(term).trim().replace(/\s+/g, "_"));
    return getJSON(WIKT + slug).then(fromWiktionary).catch(function () { return []; });
  }

  /* ------------------------------------------------------------------
     Plain English. The full dictionary explains "deem" as "to adjudge as a
     conclusion", which is no help at all to someone meeting both words for
     the first time. Simple English Wiktionary writes for learners -- "If you
     deem something safe, necessary, important, etc., you judge it to be that
     way" -- and throws in example sentences.

     Its REST definition endpoint is not deployed there (501), so this goes
     through the action API, whose extract is plain text: a "== Verb =="
     heading, a definition, then any number of examples using the word. A
     line opening with a usage label in brackets, or with one of the frames
     these entries are written in, starts a new sense; the line after a
     definition is its example. Matching on "The" or "A" would have read
     "The FBI vets all nominees" as a definition of its own.
     ------------------------------------------------------------------ */
  var SIMPLE = "https://simple.wiktionary.org/w/api.php?action=query&prop=extracts"
             + "&explaintext=1&format=json&origin=*&titles=";

  var POS_HEAD = new RegExp("^==\\s*(Noun|Verb|Adjective|Adverb|Interjection|"
               + "Preposition|Conjunction|Pronoun|Determiner|Phrase|Idiom)\\s*==$", "i");
  var FRAME = /^(if |when |you use )/i;
  var ASIDE = /^(synonyms?|antonyms?|related words?|usage|other words?|notes?)\s*:/i;

  function fromSimple(extract) {
    var lines = String(extract || "").split("\n"), out = [], pos = "", last = null, i, t, m;
    for (i = 0; i < lines.length; i++) {
      t = lines[i].trim();
      if (!t) continue;
      m = POS_HEAD.exec(t);
      if (m) { pos = m[1]; last = null; continue; }
      /* any other heading -- Pronunciation, Etymology -- ends the section */
      if (t.charAt(0) === "=") { pos = ""; last = null; continue; }
      if (!pos || ASIDE.test(t)) continue;
      if (!last || t.charAt(0) === "(" || FRAME.test(t)) {
        last = { pos: pos, text: t, example: "" };
        out.push(last);
      } else if (!last.example) {
        last.example = t;
      }
    }
    return out;
  }

  function viaSimple(term) {
    /* An English dictionary. Asked about "casa" it answers with the English
       slang sense, which is not what a Spanish card is for. */
    if (SPACE !== "en") return Promise.resolve([]);
    var slug = encodeURIComponent(String(term).trim().replace(/\s+/g, "_"));
    return getJSON(SIMPLE + slug).then(function (d) {
      var pages = d && d.query && d.query.pages, k, p = null;
      for (k in pages) {
        if (Object.prototype.hasOwnProperty.call(pages, k)) { p = pages[k]; break; }
      }
      return (p && p.extract) ? fromSimple(p.extract) : [];
    }).catch(function () { return []; });
  }

  /* Asked for once the headword has settled, so "plunged" is looked up as
     "plunge". An empty array means asked and not found, which is why the
     guard tests for the property rather than its length. */
  var plaining = {};
  function ensurePlain(w, after) {
    if (w.plain || plaining[w.id]) return;
    plaining[w.id] = 1;
    viaSimple(w.term).then(function (senses) {
      delete plaining[w.id];
      w.plain = senses;
      save();
      if (after) after();
    });
  }

  /* A sense that is only a pointer: "plural of eval" and nothing else. One
     that explains as well as points — "Initialism of retrieval-augmented
     generation: a method of…" — is already an answer and is left alone. */
  function pointsTo(sense) {
    var m = POINTER.exec(sense.text);
    if (!m) return "";
    var after = sense.text.slice(m[0].length).replace(/[\s.,;:]+/g, "");
    return after.length > 18 ? "" : m[2];
  }

  /* Try the word as written, then lower case, then follow where it points —
     twice at most, which is enough for evals → eval → evaluation. */
  function viaWiktionary(term, trail, hops) {
    trail = trail || [term];
    hops = hops || 0;
    return wiktionary(term).then(function (senses) {
      if (!senses.length && term !== term.toLowerCase() && hops === 0) {
        return viaWiktionary(term.toLowerCase(), trail, hops);
      }
      if (!senses.length) return { senses: [], trail: trail };
      /* Wiktionary lists the primary sense first, and only that one decides.
         "Deemed" leads with "simple past and past participle of deem", so
         the road to a meaning runs through "deem". "Mere" leads with "Just,
         only; no more than" -- a meaning in its own right -- so the dialect
         sense nine places down reading "Synonym of inlet, an arm of the sea"
         is left where it is. Reading the whole list instead of just the head
         answered a different word entirely. */
      var next = pointsTo(senses[0]);
      if (next && hops < 2 && trail.indexOf(next) < 0) {
        trail = trail.concat([next]);
        return viaWiktionary(next, trail, hops + 1).then(function (r) {
          if (!r.senses.length) return { senses: senses, trail: trail };
          /* Whatever the form means in its own right is kept after what it
             points at: "vetted" points at "vet" and also carries "having
             undergone an investigation and been approved", worth having on
             the card. Pure pointers are dropped -- "simple past of vet"
             says nothing once "vet" itself is there. */
          var own = senses.filter(function (x) { return !pointsTo(x); });
          return { senses: r.senses.concat(own), trail: trail };
        });
      }
      return { senses: senses, trail: trail };
    });
  }

  /* Last resort for jargon and proper nouns no dictionary carries: an
     encyclopaedia does. "Evals" is not a dictionary word; "RAG" is not
     either, but both have an article. */
  function viaWikipedia(term) {
    var slug = encodeURIComponent(String(term).trim().replace(/\s+/g, "_"));
    return getJSON(WIKI + slug).then(function (d) {
      if (!d || !d.extract || d.type === "disambiguation") return [];
      return [{ pos: "Wikipedia", text: firstSentence(d.extract), example: "" }];
    }).catch(function () { return []; });
  }

  /* Returns a promise for the senses; never rejects — a word nobody
     knows is kept as it is rather than guessed at. */
  function lookup(term) {
    /* Where the pointer chain ended up: "Evals" resolves to "evaluation", and
       the second dictionary should be asked about that, not the original. */
    var resolved = term.trim();
    return viaWiktionary(term.trim())
      .then(function (r) {
        if (r.trail && r.trail.length) resolved = r.trail[r.trail.length - 1];
        if (r.senses.length) {
          if (r.trail.length > 1) r.senses.via = r.trail.join(" \u2192 ");
          return r.senses;
        }
        return viaWikipedia(term).then(function (w) {
          if (w.length) return w;
          /* one more: the singular, for plurals no dictionary lists */
          var sing = term.trim().replace(/ies$/i, "y").replace(/(ses|xes|zes|ches|shes)$/i, "")
                         .replace(/s$/i, "");
          if (sing && sing.toLowerCase() !== term.trim().toLowerCase() && sing.length > 2) {
            return viaWikipedia(sing);
          }
          return [];
        });
      })
      .then(function (senses) {
        var needsExample = !senses.length || !senses.some(function (s) { return s.example; });
        if (!needsExample) return senses;
        if (senses.length && senses[0].pos === "Wikipedia") return senses;
        /* An English dictionary, so only an English card may borrow from it.
           The Spanish entry for "casa" carries no example, and reaching here
           lent it the English slang one: "Get out of my casa!". */
        if (SPACE !== "en") return senses;
        /* one word only: the second source does not do phrases */
        if (/\s/.test(term.trim())) return senses;
        return getJSON(DICT + encodeURIComponent(resolved))
          .then(fromDictionaryApi)
          .then(function (more) {
            if (!senses.length) return more;
            /* keep Wiktionary's wording, borrow an example */
            var eg = "";
            for (var i = 0; i < more.length; i++) { if (more[i].example) { eg = more[i].example; break; } }
            if (eg) senses[0].example = senses[0].example || eg;
            return senses;
          })
          .catch(function () { return senses; });
      });
  }

  var looking = {};
  function ensureLooked(w, after) {
    if (w.looked || looking[w.id]) { if (after) after(); return; }
    looking[w.id] = 1;
    lookup(w.term).then(function (senses) {
      delete looking[w.id];
      w.senses = senses;
      /* a custom property on an array does not survive JSON, so the trail
         lives on the word */
      w.via = senses.via || "";
      w.looked = true;
      var renamed = relemma(w);
      /* Folding takes a card away, so it waits until none is on screen. */
      var folded = (renamed && !session.length) ? foldDuplicates() : false;
      save();
      if (after) after();
      if (renamed || folded) { counts(); renderAll(); renderDecks(); }
    });
  }

  /* ------------------------------------------------------------------
     Spacing. Leitner boxes: knew it moves up, missed it goes back to
     the start. Deliberately not SM-2 — five intervals is enough for a
     few hundred words and can be explained in one line.
     ------------------------------------------------------------------ */
  /* How long until a word comes back, by what you said about it.

     "Not yet" is 0 — still due today. That is what makes a second sitting on
     the same day worth starting: the words you could not produce are waiting
     in it, and they keep waiting until you answer one of the other two. The
     ladder that used to stretch 1/3/7/16/35 is gone; the answer decides the
     gap, not how many times the word has survived. */
  var GAP = { no: 0, mid: 2, yes: 16 };

  var BOXES = 6;

  /* Box 1 is "new or just missed". Boxes 2..6 carry the five intervals, so
     the first word you know comes back in a day and the ladder is actually
     1, 3, 7, 16, 35 rather than starting at 3.

       "no"   you did not have it        -> back to the start, tomorrow
       "mid"  you had it, but barely     -> holds the gap it already earned
       "yes"  you had it                 -> the next gap up

     Holding rather than demoting on "mid": the answer was right, and taking
     away a gap you had already earned punishes honesty about being shaky. */
  function grade(w, how) {
    var box = w.box || 1;
    /* The box no longer sets the gap — it is kept as a record of how well
       she knows the word, which the list sorts and shows. */
    if (how === "yes")      w.box = Math.min(BOXES, box + 1);
    else if (how === "mid") w.box = Math.max(2, box);
    else                    w.box = 1;
    w.due = plus(GAP[how] === undefined ? 0 : GAP[how]);
    w.seen = (w.seen || 0) + 1;
    save();
  }

  /* ------------------------------------------------------------------
     Three languages, three spaces.

     One stored list underneath, because sync, export and import should carry
     everything a person has. What makes them feel separate is that every
     screen reads `here()` rather than db.words: the study queue, the decks,
     the counts and the list all stop at the edge of the language you are in.
     A word saved before any of this has no language and is English, which is
     what it was.
     ------------------------------------------------------------------ */
  var LANGS = [
    { code: "en", label: "English",  wikt: "English", voice: "en-US" },
    { code: "es", label: "Espa\u00f1ol", wikt: "Spanish", voice: "es-ES" },
    { code: "de", label: "Deutsch",  wikt: "German",  voice: "de-DE" }
  ];

  var SPACE = "en";
  try {
    var savedSpace = localStorage.getItem("vocab.space");
    for (var li = 0; li < LANGS.length; li++) {
      if (LANGS[li].code === savedSpace) SPACE = savedSpace;
    }
  } catch (e) {}

  function lang(code) {
    for (var i = 0; i < LANGS.length; i++) {
      if (LANGS[i].code === (code || SPACE)) return LANGS[i];
    }
    return LANGS[0];
  }

  /* The words of the language you are currently in. */
  function here() {
    return db.words.filter(function (w) { return (w.lang || "en") === SPACE; });
  }

  function setSpace(code) {
    if (code === SPACE) return;
    SPACE = code;
    try { localStorage.setItem("vocab.space", code); } catch (e) {}
    /* A sitting belongs to the language it started in. */
    session = []; done = 0; misses = {}; almost = {};
    flipped = false; noteOpen = false; trOpen = false;
    renderSpaces(); counts(); fillFilter();
    renderAll(); renderDecks(); renderDue();
  }

  function dueNow() {
    var t = today();
    return here().filter(function (w) { return (w.due || t) <= t; });
  }

  function decks() {
    var seen = {}, out = [];
    here().forEach(function (w) {
      var d = w.deck || "Inbox";
      if (!seen[d]) { seen[d] = 0; out.push(d); }
      seen[d]++;
    });
    out.sort();
    return out.map(function (d) { return { name: d, n: seen[d] }; });
  }

  /* ------------------------------------------------------------------
     Study
     ------------------------------------------------------------------ */
  var session = [], flipped = false, done = 0, total = 0;
  /* Each answer rebuilds the card, which throws away whatever was
     focused. Keep the keyboard where she left it. */
  var keyboarding = false;
  /* How many times a card has come round this sitting. Kept beside the words
     rather than on them, so it never reaches storage or an export. */
  var misses = {};
  var almost = {};   /* answered "Almost" this sitting; each gets one encore */
  var renaming = null;   /* the deck whose name is being edited, if any */
  var CAP = 30;
  /* Whether the note editor is open — on the card, and on a row of the list.
     A word neither dictionary knows was always kept and marked, but until now
     there was nowhere to write what it actually means. */
  var noteOpen = false;
  var editingNote = null;
  var trOpen = false;        /* is the Turkish showing on this card? */
  var trFailed = false;      /* the last lookup could not reach its sources */
  var fullOpen = false;      /* the precise senses instead of the plain ones */

  function startSession() {
    /* A word renamed to its lemma may now ask the same question as one
       already here, and this is the one moment with no card on screen. */
    if (foldDuplicates()) save();
    session = dueNow().slice(0, CAP);
    total = session.length;
    done = 0;
    flipped = false;
    misses = {};
    almost = {};
    counts();      /* the badge mirrors the sitting, so it changes on Start */
    renderDue();
  }

  function renderDue() {
    var el = $("p-due");

    if (!here().length) {
      el.innerHTML = '<div class="card"><p class="empty"><b>No '
        + (SPACE === "en" ? "" : esc(lang().label) + " ") + 'words yet</b>'
        + 'Add one from the <b style="display:inline">Add</b> tab, or install the '
        + 'bookmarklet and save a word straight from whatever you are reading.</p></div>';
      return;
    }
    if (!session.length) {
      var nd = dueNow().length;
      /* Having just finished a round is a different situation from arriving
         at the page. The words left over are the ones answered "Not yet",
         which stay due today on purpose — so the offer is a second round,
         not a puzzle about why the count did not reach zero. */
      var justFinished = done > 0;
      var head, body, label;
      if (justFinished && nd) {
        head = "Round done";
        body = nd + ' word' + (nd === 1 ? ' is' : 's are') + ' still due \u2014 '
             + (nd === 1 ? 'the one' : 'the ones') + ' you answered '
             + '<b style="display:inline">Not yet</b>. They stay due until you '
             + 'get ' + (nd === 1 ? 'it' : 'them') + ', today or any day.';
        label = "Go again";
      } else if (justFinished) {
        head = "All done";
        body = done + ' word' + (done === 1 ? '' : 's') + ' this round, and '
             + 'nothing left due. ' + here().length + ' in total.';
        label = "";
      } else if (nd) {
        head = "Ready when you are";
        body = nd + ' word' + (nd === 1 ? '' : 's') + ' waiting'
             + (nd > CAP ? ' \u2014 ' + CAP + ' in this sitting.' : '.');
        label = "Start";
      } else {
        head = "Nothing due today";
        body = 'You have studied everything that came up. '
             + here().length + ' word' + (here().length === 1 ? '' : 's') + ' in total.';
        label = "";
      }
      el.innerHTML = '<div class="card"><p class="empty"><b>' + head + '</b>'
        + body + '</p>'
        + (label ? '<div style="text-align:center;padding-bottom:18px">'
                 + '<button class="btn" id="go">' + label + '</button></div>' : '')
        + '</div>';
      if ($("go")) $("go").addEventListener("click", startSession);
      return;
    }

    var w = session[0];
    /* "Not yet" puts the card back on the end of the queue rather than
       taking it away, so the ones she is getting wrong are the ones she
       keeps seeing. The count is done-and-left rather than "3 of 7",
       because a card coming round again makes that arithmetic a lie. */
    var html = '<div class="study">'
      + '<div class="progress">' + done + ' done \u00b7 ' + session.length + ' left'
      + (misses[w.id] ? ' \u00b7 again' : almost[w.id] ? ' \u00b7 once more' : '')
      + '</div>';

    if (!flipped) {
      html += '<div class="face" id="face" tabindex="0" role="button" '
            + 'aria-label="Show the meaning">'
            + '<div class="termrow">'
            + '<div class="term">' + esc(w.term) + '</div>'
            + sayBtn(w)
            + '</div>'
            + seenAsLine(w)
            + '<div class="tap">Tap, or press space, to see the meaning</div></div>';
    } else {
      html += '<div class="face back" id="back" tabindex="0" role="button" '
            + 'aria-label="Turn the card back to the word">'
            + '<div class="termrow">'
            + '<div class="term">' + esc(w.term) + '</div>'
            + sayBtn(w)
            + '</div>'
            + '<div class="pill" style="align-self:flex-start;margin-top:2px">'
            + esc(w.deck || "Inbox") + '</div>';
      if (!w.looked && !w.senses.length) {
        html += '<p class="def" style="margin-top:12px;color:var(--muted)">Looking it up&hellip;</p>';
      } else if (!w.senses.length) {
        html += '<p class="def" style="margin-top:12px;color:var(--warn)">'
              + 'No definition found &mdash; neither dictionary knows this one.</p>';
      } else {
        if (w.via) {
          html += '<div class="via">' + esc(w.via) + '</div>';
        }
        /* Plain English when there is any, the precise senses when she asks
           for them or when Simple Wiktionary has never heard of the word. */
        var plain = Array.isArray(w.plain) ? w.plain : [];
        var shown = (plain.length && !fullOpen) ? plain : w.senses;
        for (var i = 0; i < shown.length; i++) {
          var s = shown[i];
          html += '<div class="sense">'
                + (s.pos ? '<div class="pos">' + esc(s.pos) + '</div>' : '')
                + '<p class="def">' + esc(s.text) + '</p>'
                + (s.example ? '<p class="eg">&ldquo;' + esc(s.example) + '&rdquo;</p>' : '')
                + '</div>';
        }
        if (plain.length) {
          html += '<div class="trfrom">'
                + (fullOpen ? 'Wiktionary' : 'Plain English \u00b7 Simple Wiktionary')
                + '</div>';
        }
      }
      if (trOpen) {
        html += '<div class="yournote tr"><b>T\u00fcrk\u00e7e</b>';
        /* The failure is checked first. A lookup that could not reach its
           sources writes nothing down, so there is no record to carry the
           news — asking "is there a record?" first left the card saying
           "looking it up" for ever. */
        if (trFailed && !(w.tr && w.tr.from)) {
          html += '<span class="notetext" style="color:var(--stop)">'
                + 'Could not reach Wiktionary or Wikipedia. Nothing is wrong '
                + 'with the word \u2014 press T\u00fcrk\u00e7e again to retry. If it keeps '
                + 'failing, an ad or privacy blocker is the usual cause: both '
                + 'requests go to <b style="display:inline">api.php</b> on '
                + 'wiktionary.org and wikipedia.org.</span>';
        } else if (!w.tr) {
          html += '<span class="notetext" style="color:var(--muted)">'
                + 'Bak\u0131l\u0131yor\u2026</span>';
        } else if (w.tr.blocks && w.tr.blocks.length) {
          for (var ti = 0; ti < w.tr.blocks.length; ti++) {
            var tb = w.tr.blocks[ti];
            html += '<div class="trline"><span class="trwords">'
                  + esc(tb.words.join(", ")) + '</span>'
                  + (tb.sense ? '<span class="trsense">' + esc(tb.sense) + '</span>' : '')
                  + '</div>';
          }
          html += '<div class="trfrom">Wiktionary</div>';
        } else if (w.tr.one) {
          html += '<div class="trline"><span class="trwords">' + esc(w.tr.one) + '</span>'
                + '<span class="trsense">the Turkish article for the same thing</span></div>'
                + '<div class="trfrom">Wikipedia</div>';
        } else {
          html += '<span class="notetext" style="color:var(--warn)">'
                + 'Neither Wiktionary nor Wikipedia has a Turkish entry for this '
                + 'one. Nothing invented \u2014 write your own below.</span>';
        }
        html += '</div>';
      }

      if (noteOpen) {
        html += '<div class="yournote"><b>Your note</b>'
              + '<textarea id="noteBox" placeholder="What it means in your own '
              + 'words, a way to remember it, the Turkish for it\u2026">'
              + esc(w.note || "") + '</textarea>'
              + '<div class="noteacts">'
              + '<button class="btn-q" id="noteSave">Save</button>'
              + '<button class="btn-q" id="noteCancel">Cancel</button></div></div>';
      } else if (w.note) {
        html += '<div class="yournote"><b>Your note</b>'
              + '<span class="notetext">' + esc(w.note) + '</span>'
              + '<div class="noteacts"><button class="btn-q" id="noteBtn">Edit note</button>'
              + trButton(w) + fullButton(w) + '</div>'
              + '</div>';
      } else {
        html += '<div class="noteacts" style="margin-top:12px">'
              + '<button class="btn-q" id="noteBtn">Add a note</button>'
              + trButton(w) + fullButton(w) + '</div>';
      }
      /* Only when nothing above carried one, so a word never shows two. */
      if (!hasExample(w)) {
        if (w.eg && w.eg.text) {
          html += '<div class="egbox"><b>In a sentence</b>'
                + '<span class="egtext">\u201c' + esc(w.eg.text) + '\u201d</span>'
                + '<span class="egfrom">Wiktionary</span></div>';
        } else if (!w.eg) {
          html += '<div class="egbox"><span class="egtext" '
                + 'style="color:var(--muted)">Looking for an example\u2026</span></div>';
        }
      }

      if (w.src && w.src.sentence) {
        var link = safeUrl(w.src.url);
        html += '<div class="ctx"><b>Where you found it</b>'
              + esc(w.src.sentence)
              + (link ? '<br><a href="' + esc(link) + '" target="_blank" rel="noopener">'
                      + esc(w.src.title || link).slice(0, 70) + ' &rarr;</a>' : '')
              + '</div>';
      }
      html += '</div>'
            + '<div class="grade">'
            + '<button class="no" id="gNo">Not yet</button>'
            + '<button class="mid" id="gMid">Almost</button>'
            + '<button class="yes" id="gYes">Knew it</button>'
            + '</div>'
            + '<div class="keys">1 not yet \u00b7 2 almost \u00b7 3 knew it</div>';
    }
    html += '</div>';
    el.innerHTML = html;

    if (!flipped) {
      var f = $("face");
      f.addEventListener("click", function (e) {
        /* the speaker is on this face too now, and pressing it is not an
           answer — hearing a word is part of trying to remember it */
        if (e.target.closest && e.target.closest("button")) return;
        flip();
      });
      f.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          /* Stop here. The document handler reads `flipped` to decide what a
             key means, and by the time the event reached it this flip had
             already changed that answer — so the one press turned the card
             over and straight back again. */
          e.preventDefault(); e.stopPropagation();
          keyboarding = true; flip();
        }
      });
      if (keyboarding) f.focus();
      /* fetch while she is still looking at the front, so the back is
         ready by the time she turns it over */
      ensureLooked(w, function () { if (flipped) renderDue(); });
      /* and the recording, so the speaker on this face works straight away.
         Redrawn only once, when the answer lands: by then w.say is set, so
         the next pass does not ask again. */
      if (!w.say) {
        ensureSay(w, function () {
          if (!flipped && session[0] === w) renderDue();
        });
      }
      /* Quietly, while she is still trying to remember it. */
      if (!(w.eg && w.eg.from) && !hasExample(w)) ensureExample(w);
    } else {
      $("gNo").addEventListener("click", function () { answer("no"); });
      $("gMid").addEventListener("click", function () { answer("mid"); });
      $("gYes").addEventListener("click", function () { answer("yes"); });

      /* Turning it back. Not from the note editor, a link, or any button —
         those are things she came to the back of the card to use. */
      $("back").addEventListener("click", function (e) {
        if (e.target.closest("button, a, textarea, select, input")) return;
        unflip();
      });
      $("back").addEventListener("keydown", function (e) {
        if (e.target !== this) return;
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault(); e.stopPropagation();
          keyboarding = true; unflip();
        }
      });

      /* Fetched when the back is shown, so a word saved long before this
         existed gets its recording the first time she turns it over. Guarded
         the way ensureLooked is: without the guard the callback fires at once
         for a word that already has one, redraws the back, and asks again —
         a redraw that never ends. */
      if (!w.say) ensureSay(w, function () { if (flipped) renderDue(); });
      if (!(w.eg && w.eg.from) && !hasExample(w)) {
        ensureExample(w, function () { if (flipped) renderDue(); });
      }
      /* Only once the headword has settled, or it asks about "plunged". */
      if (w.looked && !w.plain) {
        ensurePlain(w, function () { if (flipped) renderDue(); });
      }
      if ($("fullBtn")) {
        $("fullBtn").addEventListener("click", function () {
          fullOpen = !fullOpen; renderDue();
        });
      }
      if ($("noteBtn")) {
        $("noteBtn").addEventListener("click", function () { noteOpen = true; renderDue(); });
      }
      if ($("trBtn")) {
        $("trBtn").addEventListener("click", function () {
          trOpen = !trOpen;
          if (trOpen) trFailed = false;   /* this press gets its own verdict */
          renderDue();
          /* Fetched on the press, not on every flip: most cards are turned
             over without ever wanting it. Cached afterwards, so the second
             press is instant. */
          if (trOpen && !(w.tr && w.tr.from)) {
            ensureTurkish(w, function () { if (flipped && trOpen) renderDue(); });
          }
        });
      }
      if ($("noteSave")) {
        $("noteSave").addEventListener("click", function () {
          w.note = $("noteBox").value.trim().slice(0, 2000);
          save(); noteOpen = false; renderDue(); renderAll();
          toast(w.note ? "Note saved." : "Note cleared.");
        });
        $("noteCancel").addEventListener("click", function () {
          noteOpen = false; renderDue();
        });
        $("noteBox").focus();
      }
      /* Do not pull focus out of the note she is typing. */
      if (keyboarding && !noteOpen) $("gYes").focus();
    }
  }

  function flip() {
    flipped = true;
    noteOpen = false;
    trOpen = false;
    fullOpen = false;
    renderDue();
  }

  function unflip() {
    flipped = false;
    noteOpen = false;
    trOpen = false;
    fullOpen = false;
    renderDue();
  }

  /* Studying without the mouse. Tabbing to the card meant passing Theme,
     Export, Clear all and four tabs first, and there was no way at all to
     grade from the keyboard. */
  document.addEventListener("keydown", function (e) {
    var t = e.target.tagName;
    if (t === "INPUT" || t === "TEXTAREA" || t === "SELECT" || t === "BUTTON") return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!session.length) return;

    if (!flipped) {
      /* the card's own handler covers it when the card itself has focus */
      if (e.target.id === "face") return;
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault(); keyboarding = true; flip();
      }
      return;
    }
    if (e.target.id === "back") return;     /* its own handler has it */
    if (e.key === " ") { e.preventDefault(); keyboarding = true; unflip(); return; }
    if (e.key === "1" || e.key === "ArrowLeft") {
      e.preventDefault(); keyboarding = true; answer("no");
    } else if (e.key === "2") {
      e.preventDefault(); keyboarding = true; answer("mid");
    } else if (e.key === "3" || e.key === "ArrowRight" || e.key === "Enter") {
      e.preventDefault(); keyboarding = true; answer("yes");
    }
  });

  /* The speaker, and the IPA beside it when the dictionary gave one. Its own
     button rather than a click on the word, because the word itself now turns
     the card back over. */
  /* Wiktionary keeps its Turkish translation tables on English entries. A
     Spanish or German word has no such row to read, and the English sense on
     the card is doing that job anyway. */
  function trButton(w) {
    if ((w.lang || "en") !== "en") return "";
    return '<button class="btn-q' + (trOpen ? ' is-on' : '') + '" id="trBtn">'
         + (trOpen ? 'Hide T\u00fcrk\u00e7e' : 'T\u00fcrk\u00e7e') + '</button>';
  }

  /* Only offered when there is a choice to make: no plain entry means the
     precise senses are already what is on the card. */
  function fullButton(w) {
    if (!(Array.isArray(w.plain) && w.plain.length)) return '';
    return '<button class="btn-q' + (fullOpen ? ' is-on' : '') + '" id="fullBtn">'
         + (fullOpen ? 'Plain English' : 'Full dictionary') + '</button>';
  }

  function sayBtn(w) {
    var ipa = w.say && w.say.ipa ? '<span class="ipa">' + esc(w.say.ipa) + '</span>' : '';
    return '<div class="say">'
         + '<button class="speak" data-say="' + esc(w.id) + '" '
         + 'aria-label="Hear ' + esc(w.term) + '" title="Hear it">'
         + '<span aria-hidden="true">\u25b6</span></button>' + ipa + '</div>';
  }

  function answer(how) {
    var w = session.shift();
    grade(w, how);
    if (how === "yes") {
      done++;
    } else if (how === "mid") {
      /* Once more before the sitting ends, rather than straight away: you
         had it, so drilling it immediately proves nothing. */
      if (!almost[w.id]) { almost[w.id] = 1; session.push(w); }
      else done++;
    } else {
      misses[w.id] = (misses[w.id] || 0) + 1;
      /* Three times round is enough. It is already scheduled for tomorrow,
         and a card that cannot be escaped is a trap rather than a drill.
