<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f%5B%5D=switzer@400,500,600&display=swap" rel="stylesheet">
<title>FlashCards</title>
<meta name="description" content="Save a word from any page you are reading, and study it later.">
<meta name="theme-color" content="#d9cfbe">
<!-- Installable: Add to Home Screen gives it its own icon and opens it
     without Safari's chrome. The scope is /flashcards/ so the app is the tool,
     not the whole site. -->
<link rel="manifest" href="/flashcards/manifest.webmanifest">
<link rel="apple-touch-icon" href="/flashcards/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FlashCards">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171210'/%3E%3Crect x='14' y='16' width='36' height='26' rx='4' fill='none' stroke='%23e8935a' stroke-width='3'/%3E%3Cpath d='M22 50h20' stroke='%23e8935a' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M32 42v8' stroke='%23e8935a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- ============================================================
  VOCABULARY

  Two halves. A bookmarklet captures a word from whatever page she is
  reading, along with the sentence it sat in. This page studies them.

  Her list lives in this browser and goes nowhere. The one thing that
  does leave is a single word, sent to Wiktionary to ask what it means
  — said plainly on the page rather than glossed over, because the
  Ledger's "nothing leaves your computer" is not true here and should
  not be implied.
============================================================ -->
<style>
  :root{
    /* lifted from simaydemiral.com, same as the Ledger, so they read as
       one person's work */
    --ground:#d9cfbe; --surface:#f2ede2; --sunken:#e7e0d1;
    --ink:#1f1c18; --ink-2:#4b443c; --muted:#6a6157; --faint:#938a7d;
    --line:#d6cbb8; --line-soft:#e2dacb;
    --brand:#c05a2a; --brand-wash:#f7e9e0;
    --go:#4f7a52; --go-wash:#e6efe4;
    --warn:#b07a28; --warn-wash:#f8eeda;
    /* Only the Progress chart uses this. A word being added is not a step
       along the green-amber-grey run the bars show -- it is a word
       arriving, a different kind of event, and it wants a colour from
       outside that family, the way her sketch had it. */
    --sky:#5d7f94;
    --f-body:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    /* Headings, matching the homepage. The serif above stays, for the word
       on the card itself. */
    --f-display:"Switzer","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
    --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(31,28,24,.05),0 8px 24px rgba(31,28,24,.07);
    --radius:12px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#1f1a15; --surface:#2b241d; --sunken:#352d24;
      --ink:#f6f1e9; --ink-2:#e2d9cc; --muted:#d4cabc; --faint:#9b9183;
      --line:#423830; --line-soft:#372f27;
      --brand:#e08b52; --brand-wash:#33230f;
      --go:#7fb384; --go-wash:#15251a;
      --warn:#dba85a; --warn-wash:#33260f;
      --sky:#89a8bb;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --ground:#1f1a15; --surface:#2b241d; --sunken:#352d24;
    --ink:#f6f1e9; --ink-2:#e2d9cc; --muted:#d4cabc; --faint:#9b9183;
    --line:#423830; --line-soft:#372f27;
    --brand:#e08b52; --brand-wash:#33230f;
    --go:#7fb384; --go-wash:#15251a;
    --warn:#dba85a; --warn-wash:#33260f;
    --sky:#89a8bb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
       font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
  .shell{max-width:860px;margin:0 auto;padding:24px 20px 72px;
         display:flex;flex-direction:column;gap:16px}

  .head{display:flex;justify-content:space-between;align-items:flex-start;
        gap:16px;flex-wrap:wrap}
  h1{font:500 30px/1.1 var(--f-display);margin:0;letter-spacing:-.03em}
  .sub{margin:4px 0 0;font-size:14px;color:var(--muted);max-width:46ch}
  .head-actions{display:flex;gap:8px;flex-wrap:wrap}

  .btn,.btn-q{font:inherit;font-size:13px;border-radius:8px;cursor:pointer;
    padding:7px 13px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);transition:border-color .15s,background .15s,color .15s;
    /* Sync now and Sign out were being squeezed by the flex row they sit in
       until each label broke over two lines. A button is a label with a box
       around it: the box gives way, never the label. */
    white-space:nowrap;flex:none}
  .btn{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
  .btn:hover{opacity:.9}
  .btn-q:hover{border-color:var(--brand);color:var(--brand)}
  .btn:disabled,.btn-q:disabled{opacity:.42;cursor:default}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);
        margin-bottom:10px;flex-wrap:wrap}
  .tab{border:0;background:transparent;color:var(--muted);font-size:13.5px;
       font-weight:600;padding:9px 13px;border-bottom:2px solid transparent;
       margin-bottom:-1px;cursor:pointer;font-family:inherit}
  .tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
  .tab-n{font:500 11px/1 var(--f-mono);color:var(--faint);margin-left:5px}

  .card{background:var(--surface);border:1px solid var(--line);
        border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
  .empty{color:var(--muted);text-align:center;padding:34px 10px;margin:0}
  .empty b{color:var(--ink);display:block;font-size:17px;margin-bottom:6px}

  /* ---------- the flashcard ---------- */
  .study{display:flex;flex-direction:column;align-items:center;gap:14px}
  /* The bin, bottom right of the card. Quiet until the pointer is near
     it: it is next to three answer buttons, and the one that empties the
     card should not compete with them for attention. */
  .cardkill{position:absolute;right:8px;bottom:8px;width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;border-radius:9px;
    border:1px solid transparent;background:none;color:var(--faint);
    cursor:pointer;opacity:.62;transition:opacity .15s,color .15s,border-color .15s}
  .cardkill:hover,.cardkill:focus-visible{opacity:1;color:var(--brand);
    border-color:var(--line)}
  .cardkill svg{width:15px;height:15px;display:block}

  .face{position:relative;width:100%;min-height:230px;background:var(--surface);
        border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
        padding:28px 24px;display:flex;flex-direction:column;
        align-items:center;justify-content:center;text-align:center;
        cursor:pointer;user-select:none}
  .face:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .term{font:500 34px/1.15 var(--f-display);letter-spacing:-.03em;
        word-break:break-word}
  .tap{margin-top:14px;font-size:12px;color:var(--faint);
       text-transform:uppercase;letter-spacing:.14em;font-family:var(--f-mono)}
  .back{text-align:left;align-items:stretch;justify-content:flex-start;
        cursor:default}
  .back .term{font-size:25px;text-align:left;margin-bottom:2px}
  .via{margin-top:9px;font:500 11px/1 var(--f-mono);letter-spacing:.08em;
       color:var(--faint)}
  .seenas{margin-top:8px;font:500 12px/1.3 var(--f-mono);letter-spacing:.06em;
          color:var(--muted)}
  .back .seenas{margin:4px 0 0}
  .w-form{margin-left:7px;font:500 11px/1 var(--f-mono);letter-spacing:.06em;
          color:var(--faint)}
  .sense{margin:10px 0 0;padding-left:0}
  .pos{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
       color:var(--brand);margin-bottom:3px}
  .def{margin:0 0 2px;color:var(--ink-2)}
  .eg{margin:3px 0 0;font-style:italic;color:var(--muted);font-size:14px}
  .ctx{margin-top:14px;padding:10px 12px;background:var(--brand-wash);
       border-left:2px solid var(--brand);border-radius:0 6px 6px 0;
       font-size:14px;line-height:1.55;color:var(--ink-2)}
  .ctx b{display:block;font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;
         text-transform:uppercase;color:var(--brand);margin-bottom:5px}
  .ctx a{color:inherit}
  .grade{display:flex;gap:10px;width:100%}
  .grade button{flex:1;padding:12px;font-size:14px;font-weight:600;
                border-radius:10px;cursor:pointer;font-family:inherit;border:1px solid}
  .no{background:var(--surface);border-color:var(--line);color:var(--ink)}
  .no:hover{border-color:var(--warn);color:var(--warn)}
  .mid{background:var(--surface);border-color:var(--line);color:var(--ink)}
  .mid:hover{border-color:var(--brand);color:var(--brand)}
  .yes{background:var(--go-wash);border-color:var(--go);color:var(--go)}
  .yes:hover{opacity:.85}
  .progress{font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}

  /* ---------- lists ---------- */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;
     text-transform:uppercase;color:var(--faint);padding:8px 8px;
     border-bottom:1px solid var(--line)}
  td{padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  tr:last-child td{border-bottom:0}
  .w-term{font-weight:600}
  .w-def{color:var(--muted);font-size:13px;display:block;margin-top:2px}
  .w-when{font-family:var(--f-mono);font-size:12px;color:var(--faint);white-space:nowrap}
  select.f{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);
           border-radius:8px;background:var(--surface);color:var(--ink)}
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .pill{display:inline-block;font:500 11px/1 var(--f-mono);letter-spacing:.1em;
        text-transform:uppercase;padding:4px 8px;border-radius:999px;
        background:var(--sunken);color:var(--muted)}
  /* --faint on the beige surface was too light to read the due count. */
  .box-n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

  textarea{width:100%;min-height:120px;font:inherit;font-size:14px;padding:11px;
           border:1px solid var(--line);border-radius:8px;resize:vertical;
           background:var(--surface);color:var(--ink)}
  .mark{display:inline-block;padding:9px 15px;border:1px dashed var(--brand);
        border-radius:8px;color:var(--brand);font-weight:600;text-decoration:none;
        background:var(--brand-wash);cursor:grab}
  .step{margin:0 0 6px;color:var(--ink-2)}
  code{font-family:var(--f-mono);font-size:12.5px;background:var(--sunken);
       padding:1px 5px;border-radius:4px}

  /* Clear of the grade row. At 22px it landed squarely on "Almost", which
     on a phone is a mis-tap waiting to happen. */
  #toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,16px);
         background:var(--ink);color:var(--ground);padding:10px 16px;
         border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;
         transition:opacity .18s,transform .18s;z-index:50}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .keys{text-align:center;font:500 11px/1 var(--f-mono);letter-spacing:.1em;
        text-transform:uppercase;color:var(--faint);padding:2px 0 14px}
  .lbl-tiny{display:none}
  .termrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .say{display:flex;align-items:center;gap:8px}
  .speak{display:inline-flex;align-items:center;justify-content:center;
         width:30px;height:30px;padding:0;border:1px solid var(--line);
         border-radius:999px;background:var(--surface);color:var(--brand);
         font-size:11px;cursor:pointer;flex:0 0 auto;line-height:1}
  .speak:hover{border-color:var(--brand);background:var(--brand-wash)}
  .speak.sm{width:21px;height:21px;font-size:8px;vertical-align:middle;
            margin-left:5px}
  .ipa{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
  .ipa.sm{font-size:11.5px;margin-left:7px}
  .egbox{margin-top:13px;padding:10px 13px;background:var(--sunken);border-radius:9px}
  .egbox b{display:block;font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;
           text-transform:uppercase;color:var(--faint);margin-bottom:5px}
  .egtext{display:block;font-size:14.5px;line-height:1.5}
  .egfrom{display:block;margin-top:6px;font:500 10.5px/1 var(--f-mono);
          letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .spaces{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
  .space{font:inherit;font-size:13px;font-weight:600;padding:6px 13px;
         border:1px solid var(--line);border-radius:999px;cursor:pointer;
         background:var(--surface);color:var(--muted);font-family:inherit}
  .space:hover{color:var(--ink)}
  .space.on{background:var(--brand-wash);border-color:var(--brand);color:var(--brand)}
  .space-n{font:500 11px/1 var(--f-mono);margin-left:7px;opacity:.75}
  #account{display:inline-flex;align-items:center;gap:8px;margin-left:4px;
    flex-wrap:wrap}
  /* Plain text that happens to be tappable: it reports, it does not ask. */
  .syncstate{font:inherit;font-size:12.5px;color:var(--faint);background:none;
    border:0;padding:0 2px;cursor:pointer;white-space:nowrap;
    text-decoration:underline dotted;text-underline-offset:3px;
    /* Held wide enough for the longest thing it says, so the buttons
       beside it do not shuffle sideways every time it changes. */
    min-width:7.5em;text-align:left}
  .syncstate:hover{color:var(--brand)}
  #account a{text-decoration:none}
  /* The address gives way before the buttons do, and it is allowed to
     shrink to nothing rather than holding the row open. */
  .who{font-size:12.5px;color:var(--muted);max-width:230px;overflow:hidden;
       text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:0}
  .howto{margin:0;padding-left:20px;color:var(--muted);font-size:14px}
  .howto li{margin:3px 0}
  .rootdef{margin:8px 0 0 0;padding:8px 0 0;border-top:1px dashed var(--line);
           font-size:14px;color:var(--ink-2)}
  .rootdef b{display:block;font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;
             text-transform:uppercase;color:var(--brand);margin-bottom:5px}
  .rootdef b span{color:var(--faint)}
  .rootdef p{margin:0 0 3px}
  /* Where the root IS the answer -- "ruthlessly: in a ruthless manner" says
     nothing, so the card leads with ruthless instead and the dashed box that
     marks an aside would be marking the definition itself. */
  .rootdef.lead{margin:12px 0 0;padding:0;border-top:0}
  .rootdef.lead p{margin:0 0 5px;font-size:15.5px;line-height:1.5}
  .colloc{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:3px}
  .colloc span{font:500 10px/1 var(--f-mono);letter-spacing:.13em;
               text-transform:uppercase;color:var(--faint)}
  .colloc b{font-weight:600;color:var(--accent)}
  .rels{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px}
  .relrow{display:flex;align-items:baseline;gap:7px}
  .relrow span{font:500 10px/1 var(--f-mono);letter-spacing:.13em;
               text-transform:uppercase;color:var(--faint)}
  .relrow b{font-weight:600}
  .rootopt{display:flex;align-items:flex-start;gap:7px;margin:0 0 4px}
  .rootopt .pin{flex:0 0 auto;width:19px;height:19px;margin-top:1px;padding:0;
                border:1px solid var(--line);border-radius:5px;cursor:pointer;
                background:var(--surface);color:var(--faint);
                font:600 11px/1 var(--f-mono)}
  .rootopt .pin:hover{border-color:var(--brand);color:var(--brand)}
  .roothint{font-size:12px;color:var(--faint);margin:5px 0 0}
  .rootpinned{cursor:pointer}
  .rootpinned::after{content:" \2713";color:var(--go);font-family:var(--f-mono)}
  .ownit{margin:12px 0 0;font-size:13px;color:var(--muted)}
  .ownit b{color:var(--ink)}
  .prog{margin:6px 0 0}
  .prog-num{font:500 11px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.03em}
  /* Not --line-soft: against --surface in light mode that is very nearly
     the same beige, so the untouched part of a deck was invisible and the
     bar looked like it stopped early. Mixed from the ink instead, so it has
     contrast in both themes without a second token. */
  .prog-bar{display:flex;height:6px;margin-top:4px;border-radius:99px;
            background:color-mix(in srgb, var(--ink) 14%, transparent);
            overflow:hidden}
  .prog-bar span{display:block;height:100%;flex:0 0 auto}
  .prog-bar .p-top{background:var(--go)}
  .prog-bar .p-mid{background:var(--warn)}
  /* New is drawn rather than left as track, so the three bands and the
     three dots beneath them are the same three things. */
  .prog-bar .p-raw{background:color-mix(in srgb, var(--ink) 20%, transparent)}
  .prog-key{display:flex;gap:18px;flex-wrap:wrap;list-style:none;margin:9px 0 0;padding:0}
  .prog-key li{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  .prog-key b{font-weight:600;color:var(--ink)}
  .k-dot{width:8px;height:8px;border-radius:99px;flex:none}
  .k-dot.k-top{background:var(--go)}
  .k-dot.k-mid{background:var(--warn)}
  .k-dot.k-raw{background:color-mix(in srgb, var(--ink) 20%, transparent)}
  .k-dot.k-seen{background:color-mix(in srgb, var(--ink) 34%, transparent)}
  .k-dot.k-add{background:var(--sky)}

  /* ---- Decks, as cards ----------------------------------------------
     A table made every deck look like a row in a spreadsheet, and the one
     thing she actually wants from this page -- how far through each one is
     -- was the smallest thing on it. A card can carry the bar at a size
     worth reading.
     ------------------------------------------------------------------ */
  .deckgrid{display:grid;gap:14px;margin-top:14px;
    grid-template-columns:repeat(auto-fill, minmax(248px, 1fr))}
  .deck{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:15px 16px 14px;display:flex;flex-direction:column;
    border-top:2px solid var(--line)}
  .deck.going{border-top-color:var(--warn)}
  .deck.done{border-top-color:var(--go)}
  /* The name gets the line to itself when it needs it, and the figures
     drop underneath, rather than a deck called BusinessComms being cut in
     half across two lines. */
  .deck-top{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;
    flex-wrap:wrap}
  .deck-fig{text-align:right;font-size:12.5px;color:var(--muted);line-height:1.45;
    flex:none;margin-left:auto}
  .deck-fig s{display:block;text-decoration:none;color:var(--faint);font-size:12px}
  .deck-name{font:600 19px/1.25 var(--f-display);letter-spacing:-.02em;color:var(--ink);
    margin:0;min-width:0;overflow-wrap:break-word}
  .deck .prog{margin-top:10px}
  .deck .prog-key{gap:10px;font-size:12px}
  .deck-empty{font-size:13px;color:var(--faint);margin:10px 0 0}
  .deck-due{font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);margin:12px 0 2px}
  .deck-due.on{color:var(--brand)}
  .deck-acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:13px;
    border-top:1px solid var(--line-soft)}
  .deck .deck-acts{margin-top:auto}
  .deck input.deckname{width:100%}

  /* ---- Progress ----------------------------------------------------
     An eyebrow in mono above a headline, the way the rest of her pages
     introduce a section, and the figures given room: a percentage read
     from across the table, and four counts for the day.
     ------------------------------------------------------------------ */
  .eyebrow{font:500 10.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;
    color:var(--faint);margin:0 0 14px}
  .cardtitle{font:600 21px/1.2 var(--f-display);letter-spacing:-.02em;margin:0 0 3px;
    color:var(--ink)}
  .cardsub{font-size:13px;color:var(--muted);margin:0 0 16px}

  .big{display:flex;align-items:baseline;gap:12px;margin:0 0 18px}
  .big em{font:600 58px/.86 var(--f-display);letter-spacing:-.045em;color:var(--ink);
    font-style:normal}
  .big em i{font-style:normal;font-size:.42em;color:var(--brand);margin-left:2px;
    letter-spacing:0}
  .big span{font:600 15px/1 var(--f-display);color:var(--ink-2)}
  .big span.of{font-weight:400;font-size:13px;color:var(--faint);margin-left:auto}

  .statrow{display:grid;gap:14px;grid-template-columns:1.4fr 1fr;margin-top:14px;
    align-items:start}
  @media (max-width:860px){.statrow{grid-template-columns:1fr}}
  .statgrid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
  .stat{background:color-mix(in srgb, var(--ink) 4%, transparent);
    border:1px solid var(--line);border-radius:12px;padding:13px 14px}
  .stat i{display:flex;align-items:center;gap:6px;font-size:12.5px;
    color:var(--muted);font-style:normal}
  .stat b{display:block;font:600 30px/1.1 var(--f-display);letter-spacing:-.03em;
    color:var(--ink);margin-top:9px}
  .stat s{display:block;text-decoration:none;font-size:12px;color:var(--faint);margin-top:3px}

  /* Four counts a day, side by side rather than stacked: a stack answers
     "how much altogether", and the question here is which of the four. */
  .chart{display:flex;align-items:flex-end;gap:2px;height:150px;margin:2px 0 0}
  .chart .day{flex:1 1 0;display:flex;align-items:flex-end;justify-content:center;
    gap:2px;height:100%;min-width:0}
  .chart .bar{flex:1 1 0;max-width:9px;border-radius:2px 2px 0 0;min-height:2px}
  .chart .b-seen{background:color-mix(in srgb, var(--ink) 34%, transparent)}
  .chart .b-top{background:var(--go)}
  .chart .b-mid{background:var(--warn)}
  .chart .b-add{background:var(--sky)}
  .chart .day.today{background:color-mix(in srgb, var(--ink) 5%, transparent);
    border-radius:6px 6px 0 0}
  .axis{display:flex;gap:2px;margin-top:8px;
    border-top:1px solid var(--line);padding-top:7px}
  .axis span{flex:1 1 0;text-align:center;font:500 10.5px/1 var(--f-mono);
    color:var(--faint);overflow:hidden;white-space:nowrap}
  .axis span.on{color:var(--ink-2)}
  .chart-key{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 0;padding:0;list-style:none}
  .chart-key li{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}

  .study .prog{margin:0 0 10px;max-width:420px}
  .deckacts{text-align:right;white-space:nowrap}
  .prog-wrap{display:flex;justify-content:center;padding:0 20px 16px}
  .prog-wrap .prog{flex:1;max-width:320px;margin:0}
  .prog-wrap .prog-num{text-align:center}
  /* Centred with the line above it on the start screen, where the whole
     block is centred; left-aligned everywhere else. */
  .prog-wrap .prog-key{justify-content:center}
  .study .prog-key{gap:14px}
  .deckonly{margin:0 0 12px;font-size:13px;color:var(--muted);
            display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .deckonly b{display:inline;color:var(--ink)}
  .deckname{font:inherit;font-weight:600;padding:5px 8px;border-radius:7px;
            border:1px solid var(--brand);background:var(--surface);
            color:var(--ink);width:100%;max-width:230px}
  .deckadd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .deckadd input{font:inherit;padding:7px 10px;border-radius:8px;
            border:1px solid var(--line);background:var(--surface);
            color:var(--ink);flex:1;min-width:190px;max-width:320px}
  .deckadd input:focus{outline:none;border-color:var(--brand)}
  .yournote.tr b{color:var(--brand)}
  .trline{padding:4px 0}
  .trline + .trline{border-top:1px solid var(--line-soft);margin-top:2px}
  .trwords{display:block;font-size:15.5px;font-weight:600}
  .trsense{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
  .trfrom{margin-top:7px;font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;
          text-transform:uppercase;color:var(--faint)}
  .w-note{display:block;margin-top:3px;font-size:12.5px;color:var(--muted);
          border-left:2px solid var(--brand);padding-left:7px}
  .yournote{margin-top:14px;padding:11px 13px;background:var(--sunken);
            border-radius:9px;font-size:14px}
  .yournote b{display:block;font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;
              text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .yournote .notetext{white-space:pre-wrap}
  .yournote textarea,tr.noterow textarea{width:100%;min-height:70px;font:inherit;
            font-size:14px;padding:9px;border:1px solid var(--line);border-radius:8px;
            background:var(--surface);color:var(--ink);resize:vertical}
  .noteacts{display:flex;gap:6px;margin-top:8px}
  tr.noterow td{background:var(--sunken)}

  @media (max-width:560px){
    .shell{padding:18px 14px 60px}
    /* Four buttons, an email and two more buttons do not belong on one
       line at this width. The account keeps its own row. */
    #account{width:100%;margin-left:0;margin-top:2px}
    #account .who{max-width:none}
    h1{font-size:26px}
    .term{font-size:28px}
    .face{min-height:190px;padding:22px 18px}
    /* On a phone the five columns overflowed the viewport and took Remove
       off-screen with them. Drop Box — it is on the card anyway — and let
       what is left scroll within its own box rather than moving the page. */
    .col-box{display:none}
    .tab{padding:9px 7px;font-size:12.5px}
    /* Three keys on one line at 375px, which is what makes it read as one
       bar with three parts rather than a list. */
    .prog-key{gap:12px}
    .study .prog-key{gap:9px}
    .prog-key li{letter-spacing:.08em}
    .tab-n{margin-left:4px}
    table{font-size:13px}
    td,th{padding:8px 6px}
    select.f{font-size:12.5px;padding:4px 6px;max-width:96px}
    /* so the whole row — word, deck, Note, Remove — fits 375px */
    #tbl .btn-q{padding:6px 9px;font-size:12.5px}
    .lbl-full{display:none}
    .lbl-tiny{display:inline}
    /* The note row sits inside a table wider than the screen. Pin it to the
       left edge and size the box to the viewport, so writing a note on a
       phone does not mean scrolling the table sideways to find the box. */
    tr.noterow td{position:sticky;left:0}
    tr.noterow textarea{max-width:calc(100vw - 56px)}
    /* Three columns' worth of room on a phone: the word, where it lives, and
       what you can do to it. The definition preview and the due date are both
       on the card itself, and keeping them here squeezed the word to a stub. */
    .col-due{display:none}
    .w-def{display:none}
    #tbl td:first-child{min-width:118px}
    /* The Decks table is four columns, three of them tiny and one a row of
       three buttons. At 375px that pushed Delete off the screen and took the
       whole page sideways with it -- so below this width a deck stops being
       a row and becomes a block: name and progress, then the two counts on
       one line, then the buttons, wrapping. */
    #p-decks thead{display:none}
    #p-decks table,#p-decks tbody,#p-decks tr,#p-decks td{display:block;width:auto}
    #p-decks tr{padding:12px 0;border-bottom:1px solid var(--line-soft)}
    #p-decks tr:last-child{border-bottom:0}
    #p-decks td{border:0;padding:2px 0}
    #p-decks td[data-l]{display:inline-block;margin:4px 18px 0 0;
                        font:500 12px/1.3 var(--f-mono);color:var(--ink-2)}
    #p-decks td[data-l]::before{content:attr(data-l) "\00a0";
                        font-size:10px;letter-spacing:.12em;
                        text-transform:uppercase;color:var(--faint)}
    #p-decks td.deckacts{text-align:left;white-space:normal;padding-top:10px}
    #p-decks td.deckacts .btn-q{margin:0 6px 6px 0}
    #p-decks .prog{max-width:260px}
    #p-decks input.deckname{max-width:100%}
  }
  /* ------------------------------------------------------------------
     The demo's first scene.

     Only ever on screen under ?demo=1, and the markup is built by the demo
     script -- the app itself ships none of it. A mock window rather than a
     screenshot, so it takes the page's own tokens and is right in both
     themes without a second set of colours.
     ------------------------------------------------------------------ */
  /* The scene fills the frame rather than floating a little window in the
     middle of it: an embed 679px wide is already a picture of a screen, and
     a picture of a screen inside it leaves the text too small to read. */
  #catch{position:fixed;inset:0;z-index:60;background:var(--ground);
         transition:opacity .6s ease}
  #catch.is-gone{opacity:0;pointer-events:none}
  .catch-win{position:relative;width:100%;height:100%;
             background:var(--surface);overflow:hidden;
             display:flex;flex-direction:column}
  .catch-bar{display:flex;align-items:center;gap:11px;padding:9px 12px;
             background:var(--sunken);border-bottom:1px solid var(--line-soft)}
  .catch-dots{display:flex;gap:5px;flex:none}
  .catch-dots i{width:9px;height:9px;border-radius:50%;background:var(--line);
                display:block}
  .catch-url{flex:1;min-width:0;font:400 12px/1.5 var(--f-mono);
             color:var(--muted);background:var(--surface);
             border:1px solid var(--line-soft);border-radius:5px;padding:4px 9px;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .catch-marks{display:flex;gap:8px;align-items:center;padding:7px 12px;
               background:var(--surface);border-bottom:1px solid var(--line-soft)}
  .catch-mark{font:500 12px/1 var(--f-mono);color:var(--brand);
              border:1px solid var(--brand);border-radius:5px;padding:5px 9px;
              white-space:nowrap;
              transition:background .18s ease,transform .18s ease}
  .catch-mark.is-hit{background:var(--brand-wash);transform:scale(.94)}
  .catch-mark--dim{color:var(--faint);border-color:var(--line-soft)}
  .catch-page{flex:1;padding:46px 40px 40px;overflow:hidden}
  .catch-page .kick{margin:0 0 10px;font:500 10px/1 var(--f-mono);
                    letter-spacing:.14em;text-transform:uppercase;
                    color:var(--faint)}
  .catch-page h2{margin:0 0 18px;font:500 32px/1.2 var(--f-display);
                 color:var(--ink);letter-spacing:-.02em}
  .catch-page p{margin:0 0 16px;
                font:400 17px/1.78 var(--f-body);color:var(--ink-2)}
  /* One centred column, the way the page it is pretending to be would set
     itself -- not 1340px of line length. After the three rules above, each
     of which writes a margin shorthand and would otherwise undo this --
     and named element by element, because ".catch-page>*" scores below
     ".catch-page p" and lost the margin it was setting. */
  .catch-page>p,.catch-page>h2,.catch-page>.kick{
    max-width:42rem;margin-left:auto;margin-right:auto}
  /* A real selection, which is one of the few things on the page that is
     the same colour whichever theme it is in. */
  .catch-page mark{background:transparent;color:inherit;padding:1px 0;
                   border-radius:2px;
                   transition:background .3s ease,color .3s ease}
  .catch-page mark.is-sel{background:#3b82f6;color:#fff}
  .catch-said{position:absolute;right:18px;top:92px;
              background:var(--ink);color:var(--surface);border-radius:7px;
              padding:9px 13px;font:500 13px/1.3 var(--f-mono);
              box-shadow:0 8px 22px rgba(0,0,0,.22);
              opacity:0;transform:translateY(-6px);
              transition:opacity .3s ease,transform .3s ease}
  .catch-said.is-on{opacity:1;transform:none}

  /* The pointer. Left and top carry the travel so the transform is free to
     carry the press -- one property animating two things is how a demo
     ends up jumping back to the top left on every click. */
  .fc-cur{position:fixed;left:50%;top:50%;width:22px;height:22px;z-index:70;
          border-radius:50%;pointer-events:none;opacity:0;
          background:color-mix(in srgb,var(--brand) 45%,transparent);
          border:1.5px solid var(--brand);
          transform:translate(-50%,-50%);
          transition:left .72s cubic-bezier(.33,.72,.3,1),
                     top .72s cubic-bezier(.33,.72,.3,1),
                     opacity .35s ease,transform .18s ease}
  .fc-cur.is-on{opacity:1}
  .fc-cur.is-press{transform:translate(-50%,-50%) scale(.62);
                   background:color-mix(in srgb,var(--brand) 85%,transparent)}

  @media (max-width:640px){
    .catch-page{padding:18px 18px 22px}
    .catch-page h2{font-size:20px}
    .catch-page p{font-size:14px;line-height:1.65}
    .catch-page p:first-of-type{display:none}
    .catch-said{top:auto;bottom:14px;right:14px}
  }

</style>

<body>
<div class="shell">

  <div class="head">
    <div>
      <h1>FlashCards</h1>
      <p class="sub">Save a word from whatever you are reading. Study it later,
        with the sentence you found it in.</p>
    </div>
    <div class="head-actions">
      <button class="btn-q" id="theme">Theme</button>
      <button class="btn-q" id="export">Export</button>
      <button class="btn-q" id="import">Import</button>
      <input type="file" id="file" accept="application/json,.json" hidden>
      <button class="btn-q" id="wipe">Clear all</button>
      <span id="account"></span>
    </div>
  </div>

  <div class="spaces" id="spaces" role="tablist" aria-label="Language"></div>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" aria-selected="true" data-tab="due">Study <span class="tab-n" id="nDue">0</span></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="all"><span class="lbl-full">All words</span><span class="lbl-tiny">Words</span> <span class="tab-n" id="nAll">0</span></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="decks">Decks <span class="tab-n" id="nDecks">0</span></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="stats">Progress</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="add">Add</button>
  </div>

  <section id="p-due"></section>

  <section id="p-all" hidden>
    <div class="filters">
      <select class="f" id="fDeck"></select>
      <select class="f" id="fSort">
        <option value="added">Newest first</option>
        <option value="term">A to Z</option>
        <option value="due">Due soonest</option>
        <option value="box">Least known</option>
      </select>
      <span class="box-n" id="allNote"></span>
    </div>
    <div class="card" style="padding:4px 10px"><div id="tbl"></div></div>
  </section>

  <section id="p-decks" hidden></section>

  <section id="p-stats" hidden></section>
  <section id="p-add" hidden></section>

</div>
<div id="toast"></div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var KEY = "vocab.v1";
  var DEMO = /[?&]demo=1\b/.test(location.search);

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function toast(m) {
    var t = $("toast");
    t.textContent = m;
    t.className = "on";
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = ""; }, 2600);
  }

  /* ------------------------------------------------------------------
     Store. Same habits as the Ledger: never let a shape written by an
     older version stop the page booting, and never let blocked storage
     throw.
     ------------------------------------------------------------------ */
  var db = { v: 1, words: [], decks: [] };

  /* Everything that comes from outside this session goes through here —
     storage written by an older build, and an imported file, which is just
     a text file someone could have edited. Drop what is not a word record,
     fill in what is missing, and distrust the source URL. */
  /* Bumped when something about how the plain-English senses are read
     changes in a way an already-stored copy cannot be repaired into. */
  /* Which build this page is. Read back off the server when the app comes
     back to the foreground: an app opened from the Home Screen is usually
     resumed rather than reloaded, so without this a phone can go on running
     a version from days ago, syncing by rules that have since been fixed,
     with nothing on screen to say so. */
  var BUILD = "2026-11-19";

  var SIMPLE_FIX = 1;

  /* One-off, per card. A word whose Turkish came back empty is written down
     as "none" so the card does not ask three sources again every time it
     comes round -- and once the lookups started travelling between devices,
     one device's empty answer could settle the word everywhere, including
     over a translation another device already had. The guard against that
     is in the merge now; this clears the ones already settled, so every
     card asks again the next time it is turned over. Nothing else is
     touched: the box, the dates, the note and the sentence stay as they
     are. */
  var TR_RETRY = 2;

  function normalize(list) {
    if (!Array.isArray(list)) return [];
    var out = [], i, w, src;
    for (i = 0; i < list.length; i++) {
      w = list[i];
      if (!w || typeof w !== "object") continue;
      if (typeof w.term !== "string" || !w.term.trim()) continue;
      w.term = w.term.trim().replace(/\s+/g, " ").slice(0, 80);
      /* Recompute rather than trust: the id is a hash of the term, and a
         hand-edited file whose id does not match would defeat deduping. */
      w.id = idOf(w.term);
      w.senses = Array.isArray(w.senses) ? w.senses : [];
      /* Forms arrive in a file someone could have hand-edited: strings only,
         and not an unbounded number of them. */
      w.plain = Array.isArray(w.plain) ? w.plain : null;
      w.sv = Number(w.sv) || 0;
      /* One-off, per card, the first time it is loaded under this build.

         Simple Wiktionary's synonym and antonym lists used to be swallowed
         into the definition -- "...it might happen. Synonyms: incidental and
         casual" -- and every card looked up before that was fixed is still
         holding the version with the list glued on, and knows nothing of the
         pair that was inside it. Nothing else is touched: the box, the due
         date, the note, the ticked root meaning and the sentence she caught
         it in all stay exactly as they are. Only the plain-English senses go,
         and they are re-read the next time that card comes round rather than
         for seventy words at once. */
      if (w.sv < SIMPLE_FIX) { w.plain = null; w.sv = SIMPLE_FIX; }
      /* Its own marker: pv already carries a different one-off. */
      w.tv = Number(w.tv) || 0;
      if (w.tv < TR_RETRY) {
        w.tv = TR_RETRY;
        /* Any record holding no translation goes, whatever it says it
           asked: the ones naming no source, and the ones naming one and
           coming back empty. Both are asked again the next time the card
           is turned over. */
        if (w.tr && !(((w.tr.blocks || []).length) || ((w.tr.more || []).length)
                      || w.tr.one)) {
          delete w.tr;
        }
      }
      w.forms = formsOf(w)
        .filter(function (x) { return typeof x === "string" && x.trim(); })
        .map(function (x) { return x.trim().replace(/\s+/g, " ").slice(0, 80); })
        .slice(0, 12);
      w.deck = (typeof w.deck === "string" && w.deck.trim()) ? w.deck.trim() : "Inbox";
      w.box = Math.min(BOXES, Math.max(1, Number(w.box) || 1));
      /* A due date is compared as a string, so a malformed one is never
         less than today and the word would wait forever. */
      w.due = /^\d{4}-\d{2}-\d{2}$/.test(w.due) ? w.due : today();
      w.note = typeof w.note === "string" ? w.note.slice(0, 2000) : "";
      /* Everything saved before there were spaces was English. */
      w.lang = /^(es|de|fr)$/.test(w.lang) ? w.lang : "en";
      /* Only ever one of three letters, and only on a language that has
         grammatical gender on its nouns. */
      w.gen = (GENDERED[w.lang] && /^[mfn]$/.test(w.gen)) ? w.gen : "";
      w.want = (w.want === "verb" || w.want === "noun" || w.want === "adjective")
             ? w.want : "";
      w.root = typeof w.root === "string" ? w.root.slice(0, 60) : "";
      w.miss = typeof w.miss === "number" ? w.miss : 0;
      w.pv = Number(w.pv) || 0;
      /* The answers themselves. Sanitised like everything else that can
         arrive from a file or from another device: a time, one of the three
         buttons, the box and date that answer produced, and a bounded
         number of them. */
      w.log = (Array.isArray(w.log) ? w.log : [])
        .filter(function (e) { return e && typeof e.t === "number"; })
        .map(function (e) {
          return { t: e.t,
                   h: (e.h === "yes" || e.h === "mid" || e.h === "no") ? e.h : "yes",
                   b: Math.min(BOXES, Math.max(1, Number(e.b) || 1)),
                   d: /^\d{4}-\d{2}-\d{2}$/.test(e.d) ? e.d : "" };
        })
        .sort(function (x, y) { return x.t - y.t; })
        .slice(-LOGMAX);
      /* How many answers this word had been given before it started keeping
         them. Every card in the deck right now has a count and no list, and
         this is where that count goes to live, so nothing she has already
         done stops being counted. */
      w.sb = Math.max(Number(w.sb) || 0,
                      Math.max(0, (Number(w.seen) || 0) - w.log.length));
      w.seen = w.sb + w.log.length;
      if (w.log.length) w.at = w.log[w.log.length - 1].t;
      else { delete w.log; if (typeof w.at !== "number") delete w.at; }
      /* An audio URL from a file is a URL like any other: http(s) only. */
      if (w.say && typeof w.say === "object") {
        w.say = { audio: safeUrl(w.say.audio).slice(0, 400),
                  ipa: typeof w.say.ipa === "string" ? w.say.ipa.slice(0, 80) : "",
                  us: !!w.say.us,
                  /* Kept, or a round trip through export and import would
                     look like a card that had never been asked. */
                  v: typeof w.say.v === "number" ? w.say.v : 0,
                  /* Kept, or a word whose sources were unreachable gets a
                     fresh three goes on every single reload. */
                  miss: typeof w.say.miss === "number" ? w.say.miss : 0 };
      } else { delete w.say; }
      if (w.tr && typeof w.tr === "object") {
        var tb = Array.isArray(w.tr.blocks) ? w.tr.blocks : [];
      w.tr = {
          blocks: tb.filter(function (b) {
            return b && typeof b === "object" && Array.isArray(b.words) && b.words.length;
          }).slice(0, 4).map(function (b) {
            return { sense: String(b.sense || "").slice(0, 160),
                     words: b.words.filter(function (x) { return typeof x === "string"; })
                                   .slice(0, 6).map(function (x) { return x.slice(0, 60); }) };
          }),
          v: Number(w.tr.v) || 0,
          more: (Array.isArray(w.tr.more) ? w.tr.more : [])
                  .filter(function (x) { return typeof x === "string"; })
                  .slice(0, 6).map(function (x) { return x.slice(0, 160); }),
          one: typeof w.tr.one === "string" ? w.tr.one.slice(0, 120) : "",
          oneNote: typeof w.tr.oneNote === "string" ? w.tr.oneNote.slice(0, 160) : "",
          from: typeof w.tr.from === "string" ? w.tr.from.slice(0, 40) : "",
          /* Kept, or every reload hands a stale "none" three fresh goes. */
          miss: typeof w.tr.miss === "number" ? w.tr.miss : 0,
          via: typeof w.tr.via === "string" ? w.tr.via.slice(0, 60) : ""
        };
      } else { delete w.tr; }
      if (w.eg && typeof w.eg === "object") {
        w.eg = { text: typeof w.eg.text === "string" ? w.eg.text.slice(0, 300) : "",
                 from: typeof w.eg.from === "string" ? w.eg.from.slice(0, 24) : "",
                 /* Kept, or every reload hands a settled "none" a fresh go. */
                 v: Number(w.eg.v) || 0 };
      } else { delete w.eg; }
      if (w.rootdef && typeof w.rootdef === "object") {
        w.rootdef = {
          term: String(w.rootdef.term || "").slice(0, 60),
          senses: (Array.isArray(w.rootdef.senses) ? w.rootdef.senses : [])
            .filter(function (x) { return x && typeof x === "object" && x.text; })
            .slice(0, 3).map(function (x) {
              return { pos: String(x.pos || "").slice(0, 40),
                       text: String(x.text).slice(0, 400),
                       example: String(x.example || "").slice(0, 300) };
            }),
          miss: Number(w.rootdef.miss) || 0
        };
      } else { delete w.rootdef; }
      /* Synonym, antonym, and the preposition the word is usually used with.
         One word each: a list is a second thing to learn, and she asked for
         the single closest. */
      if (w.rel && typeof w.rel === "object") {
        w.rel = { syn: typeof w.rel.syn === "string" ? w.rel.syn.slice(0, 40) : "",
                  ant: typeof w.rel.ant === "string" ? w.rel.ant.slice(0, 40) : "",
                  pat: typeof w.rel.pat === "string" ? w.rel.pat.slice(0, 40) : "",
                  v: Number(w.rel.v) || 0 };
      } else { delete w.rel; }
      w.rootpin = (typeof w.rootpin === "number" && w.rootpin >= 0)
                ? Math.floor(w.rootpin) : -1;
      src = (w.src && typeof w.src === "object") ? w.src : {};
      w.src = {
        url: safeUrl(src.url).slice(0, 400),
        title: typeof src.title === "string" ? src.title.slice(0, 200) : "",
        sentence: typeof src.sentence === "string" ? src.sentence.slice(0, 400) : ""

      delete w._miss;   /* session state an earlier build saved; not data */
      out.push(w);
    }
    return out;
  }

  function load() {
    if (DEMO) { db = demoData(); return; }
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      /* An array, specifically. A truthy non-array ("words":"oops") used to
         pass this gate and then render neither cards nor an empty state. */
      if (d && Array.isArray(d.words)) {
        db = d;
        db.words = normalize(db.words);
        db.decks = normalizeDecks(db.decks);
        /* Written back, or storage keeps the pair and every load folds them
           again -- harmless, but it leaves the file disagreeing with what is
           on screen. */
        if (foldDuplicates()) save();
        else snapshot();
      }
    } catch (e) {
      /* corrupt or blocked storage — start empty rather than break */
    }
  }

  /* Words touched since the last save. Stamping only these, rather than the
     whole list, is what lets two devices merge: a word the phone did not
     touch keeps its old stamp and loses to the laptop's newer edit. */
  /* ------------------------------------------------------------------
     Sync.

     Local first, always. The list in this browser is the one the page reads
     and writes; the account is a copy that is reconciled with it. Signed out,
     or offline, or if the server is down, nothing here changes behaviour.

     The merge is a union, never a replacement. That matters most at the very
     first sign-in, when the account is empty and this browser holds years of
     words: pulling first would show an empty list and then save it over the
     top. So the local list goes up before anything comes down, and a word
     present in both is settled by whichever copy was edited later.
     ------------------------------------------------------------------ */
  var me = null;            /* { signedIn, email } once /auth/me has answered */
  var syncing = false, syncTimer = null, lastSync = 0;
  /* dirty: something here has not reached the server yet. tries: how many
     times in a row the attempt has failed, which sets how long to wait. */
  var dirty = false, tries = 0, retryTimer = null, sayingSync = null;
  /* What the server was last given, per word. Everything used to go up on
     every sync -- a hundred-odd words, whether or not any of them had
     changed -- and the server writes a row for each one it has to take.
     One answer is one changed word; sending the other ninety-nine with it
     is a hundred times the writes for nothing. Empty means "it has nothing
     of ours", which is true at the start of a session and after a signed-in
     device has been away, so the first sync of a session still sends
     everything. */
  var sent = null;

  function toSend() {
    var out = [], i, w;
    if (!sent) {
      for (i = 0; i < db.words.length; i++) out.push(db.words[i]);
    } else {
      for (i = 0; i < db.words.length; i++) {
        w = db.words[i];
        if (sent[w.id] !== bodyOf(w)) out.push(w);
      }
    }
    /* Tombstones and decks are small and the server needs them to settle
       what it holds, so they go every time. */
    return out.concat(db.gone || []).concat(deckRecords());
  }

  function markSent() {
    sent = {};
    for (var i = 0; i < db.words.length; i++) sent[db.words[i].id] = bodyOf(db.words[i]);
  }

  /* No two syncs closer together than this, whatever asks for them. A
     sync is cheap for the page and not cheap for the database behind it,
     and anything that can ask twice can ask a thousand times. */
  var FLOOR = 8000;

  function syncSoon() {
    if (DEMO || !me || !me.signedIn) return;
    clearTimeout(syncTimer);
    var since = Date.now() - lastSync;
    syncTimer = setTimeout(syncNow, Math.max(1200, FLOOR - since));
  }

  /* A deck crosses to the other device as one more record in the same list,
     with an id nothing else can collide with. The server stores a body and an
     id and reads neither, so this needed no change there. */
  function deckRecords() {
    return deckList().map(function (d) {
      return { id: "deck:" + d.lang + ":" + d.name, deck: true,
               name: d.name, lang: d.lang,
               deleted: !!d.deleted, updated: d.updated || 0 };
    });
  }

  function isDeckRec(r) {
    return !!r && (r.deck === true
                   || String(r.id || "").indexOf("deck:") === 0);
  }

  /* A deleted row comes back as {id, deleted, updated} and nothing else, so
     the name and the language are read back out of the id. */
  function deckFromRec(r) {
    if (r.name && r.lang) {
      return { name: r.name, lang: r.lang,
               deleted: !!r.deleted, updated: r.updated || 0 };
    }
    var rest = String(r.id || "").slice(5);        /* after "deck:" */
    var cut = rest.indexOf(":");
    if (cut < 1) return null;
    return { name: rest.slice(cut + 1), lang: rest.slice(0, cut),
             deleted: !!r.deleted, updated: r.updated || 0 };
  }

  function normalizeDecks(list) {
    if (!Array.isArray(list)) return [];
    var out = [], seen = {}, i, d, k;
    for (i = 0; i < list.length; i++) {
      d = list[i];
      if (!d || typeof d.name !== "string") continue;
      var name = d.name.trim().replace(/\s+/g, " ").slice(0, 40);
      var code = /^(es|de|fr)$/.test(d.lang) ? d.lang : "en";
      if (!name || name === "Inbox") continue;     /* Inbox is never stored */
      k = code + ":" + name;
      var rec = { name: name, lang: code, deleted: !!d.deleted,
                  updated: typeof d.updated === "number" ? d.updated : 0 };
      /* The newer of a duplicated pair wins, the same rule the merge uses
         everywhere else -- keeping the first would let a stale "deleted"
         bury a deck somebody had just made again. */
      if (seen[k]) {
        if (rec.updated > seen[k].updated) {
          seen[k].deleted = rec.deleted; seen[k].updated = rec.updated;
        }
        continue;
      }
      seen[k] = rec;
      out.push(rec);
    }
    return out.slice(0, 400);
  }

  /* Coming back to the app is not the same as opening it.

     A phone resumes the page it had, so the only sync that had ever run was
     the one from whenever it was first opened -- a sitting done on the sofa
     could sit on the device for days with nothing asking it to go up. And
     the code doing the asking was equally old, which is how a fix could be
     live on the server and still not be running on the device that needed
     it. So: sync whenever the app comes back to the front, and, if it has
     been away for a while, check whether the build it is running is still
     the one being served. */
  var hiddenAt = 0;

  function freshen() {
    /* Not the embed. It holds nothing that could be out of date, the fetch
       is the whole page uncached, and a reload landing in the middle of the
       demo is worse than a demo one deploy behind. */
    if (DEMO) return;
    fetch(location.pathname + "?build=" + Date.now(),
          { cache: "no-store", credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (t) {
        var m = /var BUILD = "([^"]+)"/.exec(t);
        if (!m || m[1] === BUILD) return;
        /* Once only. If the reload somehow comes back on the same build --
           a cache that will not let go -- a second attempt would be a loop,
           and a page that reloads for ever is worse than a stale one. */
        var tried = null;
        try { tried = sessionStorage.getItem("fc.reloaded"); } catch (e) {}
        if (tried === m[1]) return;
        try { sessionStorage.setItem("fc.reloaded", m[1]); } catch (e) {}
        location.reload();
      })
      .catch(function () {});
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (me && me.signedIn) syncNow();
    if (!hiddenAt || Date.now() - hiddenAt > 60000) freshen();
  });

  function syncNow() {
    if (DEMO || syncing || !me || !me.signedIn) return;
    /* Asked again too soon -- a burst of answers, a tab coming back twice,
       a merge that wants to push what it just merged -- waits its turn
       rather than being refused, so nothing is lost by the floor. */
    if (lastSync && Date.now() - lastSync < FLOOR && !tries) { syncSoon(); return; }
    syncing = true;
    /* "syncing..." is only worth saying if it lasts long enough to read. A
       sync over a decent connection is done in under a second, and saying
       it anyway made the line flick between two words on every answer, on
       every return to the app, and on every tick of the timer -- which
       reads as something going wrong rather than something working. */
    clearTimeout(sayingSync);
    sayingSync = setTimeout(function () { if (syncing) renderAccount(); }, 900);
    var payload = toSend();
    fetch("/api/sync", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ words: payload })
    })
      .then(function (r) {
        if (r.status === 401) { me = { signedIn: false }; throw new Error("signed out"); }
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(function (out) {
        syncing = false;
        clearTimeout(sayingSync);
        if (!out || !Array.isArray(out.words)) return;
        dirty = false;
        tries = 0;
        absorb(out.words);
        /* After the merge, not before: what the server has is what this
           device holds now, so the next sync sends only what changes from
           here. */
        markSent();
        lastSync = Date.now();
        renderAccount();
      })
      /* A failed sync used to be the end of it: the answers sat here until
         something else happened to ask again. The network comes back on its
         own, so the asking should too -- backing off rather than hammering,
         and giving up only when the page does. */
      .catch(function () {
        syncing = false;
        clearTimeout(sayingSync);
        tries++;
        clearTimeout(retryTimer);
        retryTimer = setTimeout(syncNow, Math.min(60000, 5000 * tries));
        renderAccount();
      });
  }

  /* Four things ask for a sync, so that nothing has to: a change, coming
     back to the app, the network returning, and a quiet timer for a page
     left open all day. */
  window.addEventListener("online", function () { tries = 0; syncNow(); });

  setInterval(function () {
    if (!document.hidden && me && me.signedIn && (dirty || Date.now() - lastSync > 900000))
      syncNow();
  }, 300000);

  /* Closing the app with an answer still in hand was the whole of this
     morning's trouble. A beacon is delivered by the browser after the page
     is gone, which is the only kind of request that survives being closed. */
  window.addEventListener("pagehide", function () {
    if (DEMO || !dirty || !me || !me.signedIn || !navigator.sendBeacon) return;
    try {
      /* The same short list a sync would send, not the whole collection:
         a beacon fires on every close, and the page has no way to hear
         what came back, so sending more than has changed is a write per
         word for nothing. */
      navigator.sendBeacon("/api/sync",
        new Blob([JSON.stringify({ words: toSend() })], { type: "application/json" }));
    } catch (e) {}
  });

  /* ------------------------------------------------------------------
     One word, two copies, nothing thrown away.

     A word carries two different kinds of thing, changed by different
     events at different moments: what it says (the senses, the recording,
     the note, which deck it is in) and how well she knows it (the box, the
     date it is next due, how many times she has answered it). Settling the
     whole record by one stamp means the loser's half of both is discarded --
     so a definition arriving on the laptop could overwrite a sitting done on
     the phone, and did.

     So they are settled separately. Content goes with the later `updated`.
     Progress goes with the later answer, and the answer count only ever
     climbs: whatever either device knows about how often this word has come
     round, the merged copy knows it too.
     ------------------------------------------------------------------ */
  function keyOf(w) {
    return (w && typeof w.term === "string" && w.term) ? idOf(w.term) : (w && w.id);
  }

  function answers(w) { return Array.isArray(w.log) ? w.log : []; }

  /* Answers given before there was a log to write them in. Kept as a number
     so the count stays honest across the change: a word with eleven answers
     behind it and three since reads fourteen, not three. */
  function before(w) {
    return Math.max(Number(w.sb) || 0, (Number(w.seen) || 0) - answers(w).length);
  }

  /* Two lists of answers become one. Nothing is dropped: the same answer
     arriving from both sides is recognised by when it happened, and anything
     either side knows about that the other does not is kept. */
  function mergeLogs(a, b) {
    var all = a.concat(b), out = [], seen = {}, i, e, k;
    for (i = 0; i < all.length; i++) {
      e = all[i];
      if (!e || typeof e.t !== "number") continue;
      k = e.t + ":" + (e.h || "");
      if (seen[k]) continue;
      seen[k] = 1;
      out.push(e);
    }
    out.sort(function (x, y) { return x.t - y.t; });
    /* The whole union. Trimming is the caller's business, because whatever
       is trimmed has to be counted somewhere else first. */
    return out;
  }

  /* Does this copy actually know the thing, or is it only carrying the
     record of having asked? A lookup that failed is written down -- "no
     Turkish for this word", "no recording" -- so that it is not asked
     again every time the card comes round, and that record is a newer
     change to the word than the answer another device already had. Which
     meant one device's failure could travel out and erase the real thing
     everywhere. Knowledge wins over the absence of it, whatever the
     stamps say; between two copies that both know, the later one wins as
     before. */
  var KNOWS = {
    tr: function (w) {
      return !!(w.tr && w.tr.from && w.tr.from !== "none"
                && (((w.tr.blocks || []).length) || (w.tr.more || []).length || w.tr.one));
    },
    say: function (w) { return !!(w.say && (w.say.audio || w.say.ipa)); },
    senses: function (w) { return !!(w.senses && w.senses.length); },
    plain: function (w) { return !!(w.plain && w.plain.length); },
    rootdef: function (w) { return !!(w.rootdef && w.rootdef.term); },
    rel: function (w) { return !!(w.rel && (w.rel.syn || w.rel.ant || w.rel.pat)); },
    eg: function (w) { return !!w.eg; },
    note: function (w) { return !!(w.note && w.note.trim()); },
    src: function (w) { return !!(w.src && w.src.sentence); }
  };

  function mergeWord(mine, theirs) {
    var base = (theirs.updated || 0) > (mine.updated || 0) ? theirs : mine;
    var other = base === theirs ? mine : theirs;
    var out = {}, k;
    for (k in base) out[k] = base[k];
    for (k in KNOWS) {
      if (!KNOWS[k](base) && KNOWS[k](other)) out[k] = other[k];
    }

    var full = mergeLogs(answers(mine), answers(theirs));
    var log = full.slice(-LOGMAX);
    /* Two devices with long histories of one word can union to more lines
       than are kept. The ones that fall off are added to the carried
       number, so the total survives the trim -- otherwise two devices with
       forty answers each would merge to forty, and a merge that loses
       answers is exactly what the undo below exists to catch. */
    var sb = Math.max(before(mine), before(theirs)) + (full.length - log.length);

    /* Where the word stands is whatever the latest answer anywhere says --
       from the merged list if it is in there, or from a copy whose answer
       was given before this build and survives only as a timestamp. */
    var best = log.length
      ? { at: log[log.length - 1].t, box: log[log.length - 1].b, due: log[log.length - 1].d }
      : null;
    var sides = [mine, theirs], i, w;
    for (i = 0; i < 2; i++) {
      w = sides[i];
      if ((w.at || 0) > (best ? best.at : 0)) best = { at: w.at, box: w.box, due: w.due };
    }

    if (best) {
      out.box = best.box || 1;
      out.due = best.due;
      out.at = best.at;
    } else if ((theirs.seen || 0) !== (mine.seen || 0)) {
      /* Neither copy carries a time: both were answered before any of this
         existed. The one with more answers in it is the later one, since
         that count only ever goes up. */
      var prog = (theirs.seen || 0) > (mine.seen || 0) ? theirs : mine;
      out.box = prog.box || 1;
      out.due = prog.due;
      delete out.at;
    }

    if (log.length) out.log = log; else delete out.log;
    out.sb = sb;
    out.seen = sb + log.length;
    if (!out.at) delete out.at;
    return out;
  }

  /* What came back replaces what is here only where it is newer. */
  /* Every answer this list knows about, counted. The box is not in here on
     purpose: answering "Not yet" lowers a box, legitimately, and counting
     that as a loss would cry wolf on an ordinary sitting. The number of
     answers is the one thing that cannot honestly go down -- the logs are a
     union and the carried-over count is a maximum -- so if it does, the
     merge is wrong and the list it ate is worth keeping. */
  function progressTotal(list) {
    var t = 0, i;
    for (i = 0; i < list.length; i++) t += (list[i].seen || 0);
    return t;
  }

  var PREV = KEY + ".prev";

  function absorb(remote) {
    var byId = {}, i, w, changed = false, repaired = false;
    /* What she is looking at, before the merge. */
    var cardId = session.length ? session[0].id : null;
    var cardWas = cardId ? bodyOf(session[0]) : null;
    /* What the list looked like before this merge, and what it was worth.
       A merge should never subtract -- the answers are a union and the
       count only climbs -- so if it does, something is wrong with code I
       wrote, and this morning showed what that costs when it cannot be
       undone. The copy is only kept in that case, so in ordinary use this
       is a subtraction and nothing else. */
    var wasWorth = progressTotal(db.words), wasRaw = null;
    try { wasRaw = localStorage.getItem(KEY); } catch (e) {}

    /* Decks first, and taken out of the list: fed through the word merge
       they would land in db.words and be rendered as cards. */
    var incoming = [], deckByKey = {}, dl = deckList();
    for (i = 0; i < dl.length; i++) deckByKey[dl[i].lang + ":" + dl[i].name] = dl[i];
    for (i = 0; i < remote.length; i++) {
      if (!isDeckRec(remote[i])) { incoming.push(remote[i]); continue; }
      var dr = deckFromRec(remote[i]);
      if (!dr || dr.name === "Inbox") continue;
      var k = dr.lang + ":" + dr.name, mine = deckByKey[k];
      if (!mine) { deckByKey[k] = dr; changed = true; }
      else if ((dr.updated || 0) > (mine.updated || 0)) {
        mine.deleted = dr.deleted; mine.updated = dr.updated; changed = true;
      }
    }
    db.decks = [];
    for (var dk in deckByKey) db.decks.push(deckByKey[dk]);
    db.decks = normalizeDecks(db.decks);
    remote = incoming;
    /* Keyed by what the id will be once normalize has had it, not by what
       the record happens to say. The id is a hash of the term, so a row
       written by an older build under a different id would otherwise come
       in as a second copy of a word already here -- two entries, the same
       word, the answers split between them. */
    for (i = 0; i < db.words.length; i++) byId[keyOf(db.words[i])] = db.words[i];
    var gone = {};
    for (i = 0; i < (db.gone || []).length; i++) gone[db.gone[i].id] = db.gone[i].updated || 0;

    var keep = [];
    for (i = 0; i < remote.length; i++) {
      w = remote[i];
      if (!w || !w.id) continue;
      if (w.deleted) {
        /* Deleted elsewhere. Drop it here too, unless this device has since
           brought it back. */
        var local = byId[w.id];
        if (local && (local.updated || 0) > (w.updated || 0)) { keep.push(local); continue; }
        if (local) changed = true;
        delete byId[w.id];
        gone[w.id] = Math.max(gone[w.id] || 0, w.updated || 0);
        continue;
      }
      if (gone[w.id] && gone[w.id] >= (w.updated || 0)) continue;   /* deleted here, later */
      var key = keyOf(w);
      var here = byId[key];
      if (!here) { byId[key] = w; changed = true; continue; }
      var merged = mergeWord(here, w), mb = bodyOf(merged);
      byId[key] = merged;
      if (mb !== bodyOf(here)) changed = true;
      /* The merged copy is not what the server holds, so it has to go back:
         marked, which gives it a fresh stamp on the save below, and that
         stamp is what gets it past the server's "is this newer" test. */
      if (mb !== bodyOf(w)) { mark(w.id); repaired = true; }
    }
    for (var k in byId) keep.push(byId[k]);
    keep.sort(function (a, b) {
      var x = a.added || "", y = b.added || "";
      return x < y ? 1 : x > y ? -1 : 0;
    });
    db.words = normalize(keep);
    db.gone = [];
    for (var g in gone) db.gone.push({ id: g, deleted: true, updated: gone[g] });

    /* The merge hands back a fresh object for any word the other device
       edited more recently, and the sitting is still holding the old one.
       Grading that copy writes an answer into something no longer in the
       list, so the next save drops it on the floor -- the card looks
       answered and the box never moves. Re-point the queue at what is
       actually in db.words now, by id, and let go of anything the merge
       removed. foldDuplicates has always done this; absorb never did. */
    if (session.length) {
      var byNow = {}, s2;
      for (i = 0; i < db.words.length; i++) byNow[db.words[i].id] = db.words[i];
      s2 = [];
      for (i = 0; i < session.length; i++) {
        if (byNow[session[i].id]) s2.push(byNow[session[i].id]);
      }
      if (s2.length !== session.length) changed = true;
      session = s2;
      saveSession();
    }

    if (wasRaw && progressTotal(db.words) < wasWorth) {
      try {
        localStorage.setItem(PREV, JSON.stringify({
          at: Date.now(), lost: wasWorth - progressTotal(db.words), db: wasRaw
        }));
      } catch (e) {}
    }

    /* save() rather than a bare write when the merge healed a split: the
       repaired words need the fresh stamp save() gives them, and the sync it
       schedules is what carries them to the other device. It cannot loop --
       by the next round the stamps differ, so there is nothing left to
       repair. */
    if (repaired) { save(); }
    else {
      snapshot();
      try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
    }
    /* renderSpaces too: the merge can bring in words in any language, and
       leaving it out is why the pill above the tabs could say 82 while the
       All words tab, counting the same list, said 117. */
    if (changed) {
      renderSpaces(); counts(); fillFilter(); renderAll(); renderDecks();
      /* The card in front of her is redrawn only if the merge actually
         changed that word. Rebuilding it to show the same thing costs a
         tap and shows nothing new. */
      var cardNow = null;
      if (cardId) {
        for (i = 0; i < db.words.length; i++) {
          if (db.words[i].id === cardId) { cardNow = bodyOf(db.words[i]); break; }
        }
      }
      if (!cardId || cardNow !== cardWas) renderDue();
    }
  }

  var touched = {};

  function mark(id) { if (id) touched[id] = 1; }

  /* What a word looks like with its stamp taken off, so two copies can be
     compared without the stamp itself being part of the answer. Keys in
     sorted order because the local copy and the one that came back from the
     server need not have them in the same order. */
  function bodyOf(w) {
    var keys = [], k, o = {}, i;
    for (k in w) { if (k !== "updated") keys.push(k); }
    keys.sort();
    for (i = 0; i < keys.length; i++) o[keys[i]] = w[keys[i]];

     against. */

  function snapshot() {

         code that changed it remembered to say so. mark() had to be called
         by hand at every site that touches a word, and grading -- the one
         that matters most -- never called it, so a whole sitting's answers
         went up to the server carrying stamps older than the rows already
         there and were dropped on arrival. Comparing the word with its own
         last saved state cannot be forgotten. */
      if (touched[w.id] || !w.updated || lastBody[w.id] !== body) w.updated = now;

     word worth learning is "plunge". So the headword on a card is the lemma,

     finds the card, and neither one makes a second card asking the same
     question.

      ? '<div class="seenas">met as ' + esc(f.join(", ")) + '</div>' : "";

       than letting the reader assume the definition is of the word on the
       front of it. */

     in its own right, so pointsTo() refuses to follow it and the trail comes
     back empty. This renames only -- folding two cards into one waits for a

    if (!w.via) return false;

      var fm = mergeWord(o, w), fk;

        o.senses = w.senses; o.via = w.via || ""; o.looked = true;

    db.words = keep;
    session = session.filter(function (x) { return db.words.indexOf(x) >= 0; });

       load(), before the saved round has been read back, and writing an
       empty queue there would have deleted the very thing boot is about
       to pick up. */
    if (session.length) saveSession();

     the colon is long enough to look like an explanation. */

    "^(?:(?:the|a|an)\\s+(?!form\\b|inflection\\b))?" +

    /* A conjugated form's entry sometimes gives the grammar label as the

       present indicative" and "second-person singular imperative", neither of
       which says anything. No real definition opens this way. */

    if (blocks.length === 1) return blocks[0].slice(0, 3);

       the English heading meant the other three spaces never found anything
       here at all. */

    var m = new RegExp("\\n==\\s*" + name + "\\s*==\\s*\\n([\\s\\S]*?)(?=\\n==[^=]|$)")

     one. Anything longer than two words is a definition, not a gloss, and
     looking it up would answer a different question. */

     "Vetted" is a verb, and vet's only gloss short enough to travel is the
     noun "veterinarian" -- so a loose match would have put veteriner under

     hop through, saying nothing is the right answer. */

         thing, and at thirty-three characters it was too long to travel --
         so vet's gloss fell through to the second sense and asked about
         "veteran". Taking the first of the pair is what reaches veteriner.
         A noun's Turkish is wanted for a noun. "Unternehmen" lists the verb
         sense first, so the plain first gloss asked about "undertake" and
         came back with girismek rather than sirket. */
      if (want && String(list[i].pos || "").toLowerCase() === want) return t;

     anything under, so the hop failed and the card said nobody had a Turkish
     entry for it. Deranged and insane are sitting in the same line, and both
     carry {{t|tr|deli}} on their own pages. So every single word in the
     sense is a candidate, tried in turn until one of them answers. */

            .replace(/[.!?]\s*$/, "").trim();

      if (t.split(/\s+/).length > 2) return;

         card came back with sefkat -- the Turkish for the opposite of the
         word it was about. Pity and compassion are what ruthless is the
         absence of; cruel and pitiless are what it is. So a clause carrying

      var clauses = text.split(/[;.]/);

           English page carries no Turkish row; "veterinarian" has both,

  /* ------------------------------------------------------------------
     An example for every word.

     A word she caught with the bookmarklet arrives with the sentence she met
     it in, which is the best example there is. A word typed into the Add tab
     has nothing, and the dictionaries only sometimes carry one. Wiktionary's
     own usage examples fill the gap: {{ux|en|...}} is a short modern sentence
     written for the entry, and where there is none, a quoted passage from the
     citations will do. Same page the translations already read, so the
     browser usually has it cached.

  /* A page covers every language that spells the word this way — "casa" runs

     for a Spanish card, so everything below works on one section only. */
  function section(wikitext, wiktName) {

     whilst he ruthlessly". So the passage is read whole and then cut back to

      if (/[{}\[\]]/.test(out)) continue;
