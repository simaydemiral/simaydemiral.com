     ask again. Bumping LOOK_SOURCES would have every word in the list ask,
     which is a lot of requests to repair a handful of cards; this asks only
     the ones that are visibly stuck. Once each, because a pointer whose
     target has no entry of its own would otherwise ask on every redraw. */
  var STUCK_FIX = 1;

  function stuckOnPointer(w) {
    if (!w.looked) return false;
    var shown = shownSenses(w), i;
    if (!shown.length) return false;
    for (i = 0; i < shown.length; i++) {
      if (!formOnly(shown[i]) && !pointsTo(shown[i])) return false;
    }
    return true;
  }

  function needsLook(w) {
    if (!w.looked) return true;
    if ((w.lv || 0) < LOOK_SOURCES) return true;
    if ((w.pv || 0) < STUCK_FIX && stuckOnPointer(w)) return true;
    return !(w.senses && w.senses.length) && (w.miss || 0) < LOOK_TRIES;
  }

  function ensureLooked(w, after) {
    /* Not even the callback: every one of these asks for a redraw, and a
       redraw asks again -- which with nothing to wait for is a loop with
       no await in it. In the demo there is nothing to arrive. */
    if (DEMO) return;
    if (!needsLook(w) || looking[w.id]) { if (after) after(); return; }
    /* A card being re-read also had its plain-English senses fetched by the
       old reader, in the old order. They are the ones the card actually
       shows, so they go with it. */
    var again = w.looked;
    looking[w.id] = 1;
    lookup(w.term).then(function (senses) {
      delete looking[w.id];
      w.senses = senses;
      /* a custom property on an array does not survive JSON, so the trail
         lives on the word */
      w.via = senses.via || "";
      /* "vetted" is a past tense, so the verb is the sense she met. Kept on
         the word, because the plain-English senses are fetched separately
         and have to be put in the same order. */
      w.want = senses.want || "";
      /* Which word the meaning actually came from, when it came from a
         shorter one. Not a rename: she saved "allegedly" and that is the
         word she wants to see. */
      w.root = senses.root || "";
      if (senses.length) w.miss = 0;
      else w.miss = (w.miss || 0) + 1;
      if (again) w.plain = null;
      w.looked = true;
      w.lv = LOOK_SOURCES;
      w.pv = STUCK_FIX;
      var renamed = relemma(w);
      /* Folding takes a card away, so it waits until none is on screen. */
      var folded = (renamed && !session.length) ? foldDuplicates() : false;
      save();
      if (after) after();
      if (renamed || folded) { counts(); renderAll(); renderDecks(); }
    }).catch(function () {
      /* Nothing downstream of here was catching, so a source that rejected
         -- a blocked request, a dropped connection, an extension refusing
         the call -- left three things behind: the in-flight flag set, so
         the card would never ask again; w.looked unset, so the front of the
         card kept the "Looking it up..." line; and after() unrun, so even a
         later answer could not redraw it. The card sat there for good.

         Treated as a miss instead. That clears the flag, lets LOOK_TRIES
         give it two more goes, and drops the card onto the "No definition
         found yet -- Look again" state, which at least says what happened
         and offers a way out. */
      delete looking[w.id];
      w.miss = (w.miss || 0) + 1;
      w.looked = true;
      w.lv = LOOK_SOURCES;
      w.pv = STUCK_FIX;
      save();
      if (after) after();
    });
  }

  /* ------------------------------------------------------------------
     Spacing. Leitner boxes: knew it moves up, missed it goes back to
     the start. Deliberately not SM-2 — five intervals is enough for a
     few hundred words and can be explained in one line.
     ------------------------------------------------------------------ */
  /* How long until a word comes back, by what you said about it.

     "Not yet" is 0 — still due today. That is what makes a second sitting on
     the same day worth starting: the words you could not produce are waiting
     in it, and they keep waiting until you answer one of the other two. The
     ladder that used to stretch 1/3/7/16/35 is gone; the answer decides the
     gap, not how many times the word has survived. */
  /* The ladder, restored, and shortened to the days she asked for.

     Every "Knew it" used to send a word sixteen days out whatever it knew,
     which meant four correct answers -- and forty-eight days -- before a
     word could count as learned. The number of mastered words on the front
     of the app was therefore dead for the first seven weeks of using it,
     which is exactly how long she had been using it.

     The gap now comes from the box the answer lands in, so a word she has
     just met comes back tomorrow and the intervals open out from there:

       box 2  +1 day     first time right   -> day 1
       box 3  +2 days    second             -> day 3
       box 4  +4 days    third              -> day 7
       box 5  +16 days   fourth: mastered
       box 6  +35 days   fifth

     Four correct answers still make a word mastered; they now fall on days
     0, 1, 3 and 7 rather than across two months. "Almost" holds the box and
     comes back in two days; "Not yet" puts it back to the start, today. */
  var LADDER = [0, 0, 1, 2, 4, 16, 35];   /* indexed by the box landed in */
  var GAP = { no: 0, mid: 2 };

  var BOXES = 6;

  /* How many answers a word keeps. Only the last one is ever read for where
     the word stands, so this is a cap on history, not on correctness -- and
     forty answers to one word is already more than any card here will see. */
  var LOGMAX = 40;

  /* Box 1 is "new or just missed". Boxes 2..6 carry the five intervals, so
     the first word you know comes back in a day and the ladder is actually
     1, 3, 7, 16, 35 rather than starting at 3.

       "no"   you did not have it        -> back to the start, tomorrow
       "mid"  you had it, but barely     -> holds the gap it already earned
       "yes"  you had it                 -> the next gap up

     Holding rather than demoting on "mid": the answer was right, and taking
     away a gap you had already earned punishes honesty about being shaky. */
  function grade(w, how) {
    var box = w.box || 1;
    /* The box no longer sets the gap — it is kept as a record of how well
       she knows the word, which the list sorts and shows. */
    if (how === "yes")      w.box = Math.min(BOXES, box + 1);
    else if (how === "mid") w.box = Math.max(2, box);
    else                    w.box = 1;
    w.due = plus(how === "yes" ? (LADDER[w.box] || 1)
                               : (GAP[how] === undefined ? 0 : GAP[how]));

    /* The answer is written down, not just its effect.

       A box is a conclusion, and two devices holding different conclusions
       about the same word can only be settled by throwing one away. A list
       of answers is a fact each device observed, and two lists can simply be
       put together: every answer either device has ever given is in the
       merged word, in the order they were given, and the box is whatever the
       last of them produced. The count stops being a number each device
       keeps for itself and becomes the length of the list.

       The resulting box and date are stored with each answer so the merge
       never has to replay the scheduling rules -- a word merged on a device
       running an older build of those rules would otherwise land on a date
       that build chose. */
    w.at = Date.now();
    var kept = answers(w).concat([{ t: w.at, h: how, b: w.box, d: w.due }]);
    w.log = kept.slice(-LOGMAX);
    /* An answer that falls off the end of the list is still an answer she
       gave: it goes into the number carried alongside, or the count would
       stop at forty and then start going down. */
    w.sb = Math.max(0, Number(w.sb) || 0) + (kept.length - w.log.length);
    w.seen = w.sb + w.log.length;
    mark(w.id);
    save();
  }

  /* ------------------------------------------------------------------
     Four languages, four spaces.

     One stored list underneath, because sync, export and import should carry
     everything a person has. What makes them feel separate is that every
     screen reads `here()` rather than db.words: the study queue, the decks,
     the counts and the list all stop at the edge of the language you are in.
     A word saved before any of this has no language and is English, which is
     what it was.
     ------------------------------------------------------------------ */
  /* wikt  — how the English Wiktionary heads this language's section.
     trw   — how the Turkish Wiktionary heads it, in Turkish. Without this
             the Turkish lookup read the English heading on every page, so
             the other three spaces never found anything there at all. */
  var LANGS = [
    { code: "en", label: "English",  wikt: "English", voice: "en-US",
      trw: "\u0130ngilizce" },
    { code: "es", label: "Espa\u00f1ol", wikt: "Spanish", voice: "es-ES",
      trw: "\u0130spanyolca" },
    { code: "de", label: "Deutsch",  wikt: "German",  voice: "de-DE",
      trw: "Almanca" },
    { code: "fr", label: "Fran\u00e7ais", wikt: "French", voice: "fr-FR",
      trw: "Frans\u0131zca" }
  ];

  var SPACE = "en";
  try {
    var savedSpace = localStorage.getItem("vocab.space");
    for (var li = 0; li < LANGS.length; li++) {
      if (LANGS[li].code === savedSpace) SPACE = savedSpace;
    }
  } catch (e) {}
  /* The embed is same-origin with the real app, so without this it opens in
     whichever space the reader last used here -- and the homepage would show
     a stranger a demo that began in French. */
  if (DEMO) SPACE = "en";

  /* ------------------------------------------------------------------
     German articles.

     A German noun without its article is a noun learned wrong: the gender
     decides the endings on everything around it, and it is not guessable
     from the word. So the card says "das Haus", not "Haus". The term itself
     is still stored as "Haus" -- it is what the dictionary is asked about,
     what the id is made from, and what she typed.

     Wiktionary writes the gender as the first letter of the head template's
     first argument: {{de-noun|n,,^er}}, {{de-noun|f}}, {{de-noun|n.sg}}.
     ------------------------------------------------------------------ */
  /* German and Spanish take the definite article: der/die/das and el/la
     never contract, so the article always shows the gender. French takes
     the indefinite one, because le and la both elide to l' in front of a
     vowel -- "l'\u00e9cole" hides the very thing the article is there to show,
     while "une \u00e9cole" always says it. This is also how French textbooks
     write their word lists. */
  var ARTICLE = {
    de: { m: "der", f: "die", n: "das" },
    es: { m: "el",  f: "la" },
    fr: { m: "un",  f: "une" }
  };
  var GENDERED = { de: 1, es: 1, fr: 1 };

  /* A feminine Spanish noun beginning with a stressed a- takes "el" in the
     singular: el agua, el arma, el hambre. The noun is still feminine --
     "el agua fr\u00eda" -- which is why the card says "el agua" rather than the
     wrong "la agua" and the gender it was looked up under is unchanged.

     Written as a list rather than a rule on purpose. The rule turns on where
     the stress falls, which is not in anything the card has: deciding it
     would mean syllabifying Spanish in the browser and getting diphthongs
     right, to serve a set of words small enough to write down. These are the
     ones anybody meets; a feminine a- word outside the list gets "la", which
     is right for almost all of them. */
  var EL_FEM = {
    agua: 1, "\u00e1guila": 1, ala: 1, alma: 1, ama: 1, ancla: 1, arca: 1,
    area: 1, "\u00e1rea": 1, arma: 1, arpa: 1, asa: 1, asma: 1, aula: 1,
    ave: 1, haba: 1, habla: 1, hacha: 1, hada: 1, hambre: 1
  };

  function genderFrom(wikitext, code) {
    if (!GENDERED[code]) return "";
    var sec = section(wikitext, lang(code).wikt);
    if (!sec) return "";
    var m = new RegExp("\\{\\{" + code + "-noun\\|\\s*([mfn])\\b").exec(sec);
    return m ? m[1] : "";
  }

  /* The word as it should be read and remembered, which for a German noun
     includes the article and for everything else is just the word. */
  /* A card the dictionary has not really answered: no example to anchor the
     word, or a single sense, or a gloss so hollow it had to go and look up
     the root. These are the ones worth writing her own meaning on. */
  function thinCard(w) {
    if (w.note) return false;
    var shown = shownSenses(w);
    if (!shown.length) return false;
    if (w.rootdef && w.rootdef.senses && w.rootdef.senses.length) return true;
    if (!hasExample(w)) return true;
    return shown.length < 2;
  }

  /* Which root sense she ticked, or -1. Checked against the list as it
     stands, because a card whose root changed has a stale index. */
  function rootPin(w) {
    var n = (w.rootdef && w.rootdef.senses) ? w.rootdef.senses.length : 0;
    var i = Number(w.rootpin);
    return (n && i === Math.floor(i) && i >= 0 && i < n) ? i : -1;
  }

  function headword(w) {
    var set = w.gen ? ARTICLE[w.lang] : null;
    var a = set ? set[w.gen] : "";
    if (a === "la" && EL_FEM[String(w.term).toLowerCase()]) a = "el";
    return a ? a + " " + w.term : w.term;
  }

  function lang(code) {
    for (var i = 0; i < LANGS.length; i++) {
      if (LANGS[i].code === (code || SPACE)) return LANGS[i];
    }
    return LANGS[0];
  }

  /* The words of the language you are currently in. */
  function here() {
    return db.words.filter(function (w) { return (w.lang || "en") === SPACE; });
  }

  function setSpace(code) {
    if (code === SPACE) return;
    /* Before SPACE changes, or the round she is leaving is filed under the
       language she is arriving at. */
    saveSession();
    SPACE = code;
    onlyDeck = "";                 /* a deck belongs to one language */
    /* Not from the embed: it is same-origin with the real app, so the demo
       switching to German would move the reader's own FlashCards to German
       the next time they opened it. */
    if (!DEMO) { try { localStorage.setItem("vocab.space", code); } catch (e) {} }
    session = []; done = 0; misses = {}; almost = {};
    flipped = false; noteOpen = false; trOpen = false;
    /* A sitting belongs to the language it started in -- and is still there
       when she comes back to that language. */
    resumeLast();
    renderSpaces(); counts(); fillFilter();
    renderAll(); renderDecks(); renderDue();
  }

  /* A sitting can be narrowed to one deck. Kept outside the session so the
     next round stays in the same deck, and cleared when she leaves it or
     switches language -- a deck belongs to one space. */
  var onlyDeck = "";

  function inDeck(w) { return !onlyDeck || (w.deck || "Inbox") === onlyDeck; }

  function dueNow() {
    var t = today();
    return here().filter(function (w) { return inDeck(w) && (w.due || t) <= t; });
  }

  /* ------------------------------------------------------------------
     How far through a deck she is.

     Three bands rather than one percentage, because "30% done" hides whether
     the other 70% is untouched or nearly there. Box 5 and 6 are words she
     has answered "Knew it" four times without a miss in between -- on days
     0, 1, 3 and 7 under the ladder above -- which is the point at which the
     gap opens to a fortnight and the word can be called learned. Box 1 is
     new, or just missed. Everything between is in motion.
     ------------------------------------------------------------------ */
  var MASTER = 5;

  function bands(list) {
    var b = { n: list.length, top: 0, mid: 0, raw: 0 }, i, k;
    for (i = 0; i < list.length; i++) {
      k = list[i].box || 1;
      if (k >= MASTER) b.top++;
      else if (k >= 2) b.mid++;
      else b.raw++;
    }
    return b;
  }

  function inDeckNamed(name) {
    return here().filter(function (w) { return (w.deck || "Inbox") === name; });
  }

  /* The bar is the shape of the deck; the line above it is the answer to the
     question. Two filled segments and the track showing through for what has
     not been started, so three bands need only two spans. */
  /* How far through, as the one number she asked for. Rounded, but never
     to 100 while a word is still short of it: "100% mastered" with two
     words left to learn is a lie the rounding tells. */
  function pctDone(b) {
    if (!b.n) return 0;
    var p = b.top * 100 / b.n;
    return p > 0 && p < 1 ? 1 : (p < 100 && Math.round(p) === 100 ? 99 : Math.round(p));
  }

  function barHtml(b, label, noNum) {
    if (!b.n) return "";
    var full = b.top + " mastered \u00b7 " + b.mid + " learning \u00b7 "
             + b.raw + " new or missed";
    /* One word out of forty-nine is half a pixel, which looks like a
       rendering fault rather than a count. A band that has anything in it is
       wide enough to see. */
    function w(x) {
      return x ? "max(3px, " + (x * 100 / b.n).toFixed(1) + "%)" : "0";
    }
    /* The three counts moved out from under the bar and into a key beneath
       it: a dot in the band's own colour, what it is, and how many. The
       line that was here before said the same thing in mono, and asked her
       to hold three numbers in her head to see which colour was which. */
    function key(cls, name, n) {
      return '<li><span class="k-dot ' + cls + '"></span>'
           + '<b>' + n + '</b> ' + name + '</li>';
    }
    return '<div class="prog" title="' + esc(full) + '">'
         + (noNum ? '' :
            '<div class="prog-num">'
            + (label ? esc(label) + ' \u00b7 ' : '')
            + pctDone(b) + '% mastered \u00b7 ' + b.n + ' word' + (b.n === 1 ? '' : 's')
            + '</div>')
         + '<div class="prog-bar" role="img" aria-label="' + esc(full) + '">'
         + '<span class="p-top" style="width:' + w(b.top) + '"></span>'
         + '<span class="p-mid" style="width:' + w(b.mid) + '"></span>'
         + '<span class="p-raw" style="width:' + w(b.raw) + '"></span>'
         + '</div>'
         + '<ul class="prog-key">'
         + key("k-top", "mastered", b.top)
         + key("k-mid", "learning", b.mid)
         + key("k-raw", "new", b.raw)
         + '</ul></div>';
  }

  /* The deck still exists, and still has something in it. Deleting a deck
     mid-sitting, or emptying it, must not leave the Study tab filtering on a
     name nothing answers to. */
  function checkDeck() {
    if (!onlyDeck) return;
    var live = false;
    here().forEach(function (w) { if ((w.deck || "Inbox") === onlyDeck) live = true; });
    if (!live && !deckRec(onlyDeck, SPACE)) onlyDeck = "";
  }

  /* ------------------------------------------------------------------
     Decks.

     A deck used to be nothing but a label written on each word: the list was
     assembled by walking every word and collecting what it found. So a deck
     whose last word moved out did not become empty, it ceased to exist --
     and an empty deck could not be made at all, because there was nothing to
     write the name on. Meanwhile "Inbox" was offered as the place a new word
     goes while appearing nowhere in the list, which is a deck that does not
     exist being the default.

     Decks are stored now. The list below is still a union with whatever the
     words actually say, so a deck named only by an imported word is never
     lost, and Inbox is always there because it is where everything starts.
     ------------------------------------------------------------------ */
  function deckList() { return Array.isArray(db.decks) ? db.decks : (db.decks = []); }

  function deckRec(name, code) {
    var l = deckList(), i;
    for (i = 0; i < l.length; i++)
      if (l[i].name === name && l[i].lang === code) return l[i];
    return null;
  }

  /* Stamped, because a deck travels to the other device the same way a word
     does and the newer of the two has to win. */
  function putDeck(name, code, deleted) {
    /* Inbox is never a stored record: it exists because decks() always puts
       it there, so storing it would make it possible to delete the one place
       a word can always go. */
    if (name === "Inbox") return null;
    var r = deckRec(name, code);
    if (!r) { r = { name: name, lang: code }; deckList().push(r); }
    r.deleted = !!deleted;
    r.updated = Date.now();
    return r;
  }

  function decks() {
    var seen = {}, out = [];
    here().forEach(function (w) {
      var d = w.deck || "Inbox";
      if (!(d in seen)) { seen[d] = 0; out.push(d); }
      seen[d]++;
    });
    deckList().forEach(function (d) {
      if (!d || d.deleted || d.lang !== SPACE) return;
      if (!(d.name in seen)) { seen[d.name] = 0; out.push(d.name); }
    });
    if (!("Inbox" in seen)) { seen.Inbox = 0; out.push("Inbox"); }
    /* Inbox first wherever decks are listed: it is not alphabetically
       special, it is where every word lands before she files it. */
    out.sort(function (a, b) {
      if (a === "Inbox") return -1;
      if (b === "Inbox") return 1;
      return a < b ? -1 : a > b ? 1 : 0;
    });
    return out.map(function (d) { return { name: d, n: seen[d] }; });
  }

  /* ------------------------------------------------------------------
     Study
     ------------------------------------------------------------------ */
  var session = [], flipped = false, done = 0, total = 0;
  /* Each answer rebuilds the card, which throws away whatever was
     focused. Keep the keyboard where she left it. */
  var keyboarding = false;
  /* How many times a card has come round this sitting. Kept beside the words
     rather than on them, so it never reaches storage or an export. */
  var misses = {};
  var almost = {};   /* answered "Almost" this sitting; each gets one encore */
  var renaming = null;   /* the deck whose name is being edited, if any */
  var CAP = 30;

  /* How many other words must come between a word and itself inside one
     sitting. Fewer than this left in the queue and the card is let go
     rather than shown again immediately. */
  var SPACER = 5;

  /* How many of a sitting are words never answered before. A backlog of
     sixty is a month of reviews, and a sitting made only of the most
     overdue would mean nothing new was ever reached while it lasted; a
     sitting made of whatever is nearest the top of the list -- which is
     what it used to be -- means the oldest due words are never reached at
     all. So: the most overdue first, with a handful of new ones threaded
     through, and both ends of the list move every day. */
  var FRESH = 8;
  /* Whether the note editor is open — on the card, and on a row of the list.
     A word neither dictionary knows was always kept and marked, but until now
     there was nowhere to write what it actually means. */
  var noteOpen = false;
  var editingNote = null;
  var trOpen = false;        /* is the Turkish showing on this card? */
  var trFailed = false;      /* the last lookup could not reach its sources */
  var fullOpen = false;      /* the precise senses instead of the plain ones */

  /* ------------------------------------------------------------------
     A sitting survives a reload.

     Thirty cards is twenty minutes, and a phone that locks, a tab closed by
     accident, or a reload after adding a word threw the whole round away and
     started it again at the first card. So the queue is written down after
     every answer. In this browser only: not in the word list, so it is not
     something that syncs to the other device or turns up in an export -- a
     half-finished round is a fact about this sitting, not about the words.

     Good for the day it was started and no longer. Tomorrow is a different
     set of words and should begin at the Start screen.
     ------------------------------------------------------------------ */
  /* One round per deck, not one round.

     Storing a single sitting was the whole bug. Pressing Study on a second
     deck, or Study everything, overwrote it -- and because a deck round is
     rebuilt from the words still *due*, every card already answered in the
     first round had dropped out of the pool. So coming back to it rebuilt a
     shorter round with the count at zero: "I did five cards and it forgot."
     The mastery bar above remembered them, which made it worse, because the
     two lines then contradicted each other on the same screen.

     So each (language, deck) keeps its own round, all of them under one key
     so a single write covers it, and the whole thing expires at the end of
     the day it was started. "last" is where she was, per language, so a
     reload comes back to the round she was actually in. */
  var SKEY = "vocab.rounds";

  function roundKey(deck) { return SPACE + "\u0000" + (deck || ""); }

  function allRounds() {
    var r = null;
    try { r = JSON.parse(localStorage.getItem(SKEY) || "null"); } catch (e) { r = null; }
    if (!r || r.day !== today() || !r.rounds || typeof r.rounds !== "object") {
      return { day: today(), rounds: {}, last: {} };
    }
    if (!r.last || typeof r.last !== "object") r.last = {};
    return r;
  }

  function saveSession() {
    if (DEMO) return;
    var all = allRounds(), k = roundKey(onlyDeck), any = false, x;
    if (!session.length) {
      delete all.rounds[k];
      if (all.last[SPACE] === (onlyDeck || "")) delete all.last[SPACE];
    } else {
      all.rounds[k] = {
        done: done, total: total,
        ids: session.map(function (w) { return w.id; }),
        misses: misses, almost: almost
      };
      all.last[SPACE] = onlyDeck || "";
    }
    for (x in all.rounds) { any = true; break; }
    try {
      if (any) localStorage.setItem(SKEY, JSON.stringify(all));
      else localStorage.removeItem(SKEY);
    } catch (e) {}
  }

  /* Only the ids are stored, so every card comes back from the live list and
     a word edited, renamed or deleted in between is whatever it is now
     rather than a stale copy of what it was. */
  function resumeSession(deck) {
    if (DEMO) return false;
    var want = typeof deck === "string" ? deck : onlyDeck;
    var rec = allRounds().rounds[roundKey(want)];
    if (!rec || !Array.isArray(rec.ids)) return false;
    var by = {}, q = [], i, w;
    for (i = 0; i < db.words.length; i++) by[db.words[i].id] = db.words[i];
    for (i = 0; i < rec.ids.length; i++) {
      w = by[rec.ids[i]];
      if (w && (w.lang || "en") === SPACE && q.indexOf(w) < 0) q.push(w);
    }
    if (!q.length) return false;
    onlyDeck = want;
    session = q;
    done = Math.max(0, Number(rec.done) || 0);
    total = Math.max(q.length, Number(rec.total) || q.length);
    misses = (rec.misses && typeof rec.misses === "object") ? rec.misses : {};
    almost = (rec.almost && typeof rec.almost === "object") ? rec.almost : {};
    /* Face up, whatever she was looking at when the tab went away: the
       answer she had not given yet is the one being resumed, and showing
       the meaning first would give it to her. */
    flipped = false;
    checkDeck();
    return true;
  }

  /* Where she was in this language when she last answered anything. */
  function resumeLast() {
    var all = allRounds();
    return typeof all.last[SPACE] === "string" ? resumeSession(all.last[SPACE]) : false;
  }

  /* Which cards this sitting is, and in what order.

     Due date first, oldest due at the front, so a backlog drains from the
     bottom instead of being buried by whatever was saved most recently.
     The list this reads from is in the order words were added, newest
     first, and taking the first thirty of it was the whole of the old
     rule: with sixty due, the thirty oldest could wait for ever. */
  function sittingPlan() {
    var pool = dueNow(), fresh = [], seen = [], i, w;
    for (i = 0; i < pool.length; i++) {
      w = pool[i];
      if (answers(w).length || (w.seen || 0) > 0) seen.push(w); else fresh.push(w);
    }
    function byDue(a, b) {
      var x = a.due || "", y = b.due || "";
      if (x !== y) return x < y ? -1 : 1;
      var p = a.added || "", q = b.added || "";
      return p < q ? -1 : p > q ? 1 : 0;      /* the longer it has waited */
    }
    seen.sort(byDue);
    fresh.sort(function (a, b) {
      var p = a.added || "", q = b.added || "";
      return p < q ? -1 : p > q ? 1 : 0;      /* oldest saved first */
    });

    var nNew = Math.min(fresh.length, FRESH);
    var nOld = Math.min(seen.length, CAP - nNew);
    /* Whichever side runs short, the other fills the sitting. */
    if (nOld + nNew < CAP) nNew = Math.min(fresh.length, CAP - nOld);

    /* Threaded through rather than appended, so a sitting is not a wall of
       review followed by a wall of new. */
    var out = [], oi = 0, fi = 0, total = nOld + nNew;
    var gap = nNew ? Math.max(1, Math.floor(total / nNew)) : 0;
    for (i = 0; i < total; i++) {
      var wantNew = nNew && gap && ((i + 1) % gap === 0) && fi < nNew;
      if ((wantNew || oi >= nOld) && fi < nNew) out.push(fresh[fi++]);
      else out.push(seen[oi++]);
    }
    return { list: out, fresh: nNew, due: pool.length };
  }

  function startSession() {
    /* A word renamed to its lemma may now ask the same question as one
       already here, and this is the one moment with no card on screen. */
    if (foldDuplicates()) save();
    session = sittingPlan().list;
    total = session.length;
    done = 0;
    flipped = false;
    misses = {};
    almost = {};
    saveSession();
    counts();      /* the badge mirrors the sitting, so it changes on Start */
    renderDue();
  }

  /* The one line that says a sitting is narrowed, with the way out of it.
     Without this a deck with nothing due reads as a language with nothing
     due, and there is no clue the filter is on. */
  /* "18 in total" under a header reading "Finance - 3 of 8 mastered" is a
     contradiction on one screen: 18 is the whole language, and she was
     studying a deck. Whatever the round was scoped to is what gets counted. */
  function scopeCount() {
    var n = onlyDeck ? inDeckNamed(onlyDeck).length : here().length;
    return n + ' word' + (n === 1 ? '' : 's')
         + (onlyDeck ? ' in ' + esc(onlyDeck) : ' in total');
  }

  function deckBanner() {
    if (!onlyDeck) return "";
    return '<p class="deckonly">Studying <b>' + esc(onlyDeck) + '</b> only'
         + ' <button class="btn-q" id="allDecks">Study everything</button></p>';
  }

  /* A press that lands on a card being rebuilt is a press that never
     happens: the button the finger went down on is gone before it comes
     up, so the browser has nothing to fire a click on. The page redraws
     the card whenever anything arrives for it -- a definition, a
     recording, a merge coming back from the other device -- and with the
     sync now running after every answer, that arrival often landed in the
     middle of the next tap. So a redraw asked for while a press is in
     flight waits for the finger to come up. */
  var pressing = 0, dueWaiting = false;

  document.addEventListener("pointerdown", function () {
    pressing = Date.now();
  }, true);

  function released() {
    pressing = 0;
    if (dueWaiting) { dueWaiting = false; renderDue(); }
  }
  document.addEventListener("pointerup", released, true);
  document.addEventListener("pointercancel", released, true);

  /* A word with nothing on it -- no sense, no plain English, no Turkish --
     is a card that has never told her anything, and binning it needs no
     ceremony. One that has is worth a question first: it carries the
     sentence she met it in, and that is not recoverable. */
  function cardTold(w) {
    return !!((w.senses && w.senses.length) || (w.plain && w.plain.length)
              || hasTurkish(w) || (w.rootdef && w.rootdef.senses
                                   && w.rootdef.senses.length));
  }

  function killBtn(w) {
    return '<button class="cardkill" data-kill="' + esc(w.id) + '" '
         + 'title="Remove this word" aria-label="Remove ' + esc(w.term) + '">'
         + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '
         + 'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" '
         + 'aria-hidden="true">'
         + '<path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/>'
         + '</svg></button>';
  }

  function renderDue() {
    /* A pointerdown with no up -- a drag that left the window, a gesture
       the browser took over -- must not freeze the page for ever. */
    if (pressing && Date.now() - pressing < 1500) { dueWaiting = true; return; }
    pressing = 0;
    var el = $("p-due");
    checkDeck();

    if (!here().length) {
      el.innerHTML = '<div class="card"><p class="empty"><b>No '
        + (SPACE === "en" ? "" : esc(lang().label) + " ") + 'words yet</b>'
        + 'Add one from the <b style="display:inline">Add</b> tab, or install the '
        + 'bookmarklet and save a word straight from whatever you are reading.</p></div>';
      return;
    }
    if (!session.length) {
      var nd = dueNow().length;
      /* Having just finished a round is a different situation from arriving
         at the page. The words left over are the ones answered "Not yet",
         which stay due today on purpose — so the offer is a second round,
         not a puzzle about why the count did not reach zero. */
      var justFinished = done > 0;
      var head, body, label;
      if (justFinished && nd) {
        head = "Round done";
        body = nd + ' word' + (nd === 1 ? ' is' : 's are') + ' still due \u2014 '
             + (nd === 1 ? 'the one' : 'the ones') + ' you answered '
             + '<b style="display:inline">Not yet</b>. They stay due until you '
             + 'get ' + (nd === 1 ? 'it' : 'them') + ', today or any day.';
        label = "Go again";
      } else if (justFinished) {
        head = "All done";
        body = done + ' word' + (done === 1 ? '' : 's') + ' this round, and '
             + 'nothing left due. ' + scopeCount() + '.';
        label = "";
      } else if (nd) {
        head = "Ready when you are";
        var plan = sittingPlan();
        body = nd + ' word' + (nd === 1 ? '' : 's') + ' waiting'
             + (nd > CAP
                 ? ' \u2014 ' + plan.list.length + ' in this sitting, longest '
                   + 'overdue first'
                 : '')
             + (plan.fresh
                 ? (nd > CAP ? ', ' : ' \u2014 ') + plan.fresh + ' of them new.'
                 : '.');
        label = "Start";
      } else if (onlyDeck) {
        var inD = here().filter(function (w) {
          return (w.deck || "Inbox") === onlyDeck;
        }).length;
        head = "Nothing due in " + esc(onlyDeck);
        body = inD
          ? 'All ' + inD + ' word' + (inD === 1 ? '' : 's') + ' in this deck '
            + (inD === 1 ? 'is' : 'are') + ' waiting on a later day.'
          : 'This deck is empty.';
        label = "";
      } else {
        head = "Nothing due today";
        body = 'You have studied everything that came up. ' + scopeCount() + '.';
        label = "";
      }
      el.innerHTML = deckBanner()
        + '<div class="card"><p class="empty"><b>' + head + '</b>'
        + body + '</p>'
        /* Finishing a round is the moment she wants the number, so it is on
           this screen as well as over the card. */
        + '<div class="prog-wrap">'
        + barHtml(bands(onlyDeck ? inDeckNamed(onlyDeck) : here()),
                  onlyDeck || lang().label)
        + '</div>'
        + (label ? '<div style="text-align:center;padding-bottom:18px">'
                 + '<button class="btn" id="go">' + label + '</button></div>' : '')
        + '</div>';
      if ($("go")) $("go").addEventListener("click", startSession);
      return;
    }

    var w = session[0];
    /* "Not yet" puts the card back on the end of the queue rather than
       taking it away, so the ones she is getting wrong are the ones she
       keeps seeing. The count is done-and-left rather than "3 of 7",
       because a card coming round again makes that arithmetic a lie. */
    /* Scoped to whatever the sitting is scoped to, so it answers the same
       question the banner above it asks. */
    var html = deckBanner() + '<div class="study">'
      + barHtml(bands(onlyDeck ? inDeckNamed(onlyDeck) : here()),
                onlyDeck || lang().label)
      + '<div class="progress">' + done + ' done \u00b7 ' + session.length + ' left'
      + (misses[w.id] ? ' \u00b7 again' : almost[w.id] ? ' \u00b7 once more' : '')
      + '</div>';

    if (!flipped) {
      html += '<div class="face" id="face" tabindex="0" role="button" '
            + 'aria-label="Show the meaning">'
            + '<div class="termrow">'
            + '<div class="term">' + esc(headword(w)) + '</div>'
            + sayBtn(w)
            + '</div>'
            + seenAsLine(w)
            + patLine(w)
            + '<div class="tap">Tap, or press space, to see the meaning</div>'
            + killBtn(w) + '</div>';
    } else {
      html += '<div class="face back" id="back" tabindex="0" role="button" '
            + 'aria-label="Turn the card back to the word">'
            + '<div class="termrow">'
            + '<div class="term">' + esc(headword(w)) + '</div>'
            + sayBtn(w)
            + '</div>'
            /* Both words, on the side she is reading the meaning from. The
               headword is what the dictionary files it under; this is the
               form she will actually meet again on a page. */
            + seenAsLine(w)
            + patLine(w)
            + '<div class="pill" style="align-self:flex-start;margin-top:2px">'
            + esc(w.deck || "Inbox") + '</div>';
      if (!w.looked && !w.senses.length) {
        html += '<p class="def" style="margin-top:12px;color:var(--muted)">Looking it up&hellip;</p>';
      } else if (!w.senses.length) {
        html += '<p class="def" style="margin-top:12px;color:var(--warn)">'
              + 'No definition found yet. '
              + ((w.miss || 0) >= LOOK_TRIES
                  ? 'Asked ' + w.miss + ' times, so it is probably not in any '
                    + 'of them.'
                  : 'Tried ' + (w.miss || 1) + ' time'
                    + ((w.miss || 1) === 1 ? '' : 's') + ' so far.')
              + ' <button class="btn-q" id="lookAgain">Look again</button></p>';
      } else {
        /* One hop is already said by the line under the word. A longer chain
           is worth spelling out, because "Evals -> eval -> evaluation"
           explains a headword that otherwise looks unrelated to it. */
        if (w.via && w.via.split("\u2192").length > 2) {
          html += '<div class="via">' + esc(w.via) + '</div>';
        }
        /* Plain English when there is any, the precise senses when she asks
           for them or when Simple Wiktionary has never heard of the word. */
        var shown = shownSenses(w);
        /* Where every sense on the card is a circle -- "ruthlessly: in a
           ruthless manner" -- the root is not a footnote, it is the answer,
           so it takes the place of the circle rather than sitting under it.
           Only once it has actually arrived: until then the circular line is
           still the only thing there is, and a blank card is worse. */
        var leaning = !!(needsRoot(w) && w.rootdef && w.rootdef.senses
                         && w.rootdef.senses.length);
        for (var i = 0; !leaning && i < shown.length; i++) {
          var s = shown[i];
          html += '<div class="sense">'
                + (s.pos ? '<div class="pos">' + esc(s.pos) + '</div>' : '')
                + '<p class="def">' + esc(s.text) + '</p>'
                + (s.example ? '<p class="eg">&ldquo;' + esc(s.example) + '&rdquo;</p>' : '')
                + '</div>';
        }
        /* Under the gloss, not instead of it: "in an acute manner" is still
           true, and the word it is about is what was missing. */
        if (w.rootdef && w.rootdef.senses && w.rootdef.senses.length) {
          /* Dictionaries order senses by etymology, not by how often anybody
             uses them, so "acute" leads with "Brief, quick, short" and the
             sense that explains "acutely aware" is third. Nothing in the
             data says which is which, and the other dictionary orders them
             no better -- so rather than guess, the card lets her say. Tick
             one and it is the only one shown from then on; a tap on it
             gives the others back. */
          var rs = w.rootdef.senses, pin = rootPin(w);
          var ownPos = (shown[0] && shown[0].pos) || "";
          html += '<div class="rootdef' + (leaning ? ' lead' : '') + '">';
          /* Leading: the card's own part of speech, then the word the meaning
             belongs to -- "ADVERB . from ruthless". Underneath: the root
             named for itself, because the line above it is still the answer
             and this one is an aside. */
          html += leaning
            ? '<div class="pos">' + esc(ownPos) + (ownPos ? ' \u00b7 ' : '')
              + 'from ' + esc(w.rootdef.term) + '</div>'
            : '<b>' + esc(w.rootdef.term)
              + (rs[0].pos ? ' <span>' + esc(rs[0].pos) + '</span>' : '')
              + '</b>';
          if (pin >= 0) {
            html += '<p class="rootpinned" data-rootall="1" role="button" '
                  + 'tabindex="0" title="Show the other meanings">'
                  + esc(rs[pin].text) + '</p>';
          } else {
            for (i = 0; i < rs.length; i++) {
              html += '<p class="rootopt">'
                    + (rs.length > 1
                        ? '<button class="pin" data-rootpin="' + i + '" '
                          + 'title="This is the meaning I met" '
                          + 'aria-label="Keep this meaning for '
                          + esc(w.term) + '">\u2713</button>' : '')
                    + '<span>' + esc(rs[i].text) + '</span></p>';
            }
            if (rs.length > 1) {
              html += '<p class="roothint">Tick the one you actually met '
                    + '\u2014 the card keeps it.</p>';
            }
          }
          html += '</div>';
        } else if (w.plain !== null && needsRootLook(w)) {
          html += '<div class="rootdef"><p style="color:var(--muted)">'
                + 'Looking up <b style="display:inline">'
                + esc(needsRootLook(w).root) + '</b>\u2026</p></div>';
        }
      }
      html += relRows(w);

      if (trOpen) {
        html += '<div class="yournote tr"><b>T\u00fcrk\u00e7e</b>';
        /* The failure is checked first. A lookup that could not reach its
           sources writes nothing down, so there is no record to carry the
           news — asking "is there a record?" first left the card saying
           "looking it up" for ever. */
        if (trFailed && !(w.tr && w.tr.from)) {
          html += '<span class="notetext" style="color:var(--stop)">'
                + 'Could not reach Wiktionary or Wikipedia. Nothing is wrong '
                + 'with the word \u2014 press T\u00fcrk\u00e7e again to retry. If it keeps '
                + 'failing, an ad or privacy blocker is the usual cause: both '
                + 'requests go to <b style="display:inline">api.php</b> on '
                + 'wiktionary.org and wikipedia.org.</span>';
        } else if (!w.tr || (w.tr.v || 0) < TR_SOURCES) {
          html += '<span class="notetext" style="color:var(--muted)">'
                + 'Bak\u0131l\u0131yor\u2026</span>';
        } else if ((w.tr.blocks && w.tr.blocks.length) || (w.tr.more && w.tr.more.length)) {
          /* Every sense it has, each on its own line: a word that means three
             things should say all three rather than pick one. */
          var ti, tb;
          for (ti = 0; ti < (w.tr.blocks || []).length; ti++) {
            tb = w.tr.blocks[ti];
            html += '<div class="trline"><span class="trwords">'
                  + esc(tb.words.join(", ")) + '</span>'
                  + (tb.sense ? '<span class="trsense">' + esc(tb.sense) + '</span>' : '')
                  + '</div>';
          }
          for (ti = 0; ti < (w.tr.more || []).length; ti++) {
            html += '<div class="trline"><span class="trwords">'
                  + esc(w.tr.more[ti]) + '</span></div>';
          }
          html += '<div class="trfrom">' + esc(w.tr.from || "Wiktionary")
                /* Said plainly, because akut is the Turkish for acute and
                   not for acutely, and the card should not pretend it is. */
                + (w.tr.via ? ' \u00b7 the Turkish for <b style="display:inline">'
                              + esc(w.tr.via) + '</b>' : '')
                + '</div>';
        } else if (w.tr.one) {
          html += '<div class="trline"><span class="trwords">' + esc(w.tr.one) + '</span>'
                + '<span class="trsense">'
                + esc(w.tr.oneNote
                      || (w.tr.from === "Wikidata"
                            ? "the Turkish name for this, not a dictionary sense"
                            : "the Turkish article for the same thing"))
                + '</span></div>'
                + '<div class="trfrom">' + esc(w.tr.from || "Wikipedia") + '</div>';
        } else {
          html += '<span class="notetext" style="color:var(--warn)">'
                + 'Neither Wiktionary nor Wikipedia has a Turkish entry for this '
                + 'one. Nothing invented \u2014 write your own below.</span>'
                + ' <button class="btn-q" id="trAgain" '
                + 'title="Ask the sources again">Ask again</button>';
        }
        html += '</div>';
      }

      if (noteOpen) {
        html += '<div class="yournote"><b>Your note</b>'
              + '<textarea id="noteBox" placeholder="What it means in your own '
              + 'words, a way to remember it, the Turkish for it\u2026">'
              + esc(w.note || "") + '</textarea>'
              + '<div class="noteacts">'
              + '<button class="btn-q" id="noteSave">Save</button>'
              + '<button class="btn-q" id="noteCancel">Cancel</button></div></div>';
      } else if (w.note) {
        html += '<div class="yournote"><b>Your note</b>'
              + '<span class="notetext">' + esc(w.note) + '</span>'
              + '<div class="noteacts"><button class="btn-q" id="noteBtn">Edit note</button>'
              + trButton(w) + fullButton(w) + '</div>'
              + '</div>';
      } else {
        /* Where the dictionary has not actually answered, say so and point
           at the box. "Accretive" comes back as "relating to accretion" and
           never mentions earnings; that sense is not in Wiktionary to be
           found, so the honest move is to hand her the pen rather than
           invent one. Only on the cards that need it. */
        var thin = thinCard(w);
        if (thin) {
          html += '<p class="ownit">Not the meaning you met? '
                + '<b style="display:inline">Write your own</b> \u2014 it goes '
                + 'on the card and is what you see from then on.</p>';
        }
        html += '<div class="noteacts" style="margin-top:12px">'
              + '<button class="btn-q' + (thin ? ' is-on' : '')
              + '" id="noteBtn">Add a note</button>'
              + trButton(w) + fullButton(w) + '</div>';
      }
      /* Only when nothing above carried one, so a word never shows two. */
      if (!hasExample(w)) {
        if (w.eg && w.eg.text) {
          html += '<div class="egbox"><b>In a sentence</b>'
                + '<span class="egtext">\u201c' + esc(w.eg.text) + '\u201d</span>'
                + '<span class="egfrom">' + esc(w.eg.from || "Wiktionary") + '</span></div>';
        } else if (!w.eg) {
          html += '<div class="egbox"><span class="egtext" '
                + 'style="color:var(--muted)">Looking for an example\u2026</span></div>';
        }
      }

      if (w.src && w.src.sentence) {
        var link = safeUrl(w.src.url);
        html += '<div class="ctx"><b>Where you found it</b>'
              + esc(w.src.sentence)
              + (link ? '<br><a href="' + esc(link) + '" target="_blank" rel="noopener">'
                      + esc(w.src.title || link).slice(0, 70) + ' &rarr;</a>' : '')
              + '</div>';
      }
      html += killBtn(w)
            + '</div>'
            + '<div class="grade">'
            + '<button class="no" id="gNo">Not yet</button>'
            + '<button class="mid" id="gMid">Almost</button>'
            + '<button class="yes" id="gYes">Knew it</button>'
            + '</div>'
            + '<div class="keys">1 not yet \u00b7 2 almost \u00b7 3 knew it</div>';
    }
    html += '</div>';
    el.innerHTML = html;

    if (!flipped) {
      var f = $("face");
      f.addEventListener("click", function (e) {
        /* the speaker is on this face too now, and pressing it is not an
           answer — hearing a word is part of trying to remember it */
        if (e.target.closest && e.target.closest("button")) return;
        flip();
      });
      f.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          /* Stop here. The document handler reads `flipped` to decide what a
             key means, and by the time the event reached it this flip had
             already changed that answer — so the one press turned the card
             over and straight back again. */
          e.preventDefault(); e.stopPropagation();
          keyboarding = true; flip();
        }
      });
      if (keyboarding) f.focus();
      /* fetch while she is still looking at the front, so the back is
         ready by the time she turns it over */
      ensureLooked(w, function () { if (flipped) renderDue(); });
      /* and the recording, so the speaker on this face works straight away.
         Redrawn only once, when the answer lands: by then w.say is set, so
         the next pass does not ask again. */
      if (needsSay(w)) {
        ensureSay(w, function () {
          if (!flipped && session[0] === w) renderDue();
        });
      }
      /* Quietly, while she is still trying to remember it. */
      if (needsEg(w)) ensureExample(w);
      /* The pattern is on this face too, so it is asked for on this face. */
      ensureRel(w, function () { if (session[0] === w) renderDue(); });
    } else {
      $("gNo").addEventListener("click", function () { answer("no"); });
      $("gMid").addEventListener("click", function () { answer("mid"); });
      $("gYes").addEventListener("click", function () { answer("yes"); });

      /* Turning it back. Not from the note editor, a link, or any button —
         those are things she came to the back of the card to use. */
      $("back").addEventListener("click", function (e) {
        if (e.target.closest("button, a, textarea, select, input")) return;
        unflip();
      });
      $("back").addEventListener("keydown", function (e) {
        if (e.target !== this) return;
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault(); e.stopPropagation();
          keyboarding = true; unflip();
        }
      });

      /* Fetched when the back is shown, so a word saved long before this
         existed gets its recording the first time she turns it over. Guarded
         the way ensureLooked is: without the guard the callback fires at once
         for a word that already has one, redraws the back, and asks again —
         a redraw that never ends. */
      if (needsSay(w)) ensureSay(w, function () { if (flipped) renderDue(); });
      if (needsEg(w)) {
        ensureExample(w, function () { if (flipped) renderDue(); });
      }
      /* Only once the headword has settled, or it asks about "plunged". */
      if (w.looked && !w.plain) {
        ensurePlain(w, function () { if (flipped) renderDue(); });
      }
      /* And only once the plain senses have settled too, because whether the
         card is hollow depends on which list it ends up showing. */
      if (w.looked && w.plain) {
        ensureRoot(w, function () { if (flipped) renderDue(); });
      }
      ensureRel(w, function () { if (flipped) renderDue(); });
      if ($("fullBtn")) {
        $("fullBtn").addEventListener("click", function () {
          fullOpen = !fullOpen; renderDue();
        });
      }
      if ($("noteBtn")) {
        $("noteBtn").addEventListener("click", function () { noteOpen = true; renderDue(); });
      }
      if ($("trBtn")) {
        $("trBtn").addEventListener("click", function () {
          trOpen = !trOpen;
          if (trOpen) trFailed = false;   /* this press gets its own verdict */
          renderDue();
          /* Fetched on the press, not on every flip: most cards are turned
             over without ever wanting it. Cached afterwards, so the second
             press is instant. */
          if (trOpen && !(w.tr && w.tr.from && (w.tr.v || 0) >= TR_SOURCES)) {
            ensureTurkish(w, function () { if (flipped && trOpen) renderDue(); });
          }
        });
      }
      if ($("noteSave")) {
        $("noteSave").addEventListener("click", function () {
          w.note = $("noteBox").value.trim().slice(0, 2000);
          save(); noteOpen = false; renderDue(); renderAll();
          toast(w.note ? "Note saved." : "Note cleared.");
        });
        $("noteCancel").addEventListener("click", function () {
          noteOpen = false; renderDue();
        });
        $("noteBox").focus();
      }
      /* Do not pull focus out of the note she is typing. */
      if (keyboarding && !noteOpen) $("gYes").focus();
    }
  }

  function flip() {
    flipped = true;
    noteOpen = false;
    trOpen = false;
    fullOpen = false;
    renderDue();
  }

  function unflip() {
    flipped = false;
    noteOpen = false;
    trOpen = false;
    fullOpen = false;
    renderDue();
  }

  /* Studying without the mouse. Tabbing to the card meant passing Theme,
     Export, Clear all and four tabs first, and there was no way at all to
     grade from the keyboard. */
  document.addEventListener("keydown", function (e) {
    var t = e.target.tagName;
    /* Turning a card over with the keyboard parks focus on "Knew it", so
       that Enter answers. The guard below then swallowed 1, 2 and 3 --
       the three shortcuts the card advertises worked after a click of the
       mouse and did nothing after a press of the space bar. The grade row
       is exempt from it; Enter and space still belong to whichever button
       is focused, which is the whole point of putting focus there. */
    var onGrade = !!(e.target.closest && e.target.closest(".grade"));
    if (!onGrade && (t === "INPUT" || t === "TEXTAREA" || t === "SELECT" || t === "BUTTON")) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!session.length) return;

    if (!flipped) {
      /* the card's own handler covers it when the card itself has focus */
      if (e.target.id === "face") return;
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault(); keyboarding = true; flip();
      }
      return;
    }
    if (e.target.id === "back") return;     /* its own handler has it */
    if (onGrade && (e.key === "Enter" || e.key === " ")) return;
    if (e.key === " ") { e.preventDefault(); keyboarding = true; unflip(); return; }
    if (e.key === "1" || e.key === "ArrowLeft") {
      e.preventDefault(); keyboarding = true; answer("no");
    } else if (e.key === "2") {
      e.preventDefault(); keyboarding = true; answer("mid");
    } else if (e.key === "3" || e.key === "ArrowRight" || e.key === "Enter") {
      e.preventDefault(); keyboarding = true; answer("yes");
    }
  });

  /* The speaker, and the IPA beside it when the dictionary gave one. Its own
     button rather than a click on the word, because the word itself now turns
     the card back over. */
  /* Wiktionary keeps its Turkish translation tables on English entries. A
     Spanish or German word has no such row to read, and the English sense on
     the card is doing that job anyway. */
  /* Installing is a phone thing, and the steps are invisible on a laptop
     where there is nothing to tap. Shown anyway, because this is usually read
     on the laptop and done on the phone afterwards. */
  function installCard() {
    var standalone = false;
    try {
      standalone = window.matchMedia("(display-mode: standalone)").matches
                || window.navigator.standalone === true;
    } catch (e) {}

    if (standalone) {
      return '<div class="card" style="margin-top:14px">'
        + '<h2 style="margin:0 0 4px;font:500 19px/1.2 var(--f-display)">'
        + 'You are in the app</h2>'
        + '<p class="step" style="font-size:14px;color:var(--muted);margin:0">'
        + 'Running from your home screen, so this works with no signal. '
        + 'Catching new words still needs a browser \u2014 there is no address bar '
        + 'in here for the bookmarklet to run from.</p></div>';
    }

    return '<div class="card" style="margin-top:14px">'
      + '<h2 style="margin:0 0 4px;font:500 19px/1.2 var(--f-display)">'
      + 'Put it on your phone</h2>'
      + '<p class="step" style="font-size:14px;color:var(--muted);margin:0 0 10px">'
      + 'On a phone you can add FlashCards to the home screen. It gets its own icon, '
      + 'opens without an address bar, and works with no signal \u2014 which is the '
      + 'point of having it on a phone.</p>'
      + '<p class="step" style="margin:0 0 4px"><b style="display:inline">iPhone</b> '
      + '<span style="color:var(--muted)">\u2014 in Safari. Chrome on iOS cannot do '
      + 'this.</span></p>'
      + '<ol class="howto">'
      + '<li>Open <b style="display:inline">simaydemiral.com/flashcards</b> in Safari</li>'
      + '<li>Tap <b style="display:inline">Share</b> \u2014 the square with the arrow, '
      + 'in the bottom bar</li>'
      + '<li>Scroll down and tap <b style="display:inline">Add to Home Screen</b></li>'
      + '<li>Tap <b style="display:inline">Add</b></li>'
      + '</ol>'
      + '<p class="step" style="margin:10px 0 4px"><b style="display:inline">Android</b> '
      + '<span style="color:var(--muted)">\u2014 in Chrome: accept the install prompt, '
      + 'or Menu \u203a Add to Home screen.</span></p>'
      + '<p class="step" style="font-size:14px;color:var(--muted);margin:10px 0 0">'
      + 'Then <b style="display:inline;color:var(--ink)">sign in inside the app</b>. An '
      + 'installed app often gets its own storage, so it may open empty until your '
      + 'words sync down.</p>'
      + '</div>';
  }

  /* Offered on every card. The gate used to be English-only, which made the
     Turkish a feature of one space out of four -- and Turkish is the first
     language, so it is wanted most on the ones that are not English. */
  /* Under the headword on both faces, because it is a fact about the word
     she is looking at rather than part of the answer she is trying to
     remember. The headword itself stays the lemma: it is what the bookmarklet
     saved, what the decks are keyed to, and what stops the same word being
     added twice -- and a word with two patterns, "contingent on" and
     "contingent upon", has no single headword to become. */
  function patLine(w) {
    if (!(w.rel && w.rel.pat)) return "";
    var ps = w.rel.pat.split("/");
    return '<div class="colloc"><span>Often used with</span>'
         + '<b>' + esc(headword(w)) + " " + esc(ps[0]) + '</b>'
         + (ps[1] ? ' <span style="text-transform:none;letter-spacing:0;'
                  + 'font-family:inherit;font-size:13px">or ' + esc(ps[1])
                  + '</span>' : '')
         + '</div>';
  }

  /* Nothing at all where there is nothing: WordNet carries an antonym for
     about a third of words and Wiktionary for rather fewer, and an empty row
     saying so would be on most cards. */
  function relRows(w) {
    /* Chosen here rather than when the lists were fetched, because the best
       answer arrives last. The collocation is wanted on the front of the
       card, so the thesaurus is asked for while she is still looking at the
       word -- and at that point the plain-English senses have not loaded, so
       the pair written for the sense on the card is not there to prefer yet.
       Deciding at render time means it is used the moment it arrives.

       "Contingent" is the case: it leads with the military quota, and a
       thesaurus asked about a noun answers "contingency". The adjective
       sense underneath carries incidental and casual, written for it. */
    var shown = shownSenses(w), own = { syn: [], ant: [] }, i;
    for (i = 0; i < shown.length; i++) {
      if (shown[i].syn) own.syn = own.syn.concat(shown[i].syn);
      if (shown[i].ant) own.ant = own.ant.concat(shown[i].ant);
    }
    var syn = own.syn[0] || (w.rel && w.rel.syn) || "";
    var ant = own.ant[0] || (w.rel && w.rel.ant) || "";
    if (!syn && !ant) return "";
    function row(label, word) {
      return word ? '<div class="relrow"><span>' + label + '</span>'
                  + '<b>' + esc(word) + '</b></div>' : '';
    }
    return '<div class="rels">' + row("Synonym", syn)
         + row("Antonym", ant) + '</div>';
  }

  function trButton(w) {
    return '<button class="btn-q' + (trOpen ? ' is-on' : '') + '" id="trBtn">'
         + (trOpen ? 'Hide T\u00fcrk\u00e7e' : 'T\u00fcrk\u00e7e') + '</button>';
  }

  /* Only offered when there is a choice to make: no plain entry means the
     precise senses are already what is on the card. */
  function fullButton(w) {
    if (!(Array.isArray(w.plain) && w.plain.length)) return '';
    return '<button class="btn-q' + (fullOpen ? ' is-on' : '') + '" id="fullBtn">'
         + (fullOpen ? 'Plain English' : 'Full dictionary') + '</button>';
  }

  function sayBtn(w) {
    var ipa = w.say && w.say.ipa ? '<span class="ipa">' + esc(w.say.ipa) + '</span>' : '';
    return '<div class="say">'
         + '<button class="speak" data-say="' + esc(w.id) + '" '
         + 'aria-label="Hear ' + esc(w.term) + '" title="Hear it">'
         + '<span aria-hidden="true">\u25b6</span></button>' + ipa + '</div>';
  }

  function answer(how) {
    var w = session.shift();
    grade(w, how);
    if (how === "yes") {
      done++;
    } else if (how === "mid") {
      /* Once more before the sitting ends, rather than straight away: you
         had it, so drilling it immediately proves nothing. */
      if (!almost[w.id] && session.length >= SPACER) {
        almost[w.id] = 1; session.push(w);
      } else done++;
    } else {
      misses[w.id] = (misses[w.id] || 0) + 1;
      /* Three times round is enough. It is already due again today, and a
         card that cannot be escaped is a trap rather than a drill.

         It comes back while being stuck on it is still fresh, but never
         straight away: at least five other words go in front of it. Three
         used to be the gap, and at the end of a sitting -- with two cards
         left, or one -- the arithmetic put it back at the front, so the
         word she had just failed was the next thing she saw. With nothing
         to put between it and itself, the round ends instead: it is due
         today, so Go again brings it round in a fresh sitting. */
      if (misses[w.id] < 3 && session.length >= SPACER) {
        session.splice(SPACER, 0, w);
      } else done++;
    }
    flipped = false;
    noteOpen = false;
    trOpen = false;
    fullOpen = false;
    saveSession();
    counts();
    renderDue();
  }

  /* ------------------------------------------------------------------
     All words
     ------------------------------------------------------------------ */
  function renderAll() {
    var deck = $("fDeck").value, sort = $("fSort").value;
    var rows = here().filter(function (w) { return !deck || (w.deck || "Inbox") === deck; });

    /* Newest first, and always as the tiebreak: a comparator that never
       returns 0 leaves equal rows in whatever order the engine happens to
       produce, which looks like a shuffle. localeCompare so that naive and
       naïve sit together rather than ï sorting after z. */
    function newest(a, b) {
      var x = a.added || "", y = b.added || "";
      return x < y ? 1 : x > y ? -1 : 0;
    }
    rows.sort(function (a, b) {
      var r = 0;
      if (sort === "term") r = a.term.localeCompare(b.term, undefined, { sensitivity: "base" });
      else if (sort === "due") {
        var p = a.due || "", q = b.due || "";
        r = p < q ? -1 : p > q ? 1 : 0;
      } else if (sort === "box") r = (a.box || 1) - (b.box || 1);
      return r || newest(a, b);
    });

    $("allNote").textContent = rows.length + (rows.length === 1 ? " word" : " words");

    if (!rows.length) {
      $("tbl").innerHTML = '<p class="empty">Nothing here yet.</p>';
      return;
    }

    var deckNames = decks().map(function (d) { return d.name; });
    if (deckNames.indexOf("Inbox") < 0) deckNames.push("Inbox");

    var h = '<div class="tblwrap"><table><thead><tr><th>Word</th><th>Deck</th>'
          + '<th class="col-box">Box</th><th class="col-due">Due</th>'
          + '<th></th></tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++) {
      var w = rows[i];
      var first = w.senses && w.senses.length ? w.senses[0].text : "";
      h += '<tr>'
         + '<td><span class="w-term">' + esc(headword(w)) + '</span>'
         + ' <button class="speak sm" data-say="' + esc(w.id) + '" '
         + 'aria-label="Hear ' + esc(w.term) + '" title="Hear it">'
         + '<span aria-hidden="true">\u25b6</span></button>'
         + (w.say && w.say.ipa ? '<span class="ipa sm">' + esc(w.say.ipa) + '</span>' : '')
         + (otherForms(w).length
             ? '<span class="w-form">' + esc(otherForms(w).join(", ")) + '</span>' : '')
         /* slice before escaping, or a 110th character lands mid-entity */
         + (first ? '<span class="w-def">' + esc(String(first).slice(0, 110)) + '</span>' : '')
         + (w.note ? '<span class="w-note">' + esc(String(w.note).slice(0, 110)) + '</span>' : '')
         + '</td>'
         + '<td>' + deckSelect(w, deckNames) + '</td>'
         + '<td class="box-n col-box">' + (w.box || 1) + '/6</td>'
         + '<td class="w-when col-due">' + esc(w.due || "") + '</td>'
         + '<td style="text-align:right;white-space:nowrap">'
         + '<button class="btn-q" data-note="' + esc(w.id) + '" title="Write a note">'
         + (w.note ? 'Note \u00b7' : 'Note') + '</button> '
         + '<button class="btn-q" data-del="' + esc(w.id)
         + '" title="Remove this word" aria-label="Remove this word">'
         + '<span class="lbl-full">Remove</span>'
         + '<span class="lbl-tiny" aria-hidden="true">\u2715</span></button></td>'
         + '</tr>';

      if (editingNote === w.id) {
        h += '<tr class="noterow"><td colspan="5">'
           + '<textarea id="rowNote" placeholder="What it means in your own '
           + 'words, a way to remember it, the Turkish for it\u2026">'
           + esc(w.note || "") + '</textarea>'
           + '<div class="noteacts">'
           + '<button class="btn-q" data-note-save="' + esc(w.id) + '">Save</button>'
           + '<button class="btn-q" data-note-cancel="1">Cancel</button></div></td></tr>';
      }
    }
    $("tbl").innerHTML = h + '</tbody></table></div>';
  }

  /* The deck list is passed in, not recomputed: decks() walks every word, and
     calling it once per row made this quadratic — a second and a quarter of
     frozen page at a few hundred words. */
  function deckSelect(w, names) {
    var cur = w.deck || "Inbox", o = "", i;
    if (names.indexOf(cur) < 0) names = names.concat([cur]);
    for (i = 0; i < names.length; i++) {
      o += '<option value="' + esc(names[i]) + '"'
         + (names[i] === cur ? ' selected' : '') + '>' + esc(names[i]) + '</option>';
    }
    o += '<option value="__new">New deck…</option>';
    return '<select class="f" data-deck="' + esc(w.id) + '">' + o + '</select>';
  }

  /* ------------------------------------------------------------------
     Decks
     ------------------------------------------------------------------ */
  function renderSpaces() {
    var el = $("spaces"), h = "", i, L, n;
    for (i = 0; i < LANGS.length; i++) {
      L = LANGS[i];
      n = db.words.filter(function (w) { return (w.lang || "en") === L.code; }).length;
      h += '<button class="space' + (L.code === SPACE ? ' on' : '') + '" '
         + 'role="tab" aria-selected="' + (L.code === SPACE) + '" '
         + 'data-space="' + L.code + '">' + esc(L.label)
         + (n ? '<span class="space-n">' + n + '</span>' : '') + '</button>';
    }
    el.innerHTML = h;
  }

  $("spaces").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-space]") : null;
    if (b) setSpace(b.getAttribute("data-space"));
  });

  /* A merge that took something away leaves the list as it was behind it,
     for a day. After that the chance to undo has passed and the copy goes,
     rather than sitting in storage for ever. */
  function undoable() {
    try {
      var raw = localStorage.getItem(PREV);
      if (!raw) return null;
      var p = JSON.parse(raw);
      if (!p || !p.db || Date.now() - (p.at || 0) > 86400000) {
        localStorage.removeItem(PREV);
        return null;
      }
      return p;
    } catch (e) { return null; }
  }

  function undoSync() {
    var p = undoable();
    if (!p) return;
    var old;
    try { old = JSON.parse(p.db); } catch (e) { return; }
    if (!old || !Array.isArray(old.words)) return;
    db.words = normalize(old.words);
    db.decks = normalizeDecks(old.decks);
    db.gone = Array.isArray(old.gone) ? old.gone : [];
    /* Marked, every one, so the restored list goes up with stamps newer
       than whatever replaced it -- an undo that only held on this device
       would be undone again by the next sync. */
    for (var i = 0; i < db.words.length; i++) mark(db.words[i].id);
    try { localStorage.removeItem(PREV); } catch (e) {}
    session = []; done = 0; misses = {}; almost = {};
    saveSession();
    save();
    renderSpaces(); counts(); fillFilter(); renderAll(); renderDecks(); renderDue();
    renderAccount();
    toast("Put back as it was before that sync.");
  }

  function ago(t) {
    var s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 10) return "just now";
    if (s < 90) return s + "s ago";
    var m = Math.round(s / 60);
    if (m < 90) return m + " min ago";
    var h = Math.round(m / 60);
    if (h < 36) return h + "h ago";
    return Math.round(h / 24) + "d ago";
  }

  function renderAccount() {
    var el = $("account");
    if (!el || DEMO) return;
    if (!me) { el.innerHTML = ""; return; }
    if (!me.signedIn) {
      el.innerHTML = '<a class="btn-q" href="/auth/start">Sign in to sync</a>';
      return;
    }
    /* A Sync now button is an admission that the app does not do it by
       itself. It does: on every change, on coming back, on the network
       returning, and on a timer. So this is a state, not a chore -- what it
       says is true at the moment it says it, and tapping it is for the
       impatient rather than the careful. */
    var when = syncing ? "syncing\u2026"
             : tries ? "will retry"
             : lastSync ? "synced " + ago(lastSync)
             : dirty ? "not synced yet" : "synced";
    el.innerHTML = '<span class="who" title="' + esc(me.email || "") + '">'
                 + esc(me.email || "signed in") + '</span>'
                 + '<button type="button" class="syncstate" id="syncGo" '
                 + 'title="Sync now">' + esc(when) + '</button>'
                 + (undoable() ? ' <button type="button" class="btn-q" id="undoSync">'
                                 + 'Undo last sync</button>' : '')
                 + ' <a class="btn-q" href="/auth/signout">Sign out</a>';
  }

  /* The button exists so a sync is something she can ask for and watch,
     rather than something she has to trust happened. */
  $("account").addEventListener("click", function (e) {
    if (!e.target) return;
    if (e.target.id === "undoSync") { undoSync(); return; }
    if (e.target.id !== "syncGo") return;
    if (!me || !me.signedIn) return;
    tries = 0;
    syncNow();
  });

  /* ------------------------------------------------------------------
     Progress.

     None of this was possible until the answers themselves were written
     down: a box could say where a word had got to but never when, so there
     was no such thing as "today" to count. The history therefore starts the
     day that shipped and fills forwards -- the only thing here with a past
     is when a word was added, which has always been stored.
     ------------------------------------------------------------------ */
  var CHART_DAYS = 7;

  var WEEKDAY = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  function dayOf(ms) { return ymd(new Date(ms)); }

  /* Four things can happen to a word in a day, and they are not the same
     thing counted four ways:

       seen      she was asked it
       mastered  it crossed into the long gaps that day
       learned   it moved up a box without reaching that
       added     it arrived, and has not been asked yet

     Counted per word rather than per answer: a word drilled four times in
     one sitting was seen once. */
  function statsBy(list) {
    var by = {}, i, j, w, log, e, prev, k, d;
    function slot(key) {
      if (!by[key]) by[key] = { seen: {}, top: {}, mid: {}, added: 0,
                                nSeen: 0, nTop: 0, nMid: 0, answers: 0 };
      return by[key];
    }
    function hit(d, which, id) {
      if (d[which][id]) return;
      d[which][id] = 1;
      d["n" + which.charAt(0).toUpperCase() + which.slice(1)]++;
    }
    for (i = 0; i < list.length; i++) {
      w = list[i];
      log = answers(w);
      prev = null;
      for (j = 0; j < log.length; j++) {
        e = log[j];
        k = dayOf(e.t); d = slot(k);
        d.answers++;
        hit(d, "seen", w.id);
        var was = prev ? (prev.b || 1) : 1;
        var now = e.b || 1;
        if (now >= MASTER && was < MASTER) hit(d, "top", w.id);
        else if (now > was) hit(d, "mid", w.id);
        prev = e;
      }
      /* The added date is the moment it was saved, read in UTC rather than
         here, so a word caught late at night can sit on the next column. */
      k = String(w.added || "").slice(0, 10);
      if (/^\d{4}-\d{2}-\d{2}$/.test(k)) slot(k).added++;
    }
    return by;
  }

  function renderStats() {
    var list = here(), b = bands(list), by = statsBy(list), t = today();
    var tod = by[t] || { nSeen: 0, nTop: 0, nMid: 0, added: 0, answers: 0 };

    /* The last seven days, including the empty ones: a day she did nothing
       is a fact about the week too. */
    var days = [], i, d = new Date();
    d.setDate(d.getDate() - (CHART_DAYS - 1));
    for (i = 0; i < CHART_DAYS; i++) {
      var key = ymd(d);
      days.push({ key: key, dow: WEEKDAY[d.getDay()],
                  s: by[key] || { nSeen: 0, nTop: 0, nMid: 0, added: 0, answers: 0 } });
      d.setDate(d.getDate() + 1);
    }
    var top = 1;
    for (i = 0; i < days.length; i++) {
      top = Math.max(top, days[i].s.nSeen, days[i].s.nTop, days[i].s.nMid, days[i].s.added);
    }

    /* ---- how far through, in one number ---- */
    var h = '<div class="card">'
      + '<p class="eyebrow">Your vocabulary journey</p>'
      + '<div class="big"><em>' + pctDone(b) + '<i>%</i></em><span>mastered</span>'
      + '<span class="of">of ' + b.n + ' word' + (b.n === 1 ? '' : 's') + '</span></div>'
      + barHtml(b, "", true)
      + '</div>';

    /* ---- the week, and the day ---- */
    h += '<div class="statrow">'
      + '<div class="card">'
      + '<p class="eyebrow">Last seven days</p>'

      + '<p class="cardsub">Asked, moved up, mastered, and added \u2014 counted by word, '
      + 'not by answer.</p>'
      + '<div class="chart">';
    function bar(cls, n) {
      return '<span class="bar ' + cls + '" style="height:'
           + (n ? Math.max(3, Math.round(n * 100 / top)) : 0) + '%"></span>';
    }
    for (i = 0; i < days.length; i++) {

      h += '<div class="day' + (days[i].key === t ? ' today' : '') + '" title="'
         + esc(days[i].key + " \u2014 " + s2.nSeen + " seen, " + s2.nTop + " mastered, "
               + s2.nMid + " learned, " + s2.added + " added") + '">'
         + bar("b-seen", s2.nSeen) + bar("b-top", s2.nTop)
         + bar("b-mid", s2.nMid) + bar("b-add", s2.added)
         + '</div>';
    }
    h += '</div><div class="axis">';
    for (i = 0; i < days.length; i++) {
      h += '<span' + (days[i].key === t ? ' class="on"' : '') + '>'
         + days[i].dow + '</span>';
    }
    h += '</div>'
      + '<ul class="chart-key">'
      + '<li><span class="k-dot k-seen"></span>Seen</li>'
      + '<li><span class="k-dot k-top"></span>Mastered</li>'
      + '<li><span class="k-dot k-mid"></span>Learned</li>'
      + '<li><span class="k-dot k-add"></span>Added</li>'
      + '</ul>';

    var anyLog = false;
    for (i = 0; i < list.length; i++) { if (answers(list[i]).length) { anyLog = true; break; } }
    if (!anyLog) {
      h += '<p class="cardsub" style="margin:14px 0 0;color:var(--faint)">'
         + 'No answers recorded yet. Every answer from now on is kept with the day it '
         + 'was given, so this fills in as you study \u2014 there is no history before '
         + 'today to draw.</p>';
    }
    h += '</div>';

    function tile(cls, label, value, note) {
      return '<div class="stat"><i><span class="k-dot ' + cls + '"></span>' + label + '</i>'
           + '<b>' + value + '</b><s>' + esc(note) + '</s></div>';
    }
    h += '<div class="card">'
      + '<p class="eyebrow">Today at a glance</p>'
      + '<div class="statgrid">'
      + tile("k-seen", "Seen", tod.nSeen, tod.answers + (tod.answers === 1 ? " answer" : " answers"))
      + tile("k-top", "Mastered", tod.nTop, tod.nTop ? "into the long gaps" : "none yet")
      + tile("k-mid", "Learned", tod.nMid, tod.nMid ? "moved up a box" : "none yet")
      + tile("k-add", "Added", tod.added, "waiting to be studied")
      + '</div></div></div>';

    $("p-stats").innerHTML = h;
  }

  function langLabel() {
    for (var i = 0; i < LANGS.length; i++) if (LANGS[i].code === SPACE) return LANGS[i].label;
    return "";

  function removeWord(id) {
    /* A tombstone, not a disappearance: a row that simply vanishes here is
       handed straight back by whichever device has not synced yet. */
    for (var dz = 0; dz < db.words.length; dz++) {
      if (db.words[dz].id === id) {
        db.gone = db.gone || [];
        db.gone.push({ id: id, deleted: true, updated: Date.now() });
        break;
      }
    }
    db.words = db.words.filter(function (w) { return w.id !== id; });
    session = session.filter(function (w) { return w.id !== id; });
    saveSession();
    if (editingNote === id) editingNote = null;
    /* Turn the study card back over. Leaving it flipped showed the next
       word's back, and the lookup only fires from the front, so that card
       sat on "Looking it up..." for good. */
    flipped = false;
    save(); counts(); fillFilter(); renderAll(); renderDecks(); renderDue();
