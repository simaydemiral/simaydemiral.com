  /* ------------------------------------------------------------------
     Add — by hand, by paste, and the bookmarklet
     ------------------------------------------------------------------ */
  /* The bookmarklet. Kept readable here and joined into one javascript: URL.

     Sentence boundaries are not just "a full stop": the decimal point in
     "$1.25 trillion" was being read as one, and the captured sentence began
     halfway through a number. A boundary is a stop followed by a space and
     not preceded by a digit or a lone capital. */
  var MARKLET = [
    "javascript:(function(){",
    "var s=window.getSelection(),t=(s?s.toString():'').trim();",
    "if(!t){alert('Select a word first, then click this.');return;}",
    "var sent='';try{",
    "var n=s.anchorNode,e=n&&(n.nodeType===1?n:n.parentElement);",
    "while(e&&e.textContent.length<40&&e.parentElement)e=e.parentElement;",
    "var x=(e?e.textContent:'').replace(/\\s+/g,' '),i=x.indexOf(t);",
    "var stop=function(k){var c=x.charAt(k);",
    "if(c!=='.'&&c!=='!'&&c!=='?')return false;",
    "if(!/\\s|$/.test(x.charAt(k+1)||' '))return false;",
    "var p=x.charAt(k-1);return !/[0-9]/.test(p)&&!/^[A-Z]$/.test(p);};",
    "if(i>-1){var a=0,k;",
    "for(k=i-1;k>0;k--){if(stop(k)){a=k+1;break;}}",
    "var b=x.length;",
    "for(k=i+t.length;k<x.length;k++){if(stop(k)){b=k+1;break;}}",
    "sent=x.slice(a,b).trim();}",
    "}catch(err){}",
    "window.open('", "ORIGIN", "/flashcards/add#w='+encodeURIComponent(t)",
    "+'&s='+encodeURIComponent(sent.slice(0,400))",
    "+'&u='+encodeURIComponent(location.href)",
    "+'&t='+encodeURIComponent(document.title),'vocab','width=430,height=250');",
    "})()"
  ].join("");

  function marklet() {
    return MARKLET.replace("ORIGIN", location.origin);
  }

  function renderAdd() {
    $("p-add").innerHTML =
      '<div class="card">'
      + '<h2 style="margin:0 0 4px;font:500 19px/1.2 var(--f-display)">Save a word from anywhere</h2>'
      + '<p class="step" style="font-size:14px;color:var(--muted)">'
      + 'Drag this to your bookmarks bar. Then on any page: select a word and click it. '
      + 'Works in Chrome and Safari.</p>'
      + '<p style="margin:12px 0 4px"><a class="mark" id="mark" href="#">+ Save to FlashCards</a></p>'
      + '<p class="step" style="font-size:13px;color:var(--faint);margin-top:10px">'
      + 'Safari hides the bookmarks bar by default &mdash; View › Show Favourites Bar.</p>'
      + '</div>'

      + '<div class="card" style="margin-top:14px">'
      + '<h2 style="margin:0 0 4px;font:500 19px/1.2 var(--f-display)">Or type them in</h2>'
      + '<p class="step" style="font-size:14px;color:var(--muted)">'
      + 'One word or phrase per line. Paste a list from anywhere.</p>'
      + '<textarea id="paste" placeholder="salient&#10;due diligence&#10;ubiquitous"></textarea>'
      + '<div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
      + '<select class="f" id="pasteDeck"></select>'
      + '<button class="btn" id="pasteGo">Add them</button>'
      + '</div></div>'

      + installCard()

      + '<div class="card" style="margin-top:14px">'
      + '<h2 style="margin:0 0 4px;font:500 19px/1.2 var(--f-display)">Where your words live</h2>'
      /* Rewritten when sign-in arrived. The old wording promised there was no
         account and no server, which stopped being true that afternoon. */
      + '<p class="step" style="font-size:14px;color:var(--muted);margin:0 0 8px">'
      + '<b style="display:inline;color:var(--ink)">Signed out</b> \u2014 in this browser, '
      + 'on this device. No account, nothing on a server.</p>'
      + '<p class="step" style="font-size:14px;color:var(--muted);margin:0 0 8px">'
      + '<b style="display:inline;color:var(--ink)">Signed in</b> \u2014 your words sync to '
      + 'your account, so the same list is on every device you sign in on. That includes '
      + 'the sentences you saved them with.</p>'
      + '<p class="step" style="font-size:14px;color:var(--muted);margin:0">'
      + 'Either way, the only thing sent while you study is a single word at a time, to '
      + 'Wiktionary, to ask what it means. The pages you took words from are never sent '
      + 'anywhere.</p>'
      + '</div>';

    var a = $("mark");
    a.setAttribute("href", marklet());
    a.addEventListener("click", function (e) {
      e.preventDefault();
      toast("Drag it to your bookmarks bar — clicking it here does nothing.");
    });

    fillDeckSelect($("pasteDeck"), "Inbox", true);
    $("pasteGo").addEventListener("click", addPasted);
  }

  function addPasted() {
    var lines = $("paste").value.split("\n");
    var deck = $("pasteDeck").value || "Inbox";
    if (deck === "__new") {
      deck = (prompt("Name the new deck") || "").trim()
               .replace(/\s+/g, " ").slice(0, 40) || "Inbox";
      if (deck !== "Inbox") putDeck(deck, SPACE, false);
    }
    var added = 0, dup = 0, long = 0, junk = 0, i;
    for (i = 0; i < lines.length; i++) {
      var term = lines[i].trim().replace(/\s+/g, " ");
      if (!term) continue;
      /* A whole sentence is not a vocabulary word. Say so rather than
         dropping the line without a word about it. */
      if (term.length > 80) { long++; continue; }
      var r = addWord(term, deck, {});
      if (r === "added") added++;
      else if (r === "junk") junk++;
      else dup++;
    }
    if (!added && !dup && !long && !junk) { toast("Nothing to add."); return; }
    save();
    $("paste").value = "";
    /* The pill carries a count too, and it was the one thing not redrawn --
       the tab said 18 while the pill above it still said 17. */
    renderSpaces(); counts(); renderAll(); renderDecks(); renderDue();
    toast(added + " added" + (dup ? ", " + dup + " already there" : "")
        + (long ? ", " + long + " too long to be a word" : "")
        + (junk ? ", " + junk + " with no letters in" : "") + ".");
  }

  /* Returns "added", "dup" or "junk" — the caller counts them separately, so
     a rejected line is not reported as one she already had. */
  function addWord(term, deck, src) {
    /* "???" is not a word, and Wiktionary will cheerfully define it. */
    if (!/[A-Za-z\u00C0-\u024F]/.test(term)) return "junk";
    /* Scoped to the language: "die" is an English verb and a German article,
       and saving one must not be refused because the other is already here.
       The id carries the language for the same reason. */
    /* idOf(term), not SPACE + ":" + idOf(term). normalize() recomputes
       every id as idOf(term) on the next load, so a word added with a
       language in front of its id silently changed identity the moment the
       page was reloaded -- and three things went wrong at once. A round
       restored after a reload dropped every word added during it, because
       the queue had been written down under the old ids. The duplicate
       check here never matched, so it was doing nothing and hasForm was
       quietly carrying it. And the word went to the server twice, under
       both ids, so the other device got two cards for one word.

       Fixed by agreeing with normalize rather than by changing it: every
       word already stored, here and on the server, keeps the id it has.
       The cost is that ids are not scoped by language, so the same spelling
       in two spaces -- English "die", German "die" -- is one card. That was
       already true after any reload; it is now true immediately. Scoping
       them properly means migrating every id on both sides, which is not
       something to do quietly underneath a list she relies on. */
    var id = idOf(term), i, mine = here();
    for (i = 0; i < mine.length; i++) {
      if (mine[i].id === id || hasForm(mine[i], term)) return "dup";
    }
    db.words.unshift({
      id: id, term: term, lang: SPACE, added: new Date().toISOString(),
      deck: deck || "Inbox", box: 1, due: today(),
      src: src || {}, senses: [], looked: false, note: "", forms: [term]
    });
    return "added";
  }

  function fillDeckSelect(sel, current, withNew) {
    var list = decks(), names = list.map(function (d) { return d.name; });
    if (names.indexOf("Inbox") < 0) names.unshift("Inbox");
    var o = "", i;
    for (i = 0; i < names.length; i++) {
      o += '<option value="' + esc(names[i]) + '"'
         + (names[i] === current ? ' selected' : '') + '>' + esc(names[i]) + '</option>';
    }
    if (withNew) o += '<option value="__new">New deck…</option>';
    sel.innerHTML = o;
  }

  /* ------------------------------------------------------------------
     Chrome
     ------------------------------------------------------------------ */
  function counts() {
    /* While a sitting is live the honest answer to "is there anything to do"
       is what is left in it — not the day's total, which over-promises at the
       start and reads as "finished" while a card is still on screen. */
    $("nDue").textContent = session.length || dueNow().length;
    $("nAll").textContent = here().length;
    $("nDecks").textContent = decks().length;
  }

  function fillFilter() {
    var cur = $("fDeck").value;
    var list = decks(), o = '<option value="">All decks</option>', i;
    for (i = 0; i < list.length; i++) {
      /* The value must be the deck name, not the label: the label carries a
         count, and a select with no value attribute reports its own text —
         so filtering compared "Inbox (8)" against "Inbox" and found nothing. */
      o += '<option value="' + esc(list[i].name) + '"'
         + (list[i].name === cur ? ' selected' : '') + '>'
         + esc(list[i].name) + ' (' + list[i].n + ')</option>';
    }
    $("fDeck").innerHTML = o;
  }

  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".tab") : null;
    if (!b) return;
    var k = b.getAttribute("data-tab"), keys = ["due", "all", "decks", "stats", "add"], i;
    for (i = 0; i < keys.length; i++) {
      var on = keys[i] === k;
      document.querySelector('.tab[data-tab="' + keys[i] + '"]').setAttribute("aria-selected", on ? "true" : "false");
      $("p-" + keys[i]).hidden = !on;
    }
    if (k === "all") { fillFilter(); renderAll(); }
    if (k === "decks") renderDecks();
    if (k === "stats") renderStats();
    if (k === "add") renderAdd();
    if (k === "due") renderDue();
  });

  $("fDeck").addEventListener("change", renderAll);
  $("fSort").addEventListener("change", renderAll);

  document.addEventListener("click", function (e) {
    /* closest, not the target itself: a button with a span inside it would
       otherwise swallow the click, because the span carries no attribute. */
    var get = function (k) {
      var el = e.target.closest ? e.target.closest("[" + k + "]") : null;
      return el ? el.getAttribute(k) : null;
    };

    var sayId = get("data-say");
    if (sayId) {
      for (var si = 0; si < db.words.length; si++) {
        if (db.words[si].id === sayId) {
          var sw = db.words[si];
          /* Nothing fetched yet — get it, then play it, so the first press
             works rather than teaching her the button is broken. */
          if (needsSay(sw)) ensureSay(sw, function () { speak(sw); renderAll(); renderDue(); });
          else speak(sw);
          break;
        }
      }
      return;
    }

    var noteId = get("data-note");
    if (noteId) {
      editingNote = (editingNote === noteId) ? null : noteId;
      renderAll();
      if (editingNote && $("rowNote")) $("rowNote").focus();
      return;
    }
    var saveId = get("data-note-save");
    if (saveId) {
      var box = $("rowNote"), k;
      for (k = 0; k < db.words.length; k++) {
        if (db.words[k].id === saveId) {
          db.words[k].note = box ? box.value.trim().slice(0, 2000) : "";
          toast(db.words[k].note ? "Note saved." : "Note cleared.");
        }
      }
      save(); editingNote = null; renderAll(); renderDue();
      return;
    }
    if (get("data-note-cancel")) { editingNote = null; renderAll(); return; }

    var del = get("data-del");
    if (del) { removeWord(del); return; }

    /* The bin on the card. A word that has told her nothing goes without a
       question; one that has is asked about first, because the sentence she
       met it in goes with it. */
    var kill = get("data-kill");
    if (kill) {
      var kw = null, ki;
      for (ki = 0; ki < db.words.length; ki++) {
        if (db.words[ki].id === kill) { kw = db.words[ki]; break; }
      }
      if (!kw) return;
      if (cardTold(kw)
          && !confirm("Remove \u201c" + kw.term + "\u201d?\n\nIt goes from every "
                      + "device, with the sentence you saved it from.")) return;
      removeWord(kill);
      return;
    }
    /* An inline field rather than prompt(). Chrome suppresses page dialogs
       outright once "prevent this page from creating additional dialogs" has
       been ticked, and then Rename silently did nothing at all. */
    var ren = get("data-rename");
    if (ren) {
      renaming = ren;
      renderDecks();
      var box = $("deckName");
      if (box) { box.focus(); box.select(); }
      return;
    }
    if (get("data-rencancel")) { renaming = null; renderDecks(); return; }
    var rs = get("data-rensave");
    if (rs) { saveDeckName(rs); return; }

    if (e.target && e.target.id === "newDeckGo") { makeDeck(); return; }

    var dd = get("data-deckdel");
    if (dd) { dropDeck(dd); return; }

    var dg = get("data-deckgo");
    if (dg) { studyDeck(dg); return; }

    var rp = get("data-rootpin");
    if (rp !== null && session[0]) {
      session[0].rootpin = Number(rp);
      mark(session[0].id); save(); renderDue();
      return;
    }
    if (get("data-rootall") !== null && session[0]) {
      session[0].rootpin = -1;
      mark(session[0].id); save(); renderDue();
      return;
    }

    /* The same escape hatch the definition has: three goes is a ceiling,
       not a verdict, and a word that came back empty once -- a source
       briefly down, a sense that did not match -- should be askable again
       without waiting for a migration to clear it. */
    if (e.target && e.target.id === "trAgain") {
      var tw = session[0];
      if (tw) {
        delete tw.tr;
        trFailed = false;
        save();
        renderDue();
        ensureTurkish(tw, function () { if (flipped && trOpen) renderDue(); });
      }
      return;
    }

    /* Asked again on purpose, so the three-try ceiling is not a dead end. */
    if (e.target && e.target.id === "lookAgain") {
      var lw = session[0];
      if (lw) {
        lw.miss = 0; lw.looked = false; lw.lv = 0;
        save();
        ensureLooked(lw, function () { renderDue(); });
        renderDue();
      }
      return;
    }

    if (e.target && e.target.id === "allDecks") {
      /* The deck round is kept, not discarded -- she is stepping out of it,
         not throwing it away. And "Study everything" now does: it used to
         empty the sitting and leave her on the Start screen, which is not
         what the button says. */
      saveSession();
      onlyDeck = "";
      session = []; done = 0; misses = {}; almost = {};
      if (!resumeSession("")) { startSession(); return; }
      saveSession();
      counts(); renderDue();
      return;
    }
  });

  /* Study one deck. The sitting restarts, because a round already under way
     was built from a different set of words -- unless it was built from
     these ones. Pressing Study on the deck she is already in is how she
     comes back to it after adding a word, not a request to begin again, and
     restarting there threw away the count and the cards that had come round
     once already. */
  function studyDeck(name) {
    var b = document.querySelector('.tab[data-tab="due"]');
    if (b) b.click();
    if (onlyDeck === name && session.length) { renderDue(); return; }
    /* Write down the round she is leaving before picking up the next one,
       and do it while onlyDeck still says which round that was. */
    saveSession();
    onlyDeck = name;
    session = []; done = 0; misses = {}; almost = {};
    /* Hers if she has one from earlier today; a new one otherwise. */
    if (resumeSession(name)) { saveSession(); counts(); renderDue(); return; }
    startSession();
    if (!session.length) renderDue();
  }

  function makeDeck() {
    var box = $("newDeck");
    var name = box ? box.value.trim().replace(/\s+/g, " ").slice(0, 40) : "";
    if (!name) { toast("Give the deck a name first."); return; }
    var dl = decks(), i;
    for (i = 0; i < dl.length; i++) if (dl[i].name === name) {
      toast("\u201c" + name + "\u201d already exists."); return;
    }
    putDeck(name, SPACE, false);
    if (box) box.value = "";
    save(); renderDecks(); fillFilter(); counts();
    toast("\u201c" + name + "\u201d is ready. Nothing in it yet.");
  }

  /* Deleting a deck never deletes words -- they go back to Inbox, which is
     what Inbox is for. Said out loud, because the words move whether or not
     that is what she pictured. */
  function dropDeck(name) {

     A word's past is written as the answers it was given, so many days ago,
     and replayed through the same ladder the app grades by. Writing the box
     down by hand instead would let the card and the chart disagree about
     the same word -- which is the one thing a demo of a progress page must

  var DEMO_DAY = 86400000;

  /* Noon, not now. The added date is stored as an instant and read back as
     a UTC calendar day, so a word "added today" at four in the afternoon in
     California is already tomorrow's column -- and the demo ends on a
     Progress page reporting that it added nothing. Noon local lands on the
     intended day either side of the line. */
  function demoAdded(daysAgo) {
    var d = new Date();
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() - daysAgo);
    return d.toISOString();
  }

  /* A word's past, written as the answers she gave rather than as dates.

     The dates come from the schedule itself: the first answer on the day
     the word was saved, and every one after it on the day the one before
     made it due. That is the shape of a deck somebody has kept up with,
     it spreads the week's answers the way real study does, and it means
     the chart can never disagree with the ladder. An answer that would
     fall in the future is simply one she has not given yet, which is what
     leaves a word due.

     "y" knew it, "m" almost, "n" not yet. */
  function demoRun(addedDaysAgo, pattern) {
    var out = [], day = addedDaysAgo, box = 1, i, c, h, gap;
    for (i = 0; i < pattern.length; i++) {

      if (h === "yes") box = Math.min(BOXES, box + 1);
      else if (h === "mid") box = Math.max(2, box);
      else box = 1;
      out.push([day, h]);

    { term: "Entwicklung", lang: "de", gen: "f", deck: "Nachrichten", added: 16, p: "yyy",

    { term: "Abstimmung", lang: "de", gen: "f", deck: "Arbeit", added: 16,
      pos: "noun",
      sense: "A vote, or the business of getting people to agree beforehand.",
      met: "Die Abstimmung dauerte l\u00e4nger als die Entscheidung.", from: "Projektnotiz" },
    { term: "ber\u00fccksichtigen", lang: "de", deck: "Uni", added: 16, p: "yy",
      pos: "verb",
      sense: "To take something into account when deciding.",
      met: "Das haben wir nicht ber\u00fccksichtigt.", from: "Vorlesung" },
    { term: "Engpass", lang: "de", gen: "m", deck: "Arbeit", added: 16,

      pos: "adjective",

    { term: "Frist", lang: "de", gen: "f", deck: "Arbeit", added: 16,
      pos: "noun",
      sense: "A deadline \u2014 the period you are given, and its end.",
      met: "Die Frist l\u00e4uft am Freitag ab.", from: "E-Mail" },
    { term: "Ma\u00dfnahme", lang: "de", gen: "f", deck: "Nachrichten", added: 16, p: "yym",
      pos: "noun",
      sense: "A measure \u2014 a step taken to deal with something.",

  function demoData() {
    var out = { v: 1, words: [] }, i;
    for (i = 0; i < DEMO_WORDS.length; i++) out.words.push(demoWord(DEMO_WORDS[i]));
    return out;
  }

  /* ------------------------------------------------------------------
     The demo, played.

     Five beats: the page she is reading, the bookmarklet firing, the card,
     an answer, and the week. Every click below lands on a real control and
     goes through the same handler a finger would, so the embed is the app
     working rather than a recording of it -- which is also why the demo is
     worth keeping: it cannot drift away from the thing it is showing.

     Nothing starts until the parent says the frame is on screen. A demo
     that plays to a folded-away panel and then refuses to replay is worse
     than one that starts late.
     ------------------------------------------------------------------ */
  var demoTimers = [], demoRunning = false, demoCur = null;

  function demoAt(ms, fn) { demoTimers.push(setTimeout(fn, ms)); }
  function demoStop() {
    for (var i = 0; i < demoTimers.length; i++) clearTimeout(demoTimers[i]);
    demoTimers = [];
  }

  /* The page the word is caught on. Invented, and under example.com, which
     is reserved for exactly this -- nothing here wears a real masthead. */
  function demoBuild() {
    var o = document.createElement("div");
    o.id = "catch";
    o.setAttribute("aria-hidden", "true");
    o.innerHTML =
        '<div class="catch-win">'
      +   '<div class="catch-bar">'
      +     '<span class="catch-dots"><i></i><i></i><i></i></span>'
      +     '<span class="catch-url">' + esc(DEMO_SRC.url) + '</span>'
      +   '</div>'
      +   '<div class="catch-marks">'
      +     '<span class="catch-mark" id="catchMark">+ Save to FlashCards</span>'
      +     '<span class="catch-mark catch-mark--dim">Course reader</span>'
      +     '<span class="catch-mark catch-mark--dim">Syllabus</span>'
      +   '</div>'
      +   '<div class="catch-page">'
      +     '<p class="kick">' + esc(DEMO_SRC.title) + '</p>'
      +     '<h2>Why the second opinion costs more than the first</h2>'
      +     '<p>Nobody defends the extra review on its merits. They defend it '
      +     'as insurance, which is a different argument and a much harder one '
      +     'to refuse.</p>'
      +     '<p>Every extra approval is sold as prudence, but most of them '
      +     'exist to <mark id="catchWord">obviate</mark> a decision nobody '
      +     'wants to own. The cost is never the meeting itself; it is the '
      +     'fortnight the decision spends in the queue behind it.</p>'
      +     '<p>Which is the part nobody puts in the business case, because '
      +     'it does not arrive as a line item. It arrives as a quarter that '
      +     'went slowly and nobody can say why.</p>'
      +     '<p>The firms that are quick about this are not braver than the '
      +     'rest. They have simply written down who decides what, and they '
      +     'hold to it on the days it is inconvenient.</p>'
      +     '<p>That document is dull, it is three pages long, and it is '
      +     'worth more than the committee it replaces.</p>'
      +   '</div>'
      +   '<div class="catch-said" id="catchSaid">Saved — <b>obviate</b></div>'
      + '</div>';
    document.body.appendChild(o);

    demoCur = document.createElement("div");
    demoCur.className = "fc-cur";
    document.body.appendChild(demoCur);
    return o;
  }

  function demoMove(el, dy) {
    if (!demoCur || !el) return;
    var r = el.getBoundingClientRect();
    demoCur.style.left = (r.left + r.width / 2) + "px";
    demoCur.style.top  = (r.top + r.height / 2 + (dy || 0)) + "px";
  }

  /* Move, press, click -- in that order, so the reader sees the cause
     before the effect. The element is looked up at the moment of the tap
     rather than held: half of these screens are redrawn by the tap before
     it. */
  function demoTap(t, find, after) {
    demoAt(t, function () { demoMove(find()); });
    demoAt(t + 820, function () {
      var el = find();
      if (demoCur) demoCur.classList.add("is-press");
      if (el) el.click();
      if (after) after();
    });
    demoAt(t + 1010, function () {
      if (demoCur) demoCur.classList.remove("is-press");
    });
  }

  /* The handover: the page gives way, and the word it was on is in the app. */
  function demoCaught() {
    var o = $("catch"), i, w = demoWord(DEMO_CATCH);
    if (o) {
      o.classList.add("is-gone");
      demoAt(700, function () { if (o.parentNode) o.parentNode.removeChild(o); });
    }
    db.words.push(w);
    counts(); fillFilter(); renderSpaces();
    startSession();
    /* It leads the sitting: it is the word the reader just watched arrive,
       and the next beat is about to study it. */
    for (i = 0; i < session.length; i++) {
      if (session[i].id === w.id) { session.splice(i, 1); break; }
    }
    session.unshift(w);
    renderDue();
  }

  /* Which German word the demo opens on. Left to the schedule it was
     "erheblich" -- an adjective, and so a card with no article on it, which
     is the one thing this beat exists to show. */
  var DEMO_DE_LEAD = "Zusammenhang";

  function demoFirst(id) {
    for (var i = 0; i < session.length; i++) {
      if (session[i].id === id) {
        if (i) session.unshift(session.splice(i, 1)[0]);
        return;
      }
    }
  }

  function demoSpace(code) {
    return document.querySelector('.space[data-space="' + code + '"]');
  }
  function demoTab(k) {
    return document.querySelector('.tab[data-tab="' + k + '"]');
  }

  function demoPlay() {
    if (demoRunning) return;
    demoRunning = true;
    var word = $("catchWord"), mark = $("catchMark"), said = $("catchSaid");

    if (demoCur) demoCur.classList.add("is-on");
    demoMove(word, 60);                       /* arrives from below the line */

    /* 1 -- the sentence, and the word in it */
    demoAt(600,  function () { demoMove(word); });
    demoAt(1500, function () { if (word) word.classList.add("is-sel"); });

    /* 2 -- the bookmarklet on the bar */
    demoTap(2300, function () { return mark; }, function () {
      if (mark) mark.classList.add("is-hit");
      if (said) said.classList.add("is-on");
    });
    demoAt(3700, function () { if (mark) mark.classList.remove("is-hit"); });

    /* 3 -- the card, and the meaning on the back of it */
    demoAt(4700, demoCaught);
    demoTap(6000, function () { return $("face"); });

    /* 4 -- the answer. Almost: she nearly had it. */
    demoTap(10400, function () { return $("gMid"); });

    /* 5 -- the other space. A German noun is filed with its article, which
       is the reason the languages are kept apart at all. */
    demoTap(12600, function () { return demoSpace("de"); }, function () {
      /* setSpace leaves the Start screen up; the demo has no patience for a
         screen whose only content is a button it is about to press. */
      demoAt(60, function () {
        startSession();
        demoFirst(idOf(DEMO_DE_LEAD));
        renderDue();
      });
    });
    demoTap(16800, function () { return demoSpace("en"); });

    /* 6 -- the week */
    demoTap(18600, function () { return demoTab("stats"); });
    demoAt(20600, function () { if (demoCur) demoCur.classList.remove("is-on"); });
  }

  function demoReset() {
    demoStop();
    demoRunning = false;
    var o = $("catch");
    if (o && o.parentNode) o.parentNode.removeChild(o);
    if (demoCur && demoCur.parentNode) demoCur.parentNode.removeChild(demoCur);
    demoCur = null;
    SPACE = "en";
    onlyDeck = "";
    session = []; done = 0; flipped = false; misses = {}; almost = {};
    db = demoData();
    demoBuild();
    renderSpaces(); counts(); fillFilter();
    if (demoTab("due")) demoTab("due").click();
  }

  /* Still, for anyone who has asked not to be moved: the word is already
     caught and the week is already on screen, which is what the moving
     version spends twenty seconds arriving at. */
  function demoStill() {
    var w = demoWord(DEMO_CATCH), o = $("catch");
    if (o && o.parentNode) o.parentNode.removeChild(o);
    if (demoCur && demoCur.parentNode) demoCur.parentNode.removeChild(demoCur);
    db.words.push(w);
    counts(); fillFilter(); renderSpaces();
    if (demoTab("stats")) demoTab("stats").click();
  }

  function demoStage() {
    demoBuild();
    if (window.matchMedia
        && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      demoStill();
      return;
    }
    /* The parent drives it: it knows whether its panel is open and whether
       the reader has got down to it. Embedded and told nothing, the frame
       measures its own place in the page rather than guessing on a timer --
       a blind timer plays the demo to an empty room. */
    var driven = false, watch = 0;
    function onScreenInParent() {
      try {
        var el = window.frameElement;
        if (!el) return true;
        var r = el.getBoundingClientRect();
        var vh = window.parent.innerHeight
               || window.parent.document.documentElement.clientHeight;
        if (!vh) return true;
        return r.height > 0 && r.top < vh * 0.92 && r.bottom > vh * 0.08;
      } catch (e) { return true; }     /* cross-origin one day: trust the cue */
    }
    if (window.parent !== window) {
      window.addEventListener("message", function (e) {
        if (!e || typeof e.data !== "string") return;
        if (e.data === "fc:rail") { driven = true; if (watch) clearInterval(watch); }
        else if (e.data === "fc:play") { driven = true; demoPlay(); }
        else if (e.data === "fc:reset") { demoReset(); }
      });
      /* Say so rather than wait to be found: the parent often decides the
         frame is visible before this script exists, and its one cue lands
         on nothing. */
      try { window.parent.postMessage("fc:ready", "*"); } catch (e) {}
      watch = setInterval(function () {
        if (demoRunning || driven) { clearInterval(watch); return; }
        if (onScreenInParent()) { clearInterval(watch); demoPlay(); }
      }, 400);
      demoAt(90000, function () { if (watch) clearInterval(watch); demoPlay(); });
    } else {
      demoAt(500, demoPlay);
    }
  }

  /* ------------------------------------------------------------------
     Boot
     ------------------------------------------------------------------ */
  /* The embed takes the site's theme, not this app's. It is same-origin
     with the page holding it, so it can simply read the token the rest of
     simaydemiral.com stores -- otherwise a reader who turned the site to
     light gets a dark rectangle sitting in the middle of a light page. */
  try {
    var saved = localStorage.getItem(DEMO ? "sd-theme" : "vocab.theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) {}

  load();
  /* Before the first count, so a round left half-finished this morning is
     what the Study badge reports rather than the day's untouched total. */
  if (!DEMO) resumeLast();
  counts();
  fillFilter();
  /* One way in: the Start screen, which says how many are waiting and how
     many this sitting will hold. Starting automatically here meant a reload
     dropped you straight onto a card while adding a word showed Start —
     the same situation with two different screens. The demo still opens on
     a card, because that is what the homepage is showing off. */
  renderSpaces();
  if (DEMO) demoStage(); else renderDue();

  /* Offline. Registered last and failing silently: a browser without service
     workers, or one that refuses, simply has a page that needs the network. */
  if (!DEMO && "serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/flashcards/sw.js", { scope: "/flashcards/" })
        .catch(function () {});
    });
  }

  /* Last, and without blocking anything above it: the page is fully usable
     before this answers, and stays usable if it never does. */
  if (!DEMO) {
    fetch("/auth/me", { headers: { accept: "application/json" } })
      .then(function (r) { return r.json(); })
      .then(function (who) {
        me = who;
        renderAccount();
        if (me.signedIn) syncNow();
      })
      .catch(function () { me = { signedIn: false }; renderAccount(); });
  }
})();
</script>
