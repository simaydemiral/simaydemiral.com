    for (i = 0; i < ENDINGS.length; i++) {
      var cut = ENDINGS[i][0], add = ENDINGS[i][1];
      if (t.length <= cut.length + 2) continue;
      if (t.slice(-cut.length) !== cut) continue;
      var r = t.slice(0, t.length - cut.length) + add;
      /* "running" loses one of its doubled letters: runn -> run. */
      var dbl = /([bdfglmnprt])\1$/.test(r) ? r.slice(0, -1) : "";
      [r, dbl].forEach(function (x) {
        if (x && x.length > 2 && x !== t && !seen[x]) { seen[x] = 1; out.push(x); }
      });
      if (out.length >= 4) break;
    }
    return out;
  }

  /* Asked one at a time, stopping at the first that answers: four parallel
     requests for a word that will be found on the first try is three
     requests of nobody's business. */
  function viaRoot(term, list, i) {
    list = list || roots(term);
    i = i || 0;
    if (i >= list.length) return Promise.resolve(null);
    var r = list[i];
    return viaWiktionary(r).then(function (res) {
      if (res && res.senses && res.senses.length) {
        return { root: r, senses: res.senses };
      }
      return viaRoot(term, list, i + 1);
    }).catch(function () { return viaRoot(term, list, i + 1); });
  }

  /* Last resort for jargon and proper nouns no dictionary carries: an
     encyclopaedia does. "Evals" is not a dictionary word; "RAG" is not
     either, but both have an article. */
  function viaWikipedia(term) {
    var slug = encodeURIComponent(String(term).trim().replace(/\s+/g, "_"));
    return getJSON(WIKI + slug).then(function (d) {
      if (!d || !d.extract || d.type === "disambiguation") return [];
      return [{ pos: "Wikipedia", text: firstSentence(d.extract), example: "" }];
    }).catch(function () { return []; });
  }

  /* Returns a promise for the senses; never rejects — a word nobody
     knows is kept as it is rather than guessed at. */
  function lookup(term) {
    /* Where the pointer chain ended up: "Evals" resolves to "evaluation", and
       the second dictionary should be asked about that, not the original. */
    var resolved = term.trim();
    var want = "";
    return viaWiktionary(term.trim())
      .then(function (r) {
        if (r.trail && r.trail.length) resolved = r.trail[r.trail.length - 1];
        want = r.want || "";
        if (r.senses.length) {
          if (r.trail.length > 1) r.senses.via = r.trail.join(" \u2192 ");
          r.senses.want = want;
          return r.senses;
        }
        /* Built out of a word the dictionary does have. Asked before the
           encyclopaedia, because "allegedly" wants alleged, not an article. */
        return viaRoot(term.trim()).then(function (rt) {
          if (rt) {
            resolved = rt.root;
            rt.senses.root = rt.root;
            return rt.senses;
          }
          return viaWikipedia(term).then(function (w) {
            if (w.length) return w;
            /* one more: the singular, for plurals no dictionary lists */
            var sing = term.trim().replace(/ies$/i, "y").replace(/(ses|xes|zes|ches|shes)$/i, "")
                           .replace(/s$/i, "");
            if (sing && sing.toLowerCase() !== term.trim().toLowerCase() && sing.length > 2) {
              return viaWikipedia(sing);
            }
            return [];
          });
        });
      })
      .then(function (senses) {
        var needsExample = !senses.length || !senses.some(function (s) { return s.example; });
        if (!needsExample) return senses;
        if (senses.length && senses[0].pos === "Wikipedia") return senses;
        /* An English dictionary, so only an English card may borrow from it.
           The Spanish entry for "casa" carries no example, and reaching here
           lent it the English slang one: "Get out of my casa!". */
        if (SPACE !== "en") return senses;
        /* one word only: the second source does not do phrases */
        if (/\s/.test(term.trim())) return senses;
        return getJSON(DICT + encodeURIComponent(resolved))
          .then(fromDictionaryApi)
          .then(function (more) {
            if (!senses.length) return more;
            /* keep Wiktionary's wording, borrow an example */
            var eg = "";
            for (var i = 0; i < more.length; i++) { if (more[i].example) { eg = more[i].example; break; } }
            if (eg) senses[0].example = senses[0].example || eg;
            return senses;
          })
          .catch(function () { return senses; });
      });
  }

  var looking = {};
  /* Every card already looked up was looked up by the old reader, which
     filled its three senses from one part of speech. Bumping this looks each
     one up again, once, so a card saved as "vetted" stops leading with the
     veterinarian. relemma() is idempotent, so a second pass over a card it
     already renamed changes nothing. */
  var LOOK_SOURCES = 2;

  /* Three goes before "nobody knows this word" is believed. One failed
     request used to settle it forever: a rate limit or a dropped connection
     while adding a batch of words left "allegedly" -- which Wiktionary
     plainly has -- marked as unknown with no way back. */
  var LOOK_TRIES = 3;

  /* A card whose every sense is a pointer and nothing else -- "the present
     participle of plague", with the headword still reading "plaguing" -- was
     read by a build that could not follow it, and nothing since has made it
     ask again. Bumping LOOK_SOURCES would have every word in the list ask,
     which is a lot of requests to repair a handful of cards; this asks only
     the ones that are visibly stuck. Once each, because a pointer whose
     target has no entry of its own would otherwise ask on every redraw. */
  var STUCK_FIX = 1;

  function stuckOnPointer(w) {
    if (!w.looked) return false;
    var shown = shownSenses(w), i;
    if (!shown.length) return false;
    for (i = 0; i < shown.length; i++) {
      if (!formOnly(shown[i]) && !pointsTo(shown[i])) return false;
    }
    return true;
  }

  function needsLook(w) {
    if (!w.looked) return true;
    if ((w.lv || 0) < LOOK_SOURCES) return true;
    if ((w.pv || 0) < STUCK_FIX && stuckOnPointer(w)) return true;
    return !(w.senses && w.senses.length) && (w.miss || 0) < LOOK_TRIES;
  }

  function ensureLooked(w, after) {
    if (!needsLook(w) || looking[w.id]) { if (after) after(); return; }
    /* A card being re-read also had its plain-English senses fetched by the
       old reader, in the old order. They are the ones the card actually
       shows, so they go with it. */
    var again = w.looked;
    looking[w.id] = 1;
    lookup(w.term).then(function (senses) {
      delete looking[w.id];
      w.senses = senses;
      /* a custom property on an array does not survive JSON, so the trail
         lives on the word */
      w.via = senses.via || "";
      /* "vetted" is a past tense, so the verb is the sense she met. Kept on
         the word, because the plain-English senses are fetched separately
         and have to be put in the same order. */
      w.want = senses.want || "";
      /* Which word the meaning actually came from, when it came from a
         shorter one. Not a rename: she saved "allegedly" and that is the
         word she wants to see. */
      w.root = senses.root || "";
      if (senses.length) w.miss = 0;
      else w.miss = (w.miss || 0) + 1;
      if (again) w.plain = null;
      w.looked = true;
      w.lv = LOOK_SOURCES;
      w.pv = STUCK_FIX;
      var renamed = relemma(w);
      /* Folding takes a card away, so it waits until none is on screen. */
      var folded = (renamed && !session.length) ? foldDuplicates() : false;
      save();
      if (after) after();
      if (renamed || folded) { counts(); renderAll(); renderDecks(); }
    });
  }

  /* ------------------------------------------------------------------
     Spacing. Leitner boxes: knew it moves up, missed it goes back to
     the start. Deliberately not SM-2 — five intervals is enough for a
     few hundred words and can be explained in one line.
     ------------------------------------------------------------------ */
  /* How long until a word comes back, by what you said about it.

     "Not yet" is 0 — still due today. That is what makes a second sitting on
     the same day worth starting: the words you could not produce are waiting
     in it, and they keep waiting until you answer one of the other two. The
     ladder that used to stretch 1/3/7/16/35 is gone; the answer decides the
     gap, not how many times the word has survived. */
  var GAP = { no: 0, mid: 2, yes: 16 };

  var BOXES = 6;

  /* Box 1 is "new or just missed". Boxes 2..6 carry the five intervals, so
     the first word you know comes back in a day and the ladder is actually
     1, 3, 7, 16, 35 rather than starting at 3.

       "no"   you did not have it        -> back to the start, tomorrow
       "mid"  you had it, but barely     -> holds the gap it already earned
       "yes"  you had it                 -> the next gap up

     Holding rather than demoting on "mid": the answer was right, and taking
     away a gap you had already earned punishes honesty about being shaky. */
  function grade(w, how) {
    var box = w.box || 1;
    /* The box no longer sets the gap — it is kept as a record of how well
       she knows the word, which the list sorts and shows. */
    if (how === "yes")      w.box = Math.min(BOXES, box + 1);
    else if (how === "mid") w.box = Math.max(2, box);
    else                    w.box = 1;
    w.due = plus(GAP[how] === undefined ? 0 : GAP[how]);
    w.seen = (w.seen || 0) + 1;
    save();
  }

  /* ------------------------------------------------------------------
     Four languages, four spaces.

     One stored list underneath, because sync, export and import should carry
     everything a person has. What makes them feel separate is that every
     screen reads `here()` rather than db.words: the study queue, the decks,
     the counts and the list all stop at the edge of the language you are in.
     A word saved before any of this has no language and is English, which is
     what it was.
     ------------------------------------------------------------------ */
  /* wikt  — how the English Wiktionary heads this language's section.
     trw   — how the Turkish Wiktionary heads it, in Turkish. Without this
             the Turkish lookup read the English heading on every page, so
             the other three spaces never found anything there at all. */
  var LANGS = [
    { code: "en", label: "English",  wikt: "English", voice: "en-US",
      trw: "\u0130ngilizce" },
    { code: "es", label: "Espa\u00f1ol", wikt: "Spanish", voice: "es-ES",
      trw: "\u0130spanyolca" },
    { code: "de", label: "Deutsch",  wikt: "German",  voice: "de-DE",
      trw: "Almanca" },
    { code: "fr", label: "Fran\u00e7ais", wikt: "French", voice: "fr-FR",
      trw: "Frans\u0131zca" }
  ];

  var SPACE = "en";
  try {
    var savedSpace = localStorage.getItem("vocab.space");
    for (var li = 0; li < LANGS.length; li++) {
      if (LANGS[li].code === savedSpace) SPACE = savedSpace;
    }
  } catch (e) {}

  /* ------------------------------------------------------------------
     German articles.

     A German noun without its article is a noun learned wrong: the gender
     decides the endings on everything around it, and it is not guessable
     from the word. So the card says "das Haus", not "Haus". The term itself
     is still stored as "Haus" -- it is what the dictionary is asked about,
     what the id is made from, and what she typed.

     Wiktionary writes the gender as the first letter of the head template's
     first argument: {{de-noun|n,,^er}}, {{de-noun|f}}, {{de-noun|n.sg}}.
     ------------------------------------------------------------------ */
  /* German and Spanish take the definite article: der/die/das and el/la
     never contract, so the article always shows the gender. French takes
     the indefinite one, because le and la both elide to l' in front of a
     vowel -- "l'\u00e9cole" hides the very thing the article is there to show,
     while "une \u00e9cole" always says it. This is also how French textbooks
     write their word lists. */
  var ARTICLE = {
    de: { m: "der", f: "die", n: "das" },
    es: { m: "el",  f: "la" },
    fr: { m: "un",  f: "une" }
  };
  var GENDERED = { de: 1, es: 1, fr: 1 };

  /* A feminine Spanish noun beginning with a stressed a- takes "el" in the
     singular: el agua, el arma, el hambre. The noun is still feminine --
     "el agua fr\u00eda" -- which is why the card says "el agua" rather than the
     wrong "la agua" and the gender it was looked up under is unchanged.

     Written as a list rather than a rule on purpose. The rule turns on where
     the stress falls, which is not in anything the card has: deciding it
     would mean syllabifying Spanish in the browser and getting diphthongs
     right, to serve a set of words small enough to write down. These are the
     ones anybody meets; a feminine a- word outside the list gets "la", which
     is right for almost all of them. */
  var EL_FEM = {
    agua: 1, "\u00e1guila": 1, ala: 1, alma: 1, ama: 1, ancla: 1, arca: 1,
    area: 1, "\u00e1rea": 1, arma: 1, arpa: 1, asa: 1, asma: 1, aula: 1,
    ave: 1, haba: 1, habla: 1, hacha: 1, hada: 1, hambre: 1
  };

  function genderFrom(wikitext, code) {
    if (!GENDERED[code]) return "";
    var sec = section(wikitext, lang(code).wikt);
    if (!sec) return "";
    var m = new RegExp("\\{\\{" + code + "-noun\\|\\s*([mfn])\\b").exec(sec);
    return m ? m[1] : "";
  }

  /* The word as it should be read and remembered, which for a German noun
     includes the article and for everything else is just the word. */
  function headword(w) {
    var set = w.gen ? ARTICLE[w.lang] : null;
    var a = set ? set[w.gen] : "";
    if (a === "la" && EL_FEM[String(w.term).toLowerCase()]) a = "el";
    return a ? a + " " + w.term : w.term;
  }

  function lang(code) {
    for (var i = 0; i < LANGS.length; i++) {
      if (LANGS[i].code === (code || SPACE)) return LANGS[i];
    }
    return LANGS[0];
  }

  /* The words of the language you are currently in. */
  function here() {
    return db.words.filter(function (w) { return (w.lang || "en") === SPACE; });
  }

  function setSpace(code) {
    if (code === SPACE) return;
    SPACE = code;
    onlyDeck = "";                 /* a deck belongs to one language */
    try { localStorage.setItem("vocab.space", code); } catch (e) {}
    /* A sitting belongs to the language it started in. */
    session = []; done = 0; misses = {}; almost = {};
    flipped = false; noteOpen = false; trOpen = false;
    saveSession();
    renderSpaces(); counts(); fillFilter();
    renderAll(); renderDecks(); renderDue();
  }

  /* A sitting can be narrowed to one deck. Kept outside the session so the
     next round stays in the same deck, and cleared when she leaves it or
     switches language -- a deck belongs to one space. */
  var onlyDeck = "";

  function inDeck(w) { return !onlyDeck || (w.deck || "Inbox") === onlyDeck; }

  function dueNow() {
    var t = today();
    return here().filter(function (w) { return inDeck(w) && (w.due || t) <= t; });
  }

  /* ------------------------------------------------------------------
     How far through a deck she is.

     Three bands rather than one percentage, because "30% done" hides whether
     the other 70% is untouched or nearly there. Box 5 and 6 are words she
     has answered "Knew it" four times or more without a miss in between,
     which is the point at which the gap between sittings is long enough to
     call the word learned. Box 1 is new, or just missed. Everything between
     is in motion.
     ------------------------------------------------------------------ */
  var MASTER = 5;

  function bands(list) {
    var b = { n: list.length, top: 0, mid: 0, raw: 0 }, i, k;
    for (i = 0; i < list.length; i++) {
      k = list[i].box || 1;
      if (k >= MASTER) b.top++;
      else if (k >= 2) b.mid++;
      else b.raw++;
    }
    return b;
  }

  function inDeckNamed(name) {
    return here().filter(function (w) { return (w.deck || "Inbox") === name; });
  }

  /* The bar is the shape of the deck; the line above it is the answer to the
     question. Two filled segments and the track showing through for what has
     not been started, so three bands need only two spans. */
  function barHtml(b, label) {
    if (!b.n) return "";
    /* The amber band has to be named. "0 of 6 mastered" over a bar with
       amber in it reads as the bar being wrong -- the words in it are ones
       she has answered right once or twice, which is not nothing and is not
       mastery either. */
    var num = b.top + " of " + b.n + " mastered"
            + (b.mid ? " \u00b7 " + b.mid + " learning" : "");
    var full = b.top + " mastered \u00b7 " + b.mid + " learning \u00b7 "
             + b.raw + " new or missed";
    /* One word out of forty-nine is half a pixel, which looks like a
       rendering fault rather than a count. A band that has anything in it is
       wide enough to see. */
    function w(x) {
      return x ? "max(3px, " + (x * 100 / b.n).toFixed(1) + "%)" : "0";
    }
    return '<div class="prog" title="' + esc(full) + '">'
         + '<div class="prog-num">'
         + (label ? esc(label) + ' \u00b7 ' : '') + esc(num) + '</div>'
         + '<div class="prog-bar" role="img" aria-label="' + esc(full) + '">'
         + '<span class="p-top" style="width:' + w(b.top) + '"></span>'
         + '<span class="p-mid" style="width:' + w(b.mid) + '"></span>'
         + '</div></div>';
  }

  /* The deck still exists, and still has something in it. Deleting a deck
     mid-sitting, or emptying it, must not leave the Study tab filtering on a
     name nothing answers to. */
  function checkDeck() {
    if (!onlyDeck) return;
    var live = false;
    here().forEach(function (w) { if ((w.deck || "Inbox") === onlyDeck) live = true; });
    if (!live && !deckRec(onlyDeck, SPACE)) onlyDeck = "";
  }

  /* ------------------------------------------------------------------
     Decks.

     A deck used to be nothing but a label written on each word: the list was
     assembled by walking every word and collecting what it found. So a deck
     whose last word moved out did not become empty, it ceased to exist --
     and an empty deck could not be made at all, because there was nothing to
     write the name on. Meanwhile "Inbox" was offered as the place a new word
     goes while appearing nowhere in the list, which is a deck that does not
     exist being the default.

     Decks are stored now. The list below is still a union with whatever the
     words actually say, so a deck named only by an imported word is never
     lost, and Inbox is always there because it is where everything starts.
     ------------------------------------------------------------------ */
  function deckList() { return Array.isArray(db.decks) ? db.decks : (db.decks = []); }

  function deckRec(name, code) {
    var l = deckList(), i;
    for (i = 0; i < l.length; i++)
      if (l[i].name === name && l[i].lang === code) return l[i];
    return null;
  }

  /* Stamped, because a deck travels to the other device the same way a word
     does and the newer of the two has to win. */
  function putDeck(name, code, deleted) {
    /* Inbox is never a stored record: it exists because decks() always puts
       it there, so storing it would make it possible to delete the one place
       a word can always go. */
    if (name === "Inbox") return null;
    var r = deckRec(name, code);
    if (!r) { r = { name: name, lang: code }; deckList().push(r); }
    r.deleted = !!deleted;
    r.updated = Date.now();
    return r;
  }

  function decks() {
    var seen = {}, out = [];
    here().forEach(function (w) {
      var d = w.deck || "Inbox";
      if (!(d in seen)) { seen[d] = 0; out.push(d); }
      seen[d]++;
    });
    deckList().forEach(function (d) {
      if (!d || d.deleted || d.lang !== SPACE) return;
      if (!(d.name in seen)) { seen[d.name] = 0; out.push(d.name); }
    });
    if (!("Inbox" in seen)) { seen.Inbox = 0; out.push("Inbox"); }
    /* Inbox first wherever decks are listed: it is not alphabetically
       special, it is where every word lands before she files it. */
    out.sort(function (a, b) {
      if (a === "Inbox") return -1;
      if (b === "Inbox") return 1;
      return a < b ? -1 : a > b ? 1 : 0;
    });
    return out.map(function (d) { return { name: d, n: seen[d] }; });
  }

  /* ------------------------------------------------------------------
     Study
     ------------------------------------------------------------------ */
  var session = [], flipped = false, done = 0, total = 0;
  /* Each answer rebuilds the card, which throws away whatever was
     focused. Keep the keyboard where she left it. */
  var keyboarding = false;
  /* How many times a card has come round this sitting. Kept beside the words
     rather than on them, so it never reaches storage or an export. */
  var misses = {};
  var almost = {};   /* answered "Almost" this sitting; each gets one encore */
  var renaming = null;   /* the deck whose name is being edited, if any */
  var CAP = 30;
  /* Whether the note editor is open — on the card, and on a row of the list.
     A word neither dictionary knows was always kept and marked, but until now
     there was nowhere to write what it actually means. */
  var noteOpen = false;
  var editingNote = null;
  var trOpen = false;        /* is the Turkish showing on this card? */
  var trFailed = false;      /* the last lookup could not reach its sources */
  var fullOpen = false;      /* the precise senses instead of the plain ones */

  /* ------------------------------------------------------------------
     A sitting survives a reload.

     Thirty cards is twenty minutes, and a phone that locks, a tab closed by
     accident, or a reload after adding a word threw the whole round away and
     started it again at the first card. So the queue is written down after
     every answer. In this browser only: not in the word list, so it is not
     something that syncs to the other device or turns up in an export -- a
     half-finished round is a fact about this sitting, not about the words.

     Good for the day it was started and no longer. Tomorrow is a different
     set of words and should begin at the Start screen.
     ------------------------------------------------------------------ */
  var SKEY = "vocab.session";

  function saveSession() {
    if (DEMO) return;
    try {
      if (!session.length) { localStorage.removeItem(SKEY); return; }
      localStorage.setItem(SKEY, JSON.stringify({
        day: today(), lang: SPACE, deck: onlyDeck, done: done, total: total,
        ids: session.map(function (w) { return w.id; }),
        misses: misses, almost: almost
      }));
    } catch (e) {}
  }

  /* Only the ids are stored, so every card comes back from the live list and
     a word edited, renamed or deleted in between is whatever it is now
     rather than a stale copy of what it was. */
  function resumeSession() {
    if (DEMO) return false;
    var s = null;
    try { s = JSON.parse(localStorage.getItem(SKEY) || "null"); } catch (e) { return false; }
    if (!s || s.day !== today() || !Array.isArray(s.ids)) return false;
    if ((s.lang || "en") !== SPACE) return false;
    var by = {}, q = [], i, w;
    for (i = 0; i < db.words.length; i++) by[db.words[i].id] = db.words[i];
    for (i = 0; i < s.ids.length; i++) {
      w = by[s.ids[i]];
      if (w && (w.lang || "en") === SPACE && q.indexOf(w) < 0) q.push(w);
    }
    if (!q.length) { try { localStorage.removeItem(SKEY); } catch (e) {} return false; }
    onlyDeck = typeof s.deck === "string" ? s.deck : "";
    session = q;
    done = Math.max(0, Number(s.done) || 0);
    total = Math.max(q.length, Number(s.total) || q.length);
    misses = (s.misses && typeof s.misses === "object") ? s.misses : {};
    almost = (s.almost && typeof s.almost === "object") ? s.almost : {};
    /* Face up, whatever she was looking at when the tab went away: the
       answer she had not given yet is the one being resumed, and showing
       the meaning first would give it to her. */
    flipped = false;
    checkDeck();
    return true;
  }

  function startSession() {
    /* A word renamed to its lemma may now ask the same question as one
       already here, and this is the one moment with no card on screen. */
    if (foldDuplicates()) save();
    session = dueNow().slice(0, CAP);
    total = session.length;
    done = 0;
    flipped = false;
    misses = {};
    almost = {};
    saveSession();
    counts();      /* the badge mirrors the sitting, so it changes on Start */
    renderDue();
  }

  /* The one line that says a sitting is narrowed, with the way out of it.
     Without this a deck with nothing due reads as a language with nothing
     due, and there is no clue the filter is on. */
  function deckBanner() {
    if (!onlyDeck) return "";
    return '<p class="deckonly">Studying <b>' + esc(onlyDeck) + '</b> only'
         + ' <button class="btn-q" id="allDecks">Study everything</button></p>';
  }

  function renderDue() {
    var el = $("p-due");
    checkDeck();

    if (!here().length) {
      el.innerHTML = '<div class="card"><p class="empty"><b>No '
        + (SPACE === "en" ? "" : esc(lang().label) + " ") + 'words yet</b>'
        + 'Add one from the <b style="display:inline">Add</b> tab, or install the '
        + 'bookmarklet and save a word straight from whatever you are reading.</p></div>';
      return;
    }
    if (!session.length) {
      var nd = dueNow().length;
      /* Having just finished a round is a different situation from arriving
         at the page. The words left over are the ones answered "Not yet",
         which stay due today on purpose — so the offer is a second round,
         not a puzzle about why the count did not reach zero. */
      var justFinished = done > 0;
      var head, body, label;
      if (justFinished && nd) {
        head = "Round done";
        body = nd + ' word' + (nd === 1 ? ' is' : 's are') + ' still due \u2014 '
             + (nd === 1 ? 'the one' : 'the ones') + ' you answered '
             + '<b style="display:inline">Not yet</b>. They stay due until you '
             + 'get ' + (nd === 1 ? 'it' : 'them') + ', today or any day.';
        label = "Go again";
      } else if (justFinished) {
        head = "All done";
        body = done + ' word' + (done === 1 ? '' : 's') + ' this round, and '
             + 'nothing left due. ' + here().length + ' in total.';
        label = "";
      } else if (nd) {
        head = "Ready when you are";
        body = nd + ' word' + (nd === 1 ? '' : 's') + ' waiting'
             + (nd > CAP ? ' \u2014 ' + CAP + ' in this sitting.' : '.');
        label = "Start";
      } else if (onlyDeck) {
        var inD = here().filter(function (w) {
          return (w.deck || "Inbox") === onlyDeck;
        }).length;
        head = "Nothing due in " + esc(onlyDeck);
        body = inD
          ? 'All ' + inD + ' word' + (inD === 1 ? '' : 's') + ' in this deck '
            + (inD === 1 ? 'is' : 'are') + ' waiting on a later day.'
          : 'This deck is empty.';
        label = "";
      } else {
        head = "Nothing due today";
        body = 'You have studied everything that came up. '
             + here().length + ' word' + (here().length === 1 ? '' : 's') + ' in total.';
        label = "";
      }
      el.innerHTML = deckBanner()
        + '<div class="card"><p class="empty"><b>' + head + '</b>'
        + body + '</p>'
        /* Finishing a round is the moment she wants the number, so it is on
           this screen as well as over the card. */
        + '<div class="prog-wrap">'
        + barHtml(bands(onlyDeck ? inDeckNamed(onlyDeck) : here()),
                  onlyDeck || lang().label)
        + '</div>'
        + (label ? '<div style="text-align:center;padding-bottom:18px">'
                 + '<button class="btn" id="go">' + label + '</button></div>' : '')
        + '</div>';
      if ($("go")) $("go").addEventListener("click", startSession);
      return;
    }

    var w = session[0];
    /* "Not yet" puts the card back on the end of the queue rather than
       taking it away, so the ones she is getting wrong are the ones she
       keeps seeing. The count is done-and-left rather than "3 of 7",
       because a card coming round again makes that arithmetic a lie. */
    /* Scoped to whatever the sitting is scoped to, so it answers the same
       question the banner above it asks. */
    var html = deckBanner() + '<div class="study">'
      + barHtml(bands(onlyDeck ? inDeckNamed(onlyDeck) : here()),
                onlyDeck || lang().label)
      + '<div class="progress">' + done + ' done \u00b7 ' + session.length + ' left'
      + (misses[w.id] ? ' \u00b7 again' : almost[w.id] ? ' \u00b7 once more' : '')
      + '</div>';

    if (!flipped) {
      html += '<div class="face" id="face" tabindex="0" role="button" '
            + 'aria-label="Show the meaning">'
            + '<div class="termrow">'
            + '<div class="term">' + esc(headword(w)) + '</div>'
            + sayBtn(w)
            + '</div>'
            + seenAsLine(w)
            + '<div class="tap">Tap, or press space, to see the meaning</div></div>';
    } else {
      html += '<div class="face back" id="back" tabindex="0" role="button" '
            + 'aria-label="Turn the card back to the word">'
            + '<div class="termrow">'
            + '<div class="term">' + esc(headword(w)) + '</div>'
            + sayBtn(w)
            + '</div>'
            /* Both words, on the side she is reading the meaning from. The
               headword is what the dictionary files it under; this is the
               form she will actually meet again on a page. */
            + seenAsLine(w)
            + '<div class="pill" style="align-self:flex-start;margin-top:2px">'
            + esc(w.deck || "Inbox") + '</div>';
      if (!w.looked && !w.senses.length) {
        html += '<p class="def" style="margin-top:12px;color:var(--muted)">Looking it up&hellip;</p>';
      } else if (!w.senses.length) {
        html += '<p class="def" style="margin-top:12px;color:var(--warn)">'
              + 'No definition found yet. '
              + ((w.miss || 0) >= LOOK_TRIES
                  ? 'Asked ' + w.miss + ' times, so it is probably not in any '
                    + 'of them.'
                  : 'Tried ' + (w.miss || 1) + ' time'
                    + ((w.miss || 1) === 1 ? '' : 's') + ' so far.')
              + ' <button class="btn-q" id="lookAgain">Look again</button></p>';
      } else {
        /* One hop is already said by the line under the word. A longer chain
           is worth spelling out, because "Evals -> eval -> evaluation"
           explains a headword that otherwise looks unrelated to it. */
        if (w.via && w.via.split("\u2192").length > 2) {
          html += '<div class="via">' + esc(w.via) + '</div>';
        }
        /* Plain English when there is any, the precise senses when she asks
           for them or when Simple Wiktionary has never heard of the word. */
        var shown = shownSenses(w);
        for (var i = 0; i < shown.length; i++) {
          var s = shown[i];
          html += '<div class="sense">'
                + (s.pos ? '<div class="pos">' + esc(s.pos) + '</div>' : '')
                + '<p class="def">' + esc(s.text) + '</p>'
                + (s.example ? '<p class="eg">&ldquo;' + esc(s.example) + '&rdquo;</p>' : '')
                + '</div>';
        }
        /* Under the gloss, not instead of it: "in an acute manner" is still
           true, and the word it is about is what was missing. */
        if (w.rootdef && w.rootdef.senses && w.rootdef.senses.length) {
          html += '<div class="rootdef"><b>' + esc(w.rootdef.term)
                + (w.rootdef.senses[0].pos
                    ? ' <span>' + esc(w.rootdef.senses[0].pos) + '</span>' : '')
                + '</b>';
          for (i = 0; i < w.rootdef.senses.length; i++) {
            html += '<p>' + esc(w.rootdef.senses[i].text) + '</p>';
          }
          html += '</div>';
        } else if (w.plain !== null && needsRootLook(w)) {
          html += '<div class="rootdef"><p style="color:var(--muted)">'
                + 'Looking up <b style="display:inline">'
                + esc(needsRootLook(w).root) + '</b>\u2026</p></div>';
        }
      }
      if (trOpen) {
        html += '<div class="yournote tr"><b>T\u00fcrk\u00e7e</b>';
        /* The failure is checked first. A lookup that could not reach its
           sources writes nothing down, so there is no record to carry the
           news — asking "is there a record?" first left the card saying
           "looking it up" for ever. */
        if (trFailed && !(w.tr && w.tr.from)) {
          html += '<span class="notetext" style="color:var(--stop)">'
                + 'Could not reach Wiktionary or Wikipedia. Nothing is wrong '
                + 'with the word \u2014 press T\u00fcrk\u00e7e again to retry. If it keeps '
                + 'failing, an ad or privacy blocker is the usual cause: both '
                + 'requests go to <b style="display:inline">api.php</b> on '
                + 'wiktionary.org and wikipedia.org.</span>';
        } else if (!w.tr || (w.tr.v || 0) < TR_SOURCES) {
          html += '<span class="notetext" style="color:var(--muted)">'
                + 'Bak\u0131l\u0131yor\u2026</span>';
        } else if ((w.tr.blocks && w.tr.blocks.length) || (w.tr.more && w.tr.more.length)) {
          /* Every sense it has, each on its own line: a word that means three
             things should say all three rather than pick one. */
          var ti, tb;
          for (ti = 0; ti < (w.tr.blocks || []).length; ti++) {
            tb = w.tr.blocks[ti];
            html += '<div class="trline"><span class="trwords">'
                  + esc(tb.words.join(", ")) + '</span>'
                  + (tb.sense ? '<span class="trsense">' + esc(tb.sense) + '</span>' : '')
                  + '</div>';
          }
          for (ti = 0; ti < (w.tr.more || []).length; ti++) {
            html += '<div class="trline"><span class="trwords">'
                  + esc(w.tr.more[ti]) + '</span></div>';
          }
          html += '<div class="trfrom">' + esc(w.tr.from || "Wiktionary")
                /* Said plainly, because akut is the Turkish for acute and
                   not for acutely, and the card should not pretend it is. */
                + (w.tr.via ? ' \u00b7 the Turkish for <b style="display:inline">'
                              + esc(w.tr.via) + '</b>' : '')
                + '</div>';
        } else if (w.tr.one) {
          html += '<div class="trline"><span class="trwords">' + esc(w.tr.one) + '</span>'
                + '<span class="trsense">'
                + esc(w.tr.oneNote
                      || (w.tr.from === "Wikidata"
                            ? "the Turkish name for this, not a dictionary sense"
                            : "the Turkish article for the same thing"))
                + '</span></div>'
                + '<div class="trfrom">' + esc(w.tr.from || "Wikipedia") + '</div>';
        } else {
          html += '<span class="notetext" style="color:var(--warn)">'
                + 'Neither Wiktionary nor Wikipedia has a Turkish entry for this '
                + 'one. Nothing invented \u2014 write your own below.</span>';
        }
        html += '</div>';
      }

      if (noteOpen) {
        html += '<div class="yournote"><b>Your note</b>'
              + '<textarea id="noteBox" placeholder="What it means in your own '
              + 'words, a way to remember it, the Turkish for it\u2026">'
              + esc(w.note || "") + '</textarea>'
              + '<div class="noteacts">'
              + '<button class="btn-q" id="noteSave">Save</button>'
              + '<button class="btn-q" id="noteCancel">Cancel</button></div></div>';
      } else if (w.note) {
        html += '<div class="yournote"><b>Your note</b>'
              + '<span class="notetext">' + esc(w.note) + '</span>'
              + '<div class="noteacts"><button class="btn-q" id="noteBtn">Edit note</button>'
              + trButton(w) + fullButton(w) + '</div>'
              + '</div>';
      } else {
        html += '<div class="noteacts" style="margin-top:12px">'
              + '<button class="btn-q" id="noteBtn">Add a note</button>'
              + trButton(w) + fullButton(w) + '</div>';
      }
      /* Only when nothing above carried one, so a word never shows two. */
      if (!hasExample(w)) {
        if (w.eg && w.eg.text) {
          html += '<div class="egbox"><b>In a sentence</b>'
                + '<span class="egtext">\u201c' + esc(w.eg.text) + '\u201d</span>'
                + '<span class="egfrom">' + esc(w.eg.from || "Wiktionary") + '</span></div>';
        } else if (!w.eg) {
          html += '<div class="egbox"><span class="egtext" '
                + 'style="color:var(--muted)">Looking for an example\u2026</span></div>';
        }
      }

      if (w.src && w.src.sentence) {
        var link = safeUrl(w.src.url);
        html += '<div class="ctx"><b>Where you found it</b>'
              + esc(w.src.sentence)
              + (link ? '<br><a href="' + esc(link) + '" target="_blank" rel="noopener">'
                      + esc(w.src.title || link).slice(0, 70) + ' &rarr;</a>' : '')
              + '</div>';
      }
      html += '</div>'
            + '<div class="grade">'
            + '<button class="no" id="gNo">Not yet</button>'
            + '<button class="mid" id="gMid">Almost</button>'
            + '<button class="yes" id="gYes">Knew it</button>'
            + '</div>'
            + '<div class="keys">1 not yet \u00b7 2 almost \u00b7 3 knew it</div>';
    }
    html += '</div>';
    el.innerHTML = html;

    if (!flipped) {
      var f = $("face");
      f.addEventListener("click", function (e) {
        /* the speaker is on this face too now, and pressing it is not an
           answer — hearing a word is part of trying to remember it */
        if (e.target.closest && e.target.closest("button")) return;
        flip();
      });
      f.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          /* Stop here. The document handler reads `flipped` to decide what a
             key means, and by the time the event reached it this flip had
             already changed that answer — so the one press turned the card
             over and straight back again. */
          e.preventDefault(); e.stopPropagation();
          keyboarding = true; flip();
        }
      });
      if (keyboarding) f.focus();
      /* fetch while she is still looking at the front, so the back is
         ready by the time she turns it over */
      ensureLooked(w, function () { if (flipped) renderDue(); });
      /* and the recording, so the speaker on this face works straight away.
         Redrawn only once, when the answer lands: by then w.say is set, so
         the next pass does not ask again. */
      if (needsSay(w)) {
        ensureSay(w, function () {
          if (!flipped && session[0] === w) renderDue();
        });
      }
      /* Quietly, while she is still trying to remember it. */
      if (needsEg(w)) ensureExample(w);
    } else {
      $("gNo").addEventListener("click", function () { answer("no"); });
      $("gMid").addEventListener("click", function () { answer("mid"); });
      $("gYes").addEventListener("click", function () { answer("yes"); });

      /* Turning it back. Not from the note editor, a link, or any button —
         those are things she came to the back of the card to use. */
      $("back").addEventListener("click", function (e) {
        if (e.target.closest("button, a, textarea, select, input")) return;
        unflip();
      });
      $("back").addEventListener("keydown", function (e) {
        if (e.target !== this) return;
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault(); e.stopPropagation();
          keyboarding = true; unflip();
        }
      });

      /* Fetched when the back is shown, so a word saved long before this
         existed gets its recording the first time she turns it over. Guarded
         the way ensureLooked is: without the guard the callback fires at once
         for a word that already has one, redraws the back, and asks again —
         a redraw that never ends. */
      if (needsSay(w)) ensureSay(w, function () { if (flipped) renderDue(); });
      if (needsEg(w)) {
        ensureExample(w, function () { if (flipped) renderDue(); });
      }
      /* Only once the headword has settled, or it asks about "plunged". */
      if (w.looked && !w.plain) {
        ensurePlain(w, function () { if (flipped) renderDue(); });
      }
      /* And only once the plain senses have settled too, because whether the
         card is hollow depends on which list it ends up showing. */
      if (w.looked && w.plain) {
        ensureRoot(w, function () { if (flipped) renderDue(); });
      }
      if ($("fullBtn")) {
        $("fullBtn").addEventListener("click", function () {
          fullOpen = !fullOpen; renderDue();
        });
      }
      if ($("noteBtn")) {
        $("noteBtn").addEventListener("click", function () { noteOpen = true; renderDue(); });
      }
      if ($("trBtn")) {
        $("trBtn").addEventListener("click", function () {
          trOpen = !trOpen;
          if (trOpen) trFailed = false;   /* this press gets its own verdict */
          renderDue();
          /* Fetched on the press, not on every flip: most cards are turned
             over without ever wanting it. Cached afterwards, so the second
             press is instant. */
          if (trOpen && !(w.tr && w.tr.from && (w.tr.v || 0) >= TR_SOURCES)) {
            ensureTurkish(w, function () { if (flipped && trOpen) renderDue(); });
          }
        });
      }
      if ($("noteSave")) {
        $("noteSave").addEventListener("click", function () {
          w.note = $("noteBox").value.trim().slice(0, 2000);
          save(); noteOpen = false; renderDue(); renderAll();
          toast(w.note ? "Note saved." : "Note cleared.");
        });
        $("noteCancel").addEventListener("click", function () {
          noteOpen = false; renderDue();
        });
        $("noteBox").focus();
      }
      /* Do not pull focus out of the note she is typing. */
      if (keyboarding && !noteOpen) $("gYes").focus();
    }
  }

  function flip() {
    flipped = true;
    noteOpen = false;
    trOpen = false;
    fullOpen = false;
    renderDue();
  }

  function unflip() {
    flipped = false;
    noteOpen = false;
    trOpen = false;
    fullOpen = false;
    renderDue();
  }

  /* Studying without the mouse. Tabbing to the card meant passing Theme,
     Export, Clear all and four tabs first, and there was no way at all to
     grade from the keyboard. */
  document.addEventListener("keydown", function (e) {
    var t = e.target.tagName;
    /* Turning a card over with the keyboard parks focus on "Knew it", so
       that Enter answers. The guard below then swallowed 1, 2 and 3 --
       the three shortcuts the card advertises worked after a click of the
       mouse and did nothing after a press of the space bar. The grade row
       is exempt from it; Enter and space still belong to whichever button
       is focused, which is the whole point of putting focus there. */
    var onGrade = !!(e.target.closest && e.target.closest(".grade"));
    if (!onGrade && (t === "INPUT" || t === "TEXTAREA" || t === "SELECT" || t === "BUTTON")) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!session.length) return;

    if (!flipped) {
      /* the card's own handler covers it when the card itself has focus */
      if (e.target.id === "face") return;
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault(); keyboarding = true; flip();
      }
      return;
    }
    if (e.target.id === "back") return;     /* its own handler has it */
    if (onGrade && (e.key === "Enter" || e.key === " ")) return;
    if (e.key === " ") { e.preventDefault(); keyboarding = true; unflip(); return; }
    if (e.key === "1" || e.key === "ArrowLeft") {
      e.preventDefault(); keyboarding = true; answer("no");
    } else if (e.key === "2") {
      e.preventDefault(); keyboarding = true; answer("mid");
    } else if (e.key === "3" || e.key === "ArrowRight" || e.key === "Enter") {
      e.preventDefault(); keyboarding = true; answer("yes");
    }
  });

  /* The speaker, and the IPA beside it when the dictionary gave one. Its own
     button rather than a click on the word, because the word itself now turns
     the card back over. */
  /* Wiktionary keeps its Turkish translation tables on English entries. A
     Spanish or German word has no such row to read, and the English sense on
     the card is doing that job anyway. */
  /* Installing is a phone thing, and the steps are invisible on a laptop
     where there is nothing to tap. Shown anyway, because this is usually read
     on the laptop and done on the phone afterwards. */
  function installCard() {
    var standalone = false;
    try {
      standalone = window.matchMedia("(display-mode: standalone)").matches
                || window.navigator.standalone === true;
    } catch (e) {}

    if (standalone) {
      return '<div class="card" style="margin-top:14px">'
        + '<h2 style="margin:0 0 4px;font:500 19px/1.2 var(--f-display)">'
        + 'You are in the app</h2>'
        + '<p class="step" style="font-size:14px;color:var(--muted);margin:0">'
        + 'Running from your home screen, so this works with no signal. '
        + 'Catching new words still needs a browser \u2014 there is no address bar '
        + 'in here for the bookmarklet to run from.</p></div>';
    }

    return '<div class="card" style="margin-top:14px">'
      + '<h2 style="margin:0 0 4px;font:500 19px/1.2 var(--f-display)">'
      + 'Put it on your phone</h2>'
      + '<p class="step" style="font-size:14px;color:var(--muted);margin:0 0 10px">'
      + 'On a phone you can add FlashCards to the home screen. It gets its own icon, '
      + 'opens without an address bar, and works with no signal \u2014 which is the '
      + 'point of having it on a phone.</p>'
      + '<p class="step" style="margin:0 0 4px"><b style="display:inline">iPhone</b> '
      + '<span style="color:var(--muted)">\u2014 in Safari. Chrome on iOS cannot do '
      + 'this.</span></p>'
      + '<ol class="howto">'
      + '<li>Open <b style="display:inline">simaydemiral.com/flashcards</b> in Safari</li>'
      + '<li>Tap <b style="display:inline">Share</b> \u2014 the square with the arrow, '
      + 'in the bottom bar</li>'
      + '<li>Scroll down and tap <b style="display:inline">Add to Home Screen</b></li>'
      + '<li>Tap <b style="display:inline">Add</b></li>'
      + '</ol>'
      + '<p class="step" style="margin:10px 0 4px"><b style="display:inline">Android</b> '
      + '<span style="color:var(--muted)">\u2014 in Chrome: accept the install prompt, '
      + 'or Menu \u203a Add to Home screen.</span></p>'
      + '<p class="step" style="font-size:14px;color:var(--muted);margin:10px 0 0">'
      + 'Then <b style="display:inline;color:var(--ink)">sign in inside the app</b>. An '
      + 'installed app often gets its own storage, so it may open empty until your '
      + 'words sync down.</p>'
      + '</div>';
  }

  /* Offered on every card. The gate used to be English-only, which made the
     Turkish a feature of one space out of four -- and Turkish is the first
     language, so it is wanted most on the ones that are not English. */
  function trButton(w) {
    return '<button class="btn-q' + (trOpen ? ' is-on' : '') + '" id="trBtn">'
         + (trOpen ? 'Hide T\u00fcrk\u00e7e' : 'T\u00fcrk\u00e7e') + '</button>';
  }

  /* Only offered when there is a choice to make: no plain entry means the
     precise senses are already what is on the card. */
  function fullButton(w) {
    if (!(Array.isArray(w.plain) && w.plain.length)) return '';
    return '<button class="btn-q' + (fullOpen ? ' is-on' : '') + '" id="fullBtn">'
         + (fullOpen ? 'Plain English' : 'Full dictionary') + '</button>';
  }

  function sayBtn(w) {
    var ipa = w.say && w.say.ipa ? '<span class="ipa">' + esc(w.say.ipa) + '</span>' : '';
    return '<div class="say">'
         + '<button class="speak" data-say="' + esc(w.id) + '" '
         + 'aria-label="Hear ' + esc(w.term) + '" title="Hear it">'
         + '<span aria-hidden="true">\u25b6</span></button>' + ipa + '</div>';
  }

  function answer(how) {
    var w = session.shift();
    grade(w, how);
    if (how === "yes") {
      done++;
    } else if (how === "mid") {
      /* Once more before the sitting ends, rather than straight away: you
         had it, so drilling it immediately proves nothing. */
      if (!almost[w.id]) { almost[w.id] = 1; session.push(w); }
      else done++;
    } else {
      misses[w.id] = (misses[w.id] || 0) + 1;
      /* Three times round is enough. It is already scheduled for tomorrow,
         and a card that cannot be escaped is a trap rather than a drill.
         Put back a few cards ahead, not at the very end, so a word you could
         not produce comes round while you still remember being stuck. */
      if (misses[w.id] < 3) session.splice(Math.min(3, session.length), 0, w);
      else done++;
    }
    flipped = false;
    noteOpen = false;
    trOpen = false;
    fullOpen = false;
    saveSession();
    counts();
    renderDue();
  }

  /* ------------------------------------------------------------------
     All words
     ------------------------------------------------------------------ */
  function renderAll() {
    var deck = $("fDeck").value, sort = $("fSort").value;
    var rows = here().filter(function (w) { return !deck || (w.deck || "Inbox") === deck; });

    /* Newest first, and always as the tiebreak: a comparator that never
       returns 0 leaves equal rows in whatever order the engine happens to
       produce, which looks like a shuffle. localeCompare so that naive and
       naïve sit together rather than ï sorting after z. */
    function newest(a, b) {
      var x = a.added || "", y = b.added || "";
      return x < y ? 1 : x > y ? -1 : 0;
    }
    rows.sort(function (a, b) {
      var r = 0;
      if (sort === "term") r = a.term.localeCompare(b.term, undefined, { sensitivity: "base" });
      else if (sort === "due") {
        var p = a.due || "", q = b.due || "";
        r = p < q ? -1 : p > q ? 1 : 0;
      } else if (sort === "box") r = (a.box || 1) - (b.box || 1);
      return r || newest(a, b);
    });

    $("allNote").textContent = rows.length + (rows.length === 1 ? " word" : " words");

    if (!rows.length) {
      $("tbl").innerHTML = '<p class="empty">Nothing here yet.</p>';
      return;

    if (deckNames.indexOf("Inbox") < 0) deckNames.push("Inbox");

    var h = '<div class="tblwrap"><table><thead><tr><th>Word</th><th>Deck</th>'
          + '<th class="col-box">Box</th><th class="col-due">Due</th>'

    for (var i = 0; i < rows.length; i++) {

      h += '<tr>'
         + '<td><span class="w-term">' + esc(headword(w)) + '</span>'

         + (otherForms(w).length
             ? '<span class="w-form">' + esc(otherForms(w).join(", ")) + '</span>' : '')
         /* slice before escaping, or a 110th character lands mid-entity */
         + (first ? '<span class="w-def">' + esc(String(first).slice(0, 110)) + '</span>' : '')
         + (w.note ? '<span class="w-note">' + esc(String(w.note).slice(0, 110)) + '</span>' : '')
         + '</td>'
         + '<td>' + deckSelect(w, deckNames) + '</td>'
         + '<td class="box-n col-box">' + (w.box || 1) + '/6</td>'
         + '<td class="w-when col-due">' + esc(w.due || "") + '</td>'
         + '<td style="text-align:right;white-space:nowrap">'
         + '<button class="btn-q" data-note="' + esc(w.id) + '" title="Write a note">'
         + (w.note ? 'Note \u00b7' : 'Note') + '</button> '
         + '<button class="btn-q" data-del="' + esc(w.id)
         + '" title="Remove this word" aria-label="Remove this word">'
         + '<span class="lbl-full">Remove</span>'
         + '<span class="lbl-tiny" aria-hidden="true">\u2715</span></button></td>'
         + '</tr>';

      if (editingNote === w.id) {
        h += '<tr class="noterow"><td colspan="5">'
           + '<textarea id="rowNote" placeholder="What it means in your own '
           + 'words, a way to remember it, the Turkish for it\u2026">'
           + esc(w.note || "") + '</textarea>'

           + '<button class="btn-q" data-note-save="' + esc(w.id) + '">Save</button>'
           + '<button class="btn-q" data-note-cancel="1">Cancel</button></div></td></tr>';

    $("tbl").innerHTML = h + '</tbody></table></div>';
  }

  /* ------------------------------------------------------------------
     Add — by hand, by paste, and the bookmarklet
     ------------------------------------------------------------------ */
  /* The bookmarklet. Kept readable here and joined into one javascript: URL.

     Sentence boundaries are not just "a full stop": the decimal point in
     "$1.25 trillion" was being read as one, and the captured sentence began
     halfway through a number. A boundary is a stop followed by a space and
     not preceded by a digit or a lone capital. */
  var MARKLET = [
    "javascript:(function(){",
    "var s=window.getSelection(),t=(s?s.toString():'').trim();",
    "if(!t){alert('Select a word first, then click this.');return;}",
    "var sent='';try{",
    "var n=s.anchorNode,e=n&&(n.nodeType===1?n:n.parentElement);",
    "while(e&&e.textContent.length<40&&e.parentElement)e=e.parentElement;",
    "var x=(e?e.textContent:'').replace(/\\s+/g,' '),i=x.indexOf(t);",
    "var stop=function(k){var c=x.charAt(k);",
    "if(c!=='.'&&c!=='!'&&c!=='?')return false;",
    "if(!/\\s|$/.test(x.charAt(k+1)||' '))return false;",
    "var p=x.charAt(k-1);return !/[0-9]/.test(p)&&!/^[A-Z]$/.test(p);};",
    "if(i>-1){var a=0,k;",
    "for(k=i-1;k>0;k--){if(stop(k)){a=k+1;break;}}",
    "var b=x.length;",
    "for(k=i+t.length;k<x.length;k++){if(stop(k)){b=k+1;break;}}",
    "sent=x.slice(a,b).trim();}",
    "}catch(err){}",
    "window.open('", "ORIGIN", "/flashcards/add#w='+encodeURIComponent(t)",
    "+'&s='+encodeURIComponent(sent.slice(0,400))",
    "+'&u='+encodeURIComponent(location.href)",
    "+'&t='+encodeURIComponent(document.title),'vocab','width=430,height=250');",
    "})()"
  ].join("");

  function marklet() {
    return MARKLET.replace("ORIGIN", location.origin);
  }

  function renderAdd() {
    $("p-add").innerHTML =
      '<div class="card">'
      + '<h2 style="margin:0 0 4px;font:500 19px/1.2 var(--f-display)">Save a word from anywhere</h2>'
      + '<p class="step" style="font-size:14px;color:var(--muted)">'
      + 'Drag this to your bookmarks bar. Then on any page: select a word and click it. '
      + 'Works in Chrome and Safari.</p>'
      + '<p style="margin:12px 0 4px"><a class="mark" id="mark" href="#">+ Save to FlashCards</a></p>'
      + '<p class="step" style="font-size:13px;color:var(--faint);margin-top:10px">'
      + 'Safari hides the bookmarks bar by default &mdash; View › Show Favourites Bar.</p>'
      + '</div>'

      + '<div class="card" style="margin-top:14px">'
      + '<h2 style="margin:0 0 4px;font:500 19px/1.2 var(--f-display)">Or type them in</h2>'

      + installCard()

      /* Rewritten when sign-in arrived. The old wording promised there was no

      + '<p class="step" style="font-size:14px;color:var(--muted);margin:0 0 8px">'
      + '<b style="display:inline;color:var(--ink)">Signed out</b> \u2014 in this browser, '

      + '<p class="step" style="font-size:14px;color:var(--muted);margin:0 0 8px">'

      + 'anywhere.</p>'
      + '</div>';

    var a = $("mark");
    a.setAttribute("href", marklet());
    a.addEventListener("click", function (e) {
      e.preventDefault();

  function addPasted() {
    var lines = $("paste").value.split("\n");
    var deck = $("pasteDeck").value || "Inbox";
    if (deck === "__new") {
      deck = (prompt("Name the new deck") || "").trim()
               .replace(/\s+/g, " ").slice(0, 40) || "Inbox";
      if (deck !== "Inbox") putDeck(deck, SPACE, false);
    }
    var added = 0, dup = 0, long = 0, junk = 0, i;
    for (i = 0; i < lines.length; i++) {
      var term = lines[i].trim().replace(/\s+/g, " ");
      if (!term) continue;
      /* A whole sentence is not a vocabulary word. Say so rather than
         dropping the line without a word about it. */
      if (term.length > 80) { long++; continue; }
      var r = addWord(term, deck, {});
      if (r === "added") added++;
      else if (r === "junk") junk++;
      else dup++;
    }
    if (!added && !dup && !long && !junk) { toast("Nothing to add."); return; }
    save();
    $("paste").value = "";
    counts(); renderAll(); renderDecks(); renderDue();
    toast(added + " added" + (dup ? ", " + dup + " already there" : "")
        + (long ? ", " + long + " too long to be a word" : "")
        + (junk ? ", " + junk + " with no letters in" : "") + ".");
  }

  /* Returns "added", "dup" or "junk" — the caller counts them separately, so
     a rejected line is not reported as one she already had. */
  function addWord(term, deck, src) {
    /* "???" is not a word, and Wiktionary will cheerfully define it. */
    if (!/[A-Za-z\u00C0-\u024F]/.test(term)) return "junk";
    /* Scoped to the language: "die" is an English verb and a German article,
       and saving one must not be refused because the other is already here.
       The id carries the language for the same reason. */
    /* idOf(term), not SPACE + ":" + idOf(term). normalize() recomputes
       every id as idOf(term) on the next load, so a word added with a
       language in front of its id silently changed identity the moment the
       page was reloaded -- and three things went wrong at once. A round
       restored after a reload dropped every word added during it, because
       the queue had been written down under the old ids. The duplicate
       check here never matched, so it was doing nothing and hasForm was
       quietly carrying it. And the word went to the server twice, under
       both ids, so the other device got two cards for one word.

       Fixed by agreeing with normalize rather than by changing it: every
       word already stored, here and on the server, keeps the id it has.
       The cost is that ids are not scoped by language, so the same spelling
       in two spaces -- English "die", German "die" -- is one card. That was
       already true after any reload; it is now true immediately. Scoping
       them properly means migrating every id on both sides, which is not
       something to do quietly underneath a list she relies on. */
    var id = idOf(term), i, mine = here();
    for (i = 0; i < mine.length; i++) {
      if (mine[i].id === id || hasForm(mine[i], term)) return "dup";
    }
    db.words.unshift({
      id: id, term: term, lang: SPACE, added: new Date().toISOString(),
      deck: deck || "Inbox", box: 1, due: today(),
      src: src || {}, senses: [], looked: false, note: "", forms: [term]
    });
    return "added";
  }

  function fillDeckSelect(sel, current, withNew) {
    var list = decks(), names = list.map(function (d) { return d.name; });
    if (names.indexOf("Inbox") < 0) names.unshift("Inbox");
    var o = "", i;
    for (i = 0; i < names.length; i++) {
      o += '<option value="' + esc(names[i]) + '"'
         + (names[i] === current ? ' selected' : '') + '>' + esc(names[i]) + '</option>';
    }
    if (withNew) o += '<option value="__new">New deck…</option>';
    sel.innerHTML = o;
  }

  /* ------------------------------------------------------------------
     Chrome
     ------------------------------------------------------------------ */
  function counts() {
    /* While a sitting is live the honest answer to "is there anything to do"
       is what is left in it — not the day's total, which over-promises at the
       start and reads as "finished" while a card is still on screen. */
    $("nDue").textContent = session.length || dueNow().length;
    $("nAll").textContent = here().length;
    $("nDecks").textContent = decks().length;
  }

  function fillFilter() {
    var cur = $("fDeck").value;
    var list = decks(), o = '<option value="">All decks</option>', i;
    for (i = 0; i < list.length; i++) {
      /* The value must be the deck name, not the label: the label carries a
         count, and a select with no value attribute reports its own text —
         so filtering compared "Inbox (8)" against "Inbox" and found nothing. */
      o += '<option value="' + esc(list[i].name) + '"'
         + (list[i].name === cur ? ' selected' : '') + '>'
         + esc(list[i].name) + ' (' + list[i].n + ')</option>';
    }
    $("fDeck").innerHTML = o;
  }

  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".tab") : null;
    if (!b) return;
    var k = b.getAttribute("data-tab"), keys = ["due", "all", "decks", "add"], i;
    for (i = 0; i < keys.length; i++) {
      var on = keys[i] === k;
      document.querySelector('.tab[data-tab="' + keys[i] + '"]').setAttribute("aria-selected", on ? "true" : "false");
      $("p-" + keys[i]).hidden = !on;
    }
    if (k === "all") { fillFilter(); renderAll(); }
    if (k === "decks") renderDecks();
    if (k === "add") renderAdd();
    if (k === "due") renderDue();
  });

  $("fDeck").addEventListener("change", renderAll);
  $("fSort").addEventListener("change", renderAll);

  document.addEventListener("click", function (e) {
    /* closest, not the target itself: a button with a span inside it would
       otherwise swallow the click, because the span carries no attribute. */
    var get = function (k) {
      var el = e.target.closest ? e.target.closest("[" + k + "]") : null;
      return el ? el.getAttribute(k) : null;
    };

    var sayId = get("data-say");
    if (sayId) {
      for (var si = 0; si < db.words.length; si++) {
        if (db.words[si].id === sayId) {
          var sw = db.words[si];
          /* Nothing fetched yet — get it, then play it, so the first press
             works rather than teaching her the button is broken. */
          if (needsSay(sw)) ensureSay(sw, function () { speak(sw); renderAll(); renderDue(); });
          else speak(sw);
          break;
        }
      }
      return;
    }

    var noteId = get("data-note");
    if (noteId) {
      editingNote = (editingNote === noteId) ? null : noteId;
      renderAll();
      if (editingNote && $("rowNote")) $("rowNote").focus();
      return;
    }
    var saveId = get("data-note-save");
    if (saveId) {
      var box = $("rowNote"), k;
      for (k = 0; k < db.words.length; k++) {
        if (db.words[k].id === saveId) {
          db.words[k].note = box ? box.value.trim().slice(0, 2000) : "";
          toast(db.words[k].note ? "Note saved." : "Note cleared.");
        }
      }
      save(); editingNote = null; renderAll(); renderDue();
      return;
    }
    if (get("data-note-cancel")) { editingNote = null; renderAll(); return; }

    var del = get("data-del");
    if (del) {
      /* A tombstone, not a disappearance: a row that simply vanishes here is
         handed straight back by whichever device has not synced yet. */
      for (var dz = 0; dz < db.words.length; dz++) {
        if (db.words[dz].id === del) {
          db.gone = db.gone || [];
          db.gone.push({ id: del, deleted: true, updated: Date.now() });
          break;
        }
      }
      db.words = db.words.filter(function (w) { return w.id !== del; });
      session = session.filter(function (w) { return w.id !== del; });
      saveSession();
      if (editingNote === del) editingNote = null;
      /* Turn the study card back over. Leaving it flipped showed the next
         word's back, and the lookup only fires from the front, so that
         card sat on "Looking it up..." for good. */
      flipped = false;
      save(); counts(); fillFilter(); renderAll(); renderDecks(); renderDue();
      toast("Removed.");
      return;
    }
    /* An inline field rather than prompt(). Chrome suppresses page dialogs
       outright once "prevent this page from creating additional dialogs" has
       been ticked, and then Rename silently did nothing at all. */
    var ren = get("data-rename");
    if (ren) {
      renaming = ren;
      renderDecks();
      var box = $("deckName");
      if (box) { box.focus(); box.select(); }
      return;
    }
    if (get("data-rencancel")) { renaming = null; renderDecks(); return; }
    var rs = get("data-rensave");
    if (rs) { saveDeckName(rs); return; }

    if (e.target && e.target.id === "newDeckGo") { makeDeck(); return; }

    var dd = get("data-deckdel");
    if (dd) { dropDeck(dd); return; }

    var dg = get("data-deckgo");
    if (dg) { studyDeck(dg); return; }

    /* Asked again on purpose, so the three-try ceiling is not a dead end. */
    if (e.target && e.target.id === "lookAgain") {
      var lw = session[0];
      if (lw) {
        lw.miss = 0; lw.looked = false; lw.lv = 0;
        save();
        ensureLooked(lw, function () { renderDue(); });
        renderDue();
      }
      return;
    }

    if (e.target && e.target.id === "allDecks") {
      onlyDeck = "";
      session = []; done = 0; misses = {}; almost = {};
      saveSession();
      counts(); renderDue();
      return;
    }
  });

  /* Study one deck. The sitting restarts, because a round already under way
     was built from a different set of words -- unless it was built from
     these ones. Pressing Study on the deck she is already in is how she
     comes back to it after adding a word, not a request to begin again, and
     restarting there threw away the count and the cards that had come round
     once already. */
  function studyDeck(name) {
    var b = document.querySelector('.tab[data-tab="due"]');
    if (onlyDeck === name && session.length) {
      if (b) b.click();
      renderDue();
      return;
    }
    onlyDeck = name;
    session = []; done = 0; misses = {}; almost = {};
    if (b) b.click();
    startSession();
    if (!session.length) renderDue();
  }

  function makeDeck() {
    var box = $("newDeck");
    var name = box ? box.value.trim().replace(/\s+/g, " ").slice(0, 40) : "";
    if (!name) { toast("Give the deck a name first."); return; }
    var dl = decks(), i;
    for (i = 0; i < dl.length; i++) if (dl[i].name === name) {
      toast("\u201c" + name + "\u201d already exists."); return;
    }
    putDeck(name, SPACE, false);
    if (box) box.value = "";
    save(); renderDecks(); fillFilter(); counts();
    toast("\u201c" + name + "\u201d is ready. Nothing in it yet.");
  }

  /* Deleting a deck never deletes words -- they go back to Inbox, which is
     what Inbox is for. Said out loud, because the words move whether or not
     that is what she pictured. */
  function dropDeck(name) {
    if (name === "Inbox") return;
    var moving = 0;
    here().forEach(function (w) { if ((w.deck || "Inbox") === name) moving++; });
    if (moving && !confirm("Delete \u201c" + name + "\u201d? Its " + moving
        + (moving === 1 ? " word goes" : " words go") + " back to Inbox \u2014 "
        + "nothing is lost.")) return;
    here().forEach(function (w) {
      if ((w.deck || "Inbox") === name) { w.deck = "Inbox"; mark(w.id); }
    });
    putDeck(name, SPACE, true);
    if (renaming === name) renaming = null;
    if ($("fDeck") && $("fDeck").value === name) $("fDeck").value = "";
    save(); renderDecks(); fillFilter(); renderAll(); counts();
    toast(moving ? "Deleted. " + moving + " word" + (moving === 1 ? "" : "s")
                   + " back in Inbox." : "Deleted.");
  }

  /* Enter creates, the same way Enter saves a rename. */
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.id === "newDeck" && e.key === "Enter") {
      e.preventDefault(); makeDeck();
    }
  });

  function saveDeckName(was) {
    var box = $("deckName");
    var name = box ? box.value.trim().replace(/\s+/g, " ").slice(0, 40) : "";
    if (!name || name === was) { renaming = null; renderDecks(); return; }

    /* Renaming onto a name that exists merges the two decks, and there is no
       undo, so it is said out loud first. */
    var taken = false, dl = decks(), di;
    for (di = 0; di < dl.length; di++) if (dl[di].name === name) taken = true;
    var moving = 0;
    here().forEach(function (w) { if ((w.deck || "Inbox") === was) moving++; });
    if (taken && !confirm('“' + name + '” already exists. Merge '
          + moving + ' word' + (moving === 1 ? '' : 's') + ' into it?')) return;

    here().forEach(function (w) {
      if ((w.deck || "Inbox") === was) { w.deck = name; mark(w.id); }
    });
    /* The stored deck moves with its words. Left behind, the old name would
       come back as an empty deck the moment the list was next assembled. */
    if (was !== "Inbox") putDeck(was, SPACE, true);
    putDeck(name, SPACE, false);
    renaming = null;
    save(); renderDecks(); fillFilter(); renderAll(); counts();
    toast(taken ? "Merged." : "Renamed.");
  }

  /* Enter saves, Escape gives up — a text field should behave like one. */
  document.addEventListener("keydown", function (e) {
    if (!e.target || e.target.id !== "deckName") return;
    if (e.key === "Enter") { e.preventDefault(); saveDeckName(renaming); }
    else if (e.key === "Escape") { renaming = null; renderDecks(); }
  });

  document.addEventListener("change", function (e) {
    var id = e.target.getAttribute && e.target.getAttribute("data-deck");
    if (!id) return;
    var v = e.target.value;
    if (v === "__new") {
      v = (prompt("Name the new deck") || "").trim().replace(/\s+/g, " ").slice(0, 40);
      if (!v) { renderAll(); return; }
      putDeck(v, SPACE, false);
    }
    db.words.forEach(function (w) { if (w.id === id) { w.deck = v; mark(w.id); } });
    save(); fillFilter(); renderAll(); renderDecks(); counts();
    toast("Moved to " + v + ".");
  });

  $("theme").addEventListener("click", function () {
    var r = document.documentElement;
    var now = r.getAttribute("data-theme");
    var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = now ? (now === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
    r.setAttribute("data-theme", next);
    try { localStorage.setItem("vocab.theme", next); } catch (e) {}
  });

  $("export").addEventListener("click", function () {
    if (!db.words.length && !deckList().length) {
      toast("Nothing to export yet."); return;
    }
    /* Deliberately every language: a backup of one space is not a backup. */
    var blob = new Blob([JSON.stringify(db, null, 1)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "vocabulary-" + today() + ".json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  });

  /* The other half of Export. Everything lives in one browser, so without
     this the export file is a dead end and a cleared browser loses the lot.
     Nothing already here is overwritten: an import can only add. */
  $("import").addEventListener("click", function () {
    if (DEMO) { toast("This is the demo \u2014 import is off here."); return; }
    $("file").click();
  });

  $("file").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = "";                 /* so the same file can be picked twice */
    if (!f) return;
    if (f.size > 8 * 1024 * 1024) { toast("That file is too big to be a word list."); return; }

    var r = new FileReader();
    r.onerror = function () { toast("Could not read that file."); };
    r.onload = function () {
      var parsed;
      try { parsed = JSON.parse(String(r.result)); }
      catch (err) { toast("That is not a vocabulary export \u2014 it is not JSON."); return; }

      var list = normalize(parsed && parsed.words);
      if (!list.length) { toast("No words in that file."); return; }

      /* An empty deck is in the file and in nothing else, so without this an
         export and an import round trip would quietly lose it. */
      var fileDecks = normalizeDecks(parsed && parsed.decks), fd;
      for (fd = 0; fd < fileDecks.length; fd++) {
        if (!deckRec(fileDecks[fd].name, fileDecks[fd].lang))
          deckList().push(fileDecks[fd]);
      }

      var have = {}, i, ff, k;
      for (i = 0; i < db.words.length; i++) {
        have[db.words[i].id] = 1;
        /* an imported "plunged" is already here as a form of "plunge" */
        ff = formsOf(db.words[i]);
        for (k = 0; k < ff.length; k++) have[idOf(ff[k])] = 1;
      }

      var added = 0, skipped = 0;
      for (i = 0; i < list.length; i++) {
        if (have[list[i].id]) { skipped++; continue; }
        have[list[i].id] = 1;
        db.words.unshift(list[i]);
        added++;
      }

      if (!added) {
        toast("Nothing new \u2014 all " + skipped + " of those are already here.");
        return;
      }
      save();
      counts(); fillFilter(); renderAll(); renderDecks(); renderDue();
      toast(added + " word" + (added === 1 ? "" : "s") + " imported"
          + (skipped ? ", " + skipped + " already here and left alone" : "") + ".");
    };
    r.readAsText(f);
  });

  $("wipe").addEventListener("click", function () {
    /* The demo is embedded on the homepage. It writes nothing, so it has no
       business deleting anything either — and what it would delete is the
       visitor's own list, which cannot be got back. */
    if (DEMO) { toast("This is the demo \u2014 nothing here to clear."); return; }
    if (!confirm("Delete every word stored in this browser?")) return;
    db = { v: 1, words: [] };
    try { localStorage.removeItem(KEY); } catch (e) {}
    session = []; flipped = false; done = 0; misses = {}; almost = {};
    saveSession();
    counts(); fillFilter(); renderAll(); renderDecks(); renderDue();
    toast("Cleared.");
  });

  /* ------------------------------------------------------------------
     Demo: invented words so the homepage card shows the real thing
     working. Writes nothing.
     ------------------------------------------------------------------ */
  function demoData() {
    var w = [
      ["salient", "Reading", "The report is not exhaustive, but it covers the salient points.",
       "https://example.com", "A note on strategy"],
      ["due diligence", "Finance", "The buyer walked away after due diligence turned up the lawsuit.",
       "https://example.com", "Deal memo"],
      ["ubiquitous", "Reading", "Screens are now ubiquitous in classrooms.",
       "https://example.com", "An essay on attention"],
      ["hedge", "Finance", "The fund used options to hedge against a fall in the lira.",
       "https://example.com", "Markets weekly"]
    ];
    var out = { v: 1, words: [] };
    for (var i = 0; i < w.length; i++) {
      out.words.push({
        id: idOf(w[i][0]), term: w[i][0],
        added: new Date(Date.now() - i * 86400000).toISOString(),
        deck: w[i][1], box: 1, due: today(),
        src: { sentence: w[i][2], url: w[i][3], title: w[i][4] },
        senses: [], looked: false, note: ""
      });
    }
    return out;
  }

  /* ------------------------------------------------------------------
     Boot
     ------------------------------------------------------------------ */
  try {
    var saved = localStorage.getItem("vocab.theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) {}

  load();
  /* Before the first count, so a round left half-finished this morning is
     what the Study badge reports rather than the day's untouched total. */
  if (!DEMO) resumeSession();
  counts();
  fillFilter();
  /* One way in: the Start screen, which says how many are waiting and how
     many this sitting will hold. Starting automatically here meant a reload
     dropped you straight onto a card while adding a word showed Start —
     the same situation with two different screens. The demo still opens on
     a card, because that is what the homepage is showing off. */
  renderSpaces();
  if (DEMO) startSession(); else renderDue();

  /* Offline. Registered last and failing silently: a browser without service
     workers, or one that refuses, simply has a page that needs the network. */
  if (!DEMO && "serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/flashcards/sw.js", { scope: "/flashcards/" })
        .catch(function () {});
    });
  }

  /* Last, and without blocking anything above it: the page is fully usable
     before this answers, and stays usable if it never does. */
  if (!DEMO) {
    fetch("/auth/me", { headers: { accept: "application/json" } })
      .then(function (r) { return r.json(); })
      .then(function (who) {
        me = who;
        renderAccount();
        if (me.signedIn) syncNow();
      })
      .catch(function () { me = { signedIn: false }; renderAccount(); });
  }
})();
</script>
</body>
</html>
